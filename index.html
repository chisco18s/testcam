<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Kinect Pro: Structured Avatar</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #video-monitor { 
        position: absolute; bottom: 20px; left: 20px; width: 160px; height: 120px; 
        z-index: 10; opacity: 0.7; border: 2px solid #00f2ff; border-radius: 10px; transform: scaleX(-1);
    }
    #3d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%); }
    #loading-overlay {
        position: absolute; inset: 0; background: #000; z-index: 100; display: flex;
        align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.5s;
    }
    .loader-text { color: #00f2ff; font-family: monospace; font-size: 1.5rem; letter-spacing: 2px; margin-top: 20px; }
    .spinner { width: 50px; height: 50px; border: 3px solid rgba(0,242,255,0.3); border-radius: 50%; border-top-color: #00f2ff; animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loader-text">INICIALIZANDO SISTEMA 3D...</div>
  </div>

  <video id="video-monitor" playsinline muted autoplay></video>
  <div id="3d-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- CONFIGURACIÓN ---
    const VISIBLE_JOINTS = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
    // Definimos qué puntos conectan con qué puntos para formar "huesos"
    const SKELETON_CONNECTIONS = [
        [11, 12], // Hombros (Clavícula)
        [11, 13], [13, 15], // Brazo Izquierdo
        [12, 14], [14, 16], // Brazo Derecho
        [11, 23], [12, 24], // Torso vertical
        [23, 24], // Cadera
        [23, 25], [25, 27], // Pierna Izquierda
        [24, 26], [26, 28]  // Pierna Derecha
    ];

    // --- VARIABLES GLOBALES ---
    let renderer, scene, camera, clock;
    let jointMeshes = {}; // Mapa de esferas (articulaciones)
    let boneMeshes = [];  // Array de cilindros (huesos)
    let poseDetector;
    const videoMonitor = document.getElementById('video-monitor');
    const loadingOverlay = document.getElementById('loading-overlay');

    // =========================================
    // PARTE 1: MOTOR GRÁFICO (THREE.JS)
    // =========================================
    function initThreeJS() {
        clock = new THREE.Clock();
        const container = document.getElementById('3d-container');
        
        // 1. Escena y Atmósfera
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.08); // Niebla densa para profundidad

        // 2. Cámara Profesional
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.4, 3.5); // Altura de ojos humana, un poco atrás
        camera.lookAt(0, 1, 0);

        // 3. Iluminación Dramática
        const ambient = new THREE.HemisphereLight(0x00f2ff, 0x000000, 0.3); // Luz ambiental azulada
        scene.add(ambient);

        const keyLight = new THREE.SpotLight(0xffffff, 1);
        keyLight.position.set(2, 5, 5);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048; // Sombras nítidas
        keyLight.shadow.mapSize.height = 2048;
        scene.add(keyLight);

        const rimLight = new THREE.PointLight(0x7000ff, 2, 10); // Luz de contorno violeta
        rimLight.position.set(-3, 2, -3);
        scene.add(rimLight);

        // 4. Renderizador de Alta Calidad
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limitar pixel ratio para rendimiento
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // 5. Escenario (Suelo Reflectante)
        const grid = new THREE.GridHelper(20, 40, 0x00f2ff, 0x111111);
        grid.position.y = -1; // Bajar el suelo
        scene.add(grid);
        
        const planeGeo = new THREE.PlaneGeometry(50, 50);
        const planeMat = new THREE.MeshStandardMaterial({ 
            color: 0x000000, roughness: 0.1, metalness: 0.8 // Suelo tipo espejo oscuro
        });
        const floor = new THREE.Mesh(planeGeo, planeMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.01;
        floor.receiveShadow = true;
        scene.add(floor);

        createAvatarSkeleton();
        animate();
    }

    function createAvatarSkeleton() {
        // MATERIALES PROFESIONALES
        // Articulaciones: Metal pulido
        const jointMat = new THREE.MeshStandardMaterial({
            color: 0xaaaaaa,
            roughness: 0.2,
            metalness: 1.0,
            envMapIntensity: 1.5
        });
        // Huesos: Luz de Neón (Emisivo)
        const boneMat = new THREE.MeshStandardMaterial({
            color: 0x000000,
            emissive: 0x00f2ff,
            emissiveIntensity: 0.8,
            roughness: 0.1,
            metalness: 0.5,
            transparent: true, opacity: 0.9
        });

        // Geometrías Reutilizables
        const jointGeo = new THREE.SphereGeometry(0.04, 32, 32); // Articulaciones pequeñas (4cm)
        // Importante: El cilindro debe crecer en el eje Y y tener el pivote en el centro para facilitar la rotación
        const boneGeoBase = new THREE.CylinderGeometry(0.02, 0.02, 1, 16);
        boneGeoBase.translate(0, 0.5, 0); // Mover el pivote a la base del cilindro

        // 1. Crear Articulaciones (Esferas)
        VISIBLE_JOINTS.forEach(index => {
            const mesh = new THREE.Mesh(jointGeo, jointMat);
            mesh.castShadow = true;
            scene.add(mesh);
            jointMeshes[index] = mesh;
        });

        // 2. Crear Huesos (Cilindros)
        SKELETON_CONNECTIONS.forEach(connection => {
            // Creamos un cilindro para cada conexión definida
            const bone = new THREE.Mesh(boneGeoBase, boneMat);
            bone.castShadow = true;
            scene.add(bone);
            // Guardamos la referencia del hueso y qué índices conecta
            boneMeshes.push({ mesh: bone, startIdx: connection[0], endIdx: connection[1] });
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        // Efecto sutil de "respiración" en la intensidad del neón
        boneMeshes.forEach(b => {
             b.mesh.material.emissiveIntensity = 0.8 + Math.sin(time * 2) * 0.2;
        });
        renderer.render(scene, camera);
    }


    // =========================================
    // PARTE 2: INTELIGENCIA ARTIFICIAL (MEDIAPIPE)
    // =========================================
    async function initAI() {
        poseDetector = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        poseDetector.setOptions({
            modelComplexity: 1, // Balance entre velocidad y precisión
            smoothLandmarks: true, // Movimientos suaves
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        poseDetector.onResults(updateAvatar);

        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
        videoMonitor.srcObject = stream;
        await new Promise(r => videoMonitor.onloadedmetadata = r);
        videoMonitor.play();

        // Ocultar loading cuando todo esté listo
        loadingOverlay.style.opacity = 0;
        setTimeout(() => loadingOverlay.style.display = 'none', 500);

        startDetectionLoop();
    }

    const startDetectionLoop = async () => {
        if(videoMonitor.readyState >= 2) await poseDetector.send({image: videoMonitor});
        requestAnimationFrame(startDetectionLoop);
    };


    // =========================================
    // PARTE 3: EL PUENTE (MATEMÁTICAS VECTORIALES)
    // =========================================
    
    // Vectores auxiliares reutilizables para no saturar la memoria
    const vStart = new THREE.Vector3();
    const vEnd = new THREE.Vector3();
    const vDir = new THREE.Vector3();
    const upAxis = new THREE.Vector3(0, 1, 0); // Eje Y positivo (hacia donde crece nuestro cilindro base)

    function updateAvatar(results) {
        // Usamos WorldLandmarks (metros reales) para 3D
        if (!results.poseWorldLandmarks) return;
        const lm = results.poseWorldLandmarks;

        // 1. Actualizar posición de las Articulaciones (Esferas)
        VISIBLE_JOINTS.forEach(idx => {
            if(jointMeshes[idx] && lm[idx]) {
                // Mapeo de coordenadas MediaPipe -> Three.js
                // Invertimos X para efecto espejo, Invertimos Y porque en MP abajo es positivo
                // Z se mantiene (profundidad)
                // Offset Y (+0.5) para subir el personaje y que no atraviese el suelo
                jointMeshes[idx].position.set(-lm[idx].x, -lm[idx].y + 0.5, -lm[idx].z);
            }
        });

        // 2. Actualizar Huesos (Cilindros) - AQUÍ ESTÁ LA MAGIA MATEMÁTICA
        boneMeshes.forEach(boneData => {
            const mesh = boneData.mesh;
            const startJoint = jointMeshes[boneData.startIdx];
            const endJoint = jointMeshes[boneData.endIdx];

            if(startJoint && endJoint && lm[boneData.startIdx].visibility > 0.6 && lm[boneData.endIdx].visibility > 0.6) {
                mesh.visible = true;
                
                // A. Obtener posiciones de inicio y fin en el mundo 3D
                vStart.copy(startJoint.position);
                vEnd.copy(endJoint.position);

                // B. Posicionar el hueso: Su base empieza en la articulación inicial
                mesh.position.copy(vStart);

                // C. Calcular la distancia para la escala (longitud del hueso)
                const distance = vStart.distanceTo(vEnd);
                // Como nuestro cilindro base mide 1 unidad de alto, escalamos Y por la distancia
                mesh.scale.set(1, distance, 1);

                // D. Orientación (Cuaterniones): Rotar el cilindro para que apunte al final
                // 1. Calcular vector dirección normalizado
                vDir.subVectors(vEnd, vStart).normalize();
                // 2. Crear una rotación que alinee el eje Y (upAxis) con el vector dirección
                mesh.quaternion.setFromUnitVectors(upAxis, vDir);
                
            } else {
                mesh.visible = false; // Ocultar hueso si la IA pierde los puntos
            }
        });
    }

    // Manejo de redimensionado
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // INICIO DEL SISTEMA
    initThreeJS(); // Arranca el motor gráfico
    initAI();      // Arranca la visión por computador
  </script>
</body>
</html>
