<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPECTRAL AI v9 - VOLUMETRIC</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <style>
        :root { --main: #00ff41; --danger: #ff0000; --ui-color: var(--main); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: #000; color: var(--ui-color); overflow: hidden; width: 100vw; height: 100vh; transition: 0.3s; }

        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.6; }
        #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* HUD Superior */
        #hud-top { 
            position: absolute; top: 0; width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr;
            z-index: 20; padding: 50px 15px 15px; background: rgba(0,0,0,0.8);
            border-bottom: 1px solid var(--ui-color);
        }
        .val { font-size: 14px; font-weight: bold; display: block; }
        .label { font-size: 8px; text-transform: uppercase; opacity: 0.7; }

        /* Tag de Entidad Dinámico */
        .entity-tag { 
            position: absolute; color: #fff; padding: 5px 12px; border: 1px solid #fff;
            background: var(--danger); z-index: 40; font-size: 11px; font-weight: bold;
            pointer-events: none; box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }

        .bottom-ui { 
            position: fixed; bottom: 0; width: 100%; height: 80px; background: #000;
            z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            border-top: 1px solid var(--ui-color);
        }
        .capture-btn { width: 60px; height: 60px; background: var(--danger); border: 4px solid #fff; border-radius: 50%; }

        #start-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1 style="color:var(--main); letter-spacing: 5px;">SPECTRAL AI v9</h1>
    <p style="font-size: 10px; margin-bottom: 20px;">VOLUMETRIC ANALYSIS SYSTEM</p>
    <button onclick="init()" style="background:none; border:1px solid var(--main); color:var(--main); padding:15px 30px;">INICIAR PROTOCOLO</button>
</div>

<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud-top">
    <div style="text-align:center"><span class="label">MAG_EMF</span><span id="emf" class="val">0.00</span></div>
    <div style="text-align:center"><span class="label">VOLUMEN</span><span id="vol-type" class="val">SCAN...</span></div>
    <div style="text-align:center"><span class="label">AUDIO_FRQ</span><span id="audio-lvl" class="val">0%</span></div>
</div>

<div id="entity-tag" class="entity-tag" style="display:none"></div>

<div class="bottom-ui">
    <div id="status-info" style="font-size: 8px;">MESH: SOLID<br>OBJ_ID: NONE</div>
    <button class="capture-btn" onclick="takePhoto()"></button>
    <div style="text-align:right"><span id="clock" style="font-size: 14px; color:#fff">00:00:00</span></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tag = document.getElementById('entity-tag');
    let audioCtx, analyser, dataArray;
    
    let activeEntity = null;

    // Lógica de clasificación por tamaño
    function classifySize(height) {
        if (height > 0.7) return { cat: "COLOSO / CLASE-A", name: "ENTIDAD MAYOR" };
        if (height > 0.4) return { cat: "HUMANOIDE / CLASE-B", name: "ESPECTRO ESTÁNDAR" };
        return { cat: "INFANTE / RESIDUO", name: "MICRO-MANIFESTACIÓN" };
    }

    async function init() {
        document.getElementById('start-screen').style.display = 'none';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
        video.srcObject = stream;
        video.play();
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
        pose.onResults(onResults);

        const frame = async () => {
            if(video.readyState === 4) await pose.send({ image: video });
            requestAnimationFrame(frame);
        };
        frame();
        setInterval(() => { 
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
            updateAudioData();
        }, 100);
    }

    function onResults(res) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (res.poseLandmarks) {
            // Calcular tamaño (Y del pie - Y de la cabeza)
            const height = Math.abs(res.poseLandmarks[32].y - res.poseLandmarks[0].y);

            if (!activeEntity) {
                const data = classifySize(height);
                activeEntity = { 
                    ...data, 
                    id: "SP-" + Math.floor(Math.random()*9999) 
                };
                document.body.style.setProperty('--ui-color', 'var(--danger)');
                navigator.vibrate([100, 50, 100]);
            }

            drawSolidMesh(res.poseLandmarks);
            document.getElementById('vol-type').innerText = activeEntity.cat;
            document.getElementById('status-info').innerHTML = `MESH: SOLID<br>OBJ_ID: ${activeEntity.id}`;
        } else {
            if (activeEntity) {
                activeEntity = null;
                document.body.style.setProperty('--ui-color', 'var(--main)');
                tag.style.display = 'none';
                document.getElementById('vol-type').innerText = "SCAN...";
            }
        }
    }

    function drawSolidMesh(lm) {
        const head = lm[0];
        tag.style.display = 'block';
        tag.style.left = (head.x * canvas.width) + 'px';
        tag.style.top = (head.y * canvas.height - 50) + 'px';
        tag.innerText = `[${activeEntity.name}]`;

        // DIBUJO DE RELLENO VOLUMÉTRICO
        ctx.beginPath();
        ctx.fillStyle = "rgba(255, 0, 0, 0.2)"; // Color del cuerpo detectado
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 1;

        // Crear una ruta que conecte los puntos exteriores para rellenar
        lm.forEach((p, i) => {
            const x = p.x * canvas.width;
            const y = p.y * canvas.height;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            
            // Dibujar puntos de articulación
            ctx.save();
            ctx.fillStyle = "#fff";
            ctx.fillRect(x-1, y-1, 3, 3);
            ctx.restore();
        });

        ctx.closePath();
        ctx.fill(); // Rellena la silueta
        ctx.stroke(); // Dibuja el contorno

        // Efecto de escaneo de líneas internas
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        for(let i=0; i<lm.length; i+=2) {
            ctx.moveTo(lm[i].x * canvas.width, lm[i].y * canvas.height);
            if(lm[i+1]) ctx.lineTo(lm[i+1].x * canvas.width, lm[i+1].y * canvas.height);
        }
        ctx.stroke();
    }

    function updateAudioData() {
        if (!analyser) return;
        analyser.getByteFrequencyData(dataArray);
        const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
        document.getElementById('audio-lvl').innerText = Math.floor(avg) + "%";
        document.getElementById('emf').innerText = (activeEntity ? 50 + avg : avg/2).toFixed(2);
    }

    function takePhoto() {
        alert("GEOMETRÍA VOLUMÉTRICA ALMACENADA");
    }
</script>
</body>
</html>
