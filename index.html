<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>MobileKinect Pro — Advanced Vision</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    
    .view-container { position: relative; width: 100vw; height: 100vh; background: #000; }
    #video { 
      position: absolute; width: 100%; height: 100%; object-fit: cover;
      /* El transform se maneja dinámicamente en JS */
    }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; }

    /* UI HUD */
    .hud {
      position: absolute; top: 25px; width: 100%; display: flex; 
      justify-content: space-around; z-index: 20; pointer-events: none;
    }
    .data-card {
      background: rgba(0,0,0,0.7); border-top: 3px solid #00f2ff;
      padding: 10px 20px; border-radius: 10px; text-align: center;
      backdrop-filter: blur(5px); min-width: 100px;
    }
    .data-card small { font-size: 10px; text-transform: uppercase; opacity: 0.6; display: block; }
    .data-card b { font-size: 18px; color: #00f2ff; }

    .bottom-ui {
      position: absolute; bottom: 40px; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 20;
    }
    .gesture-indicator {
      background: #00f2ff; color: #000; padding: 5px 20px;
      border-radius: 20px; font-weight: bold; font-size: 14px;
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
    }

    .btn-group { display: flex; gap: 10px; }
    button {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: white; padding: 12px 20px; border-radius: 50px; cursor: pointer;
      font-size: 14px; backdrop-filter: blur(10px); transition: 0.3s;
    }
    button:active { background: #fff; color: #000; }
    button.active { border-color: #00f2ff; background: rgba(0, 242, 255, 0.2); }
  </style>
</head>
<body>

  <div class="view-container">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="hud">
      <div class="data-card"><small>Squats</small><b id="val-squat">0</b></div>
      <div class="data-card"><small>Energía</small><b id="val-power">0%</b></div>
      <div class="data-card"><small>Calorías</small><b id="val-cal">0</b></div>
    </div>

    <div class="bottom-ui">
      <div class="gesture-indicator" id="gesture-out">ESPERANDO DETECCIÓN</div>
      <div class="btn-group">
        <button id="btn-camera">🔄 Girar Cámara</button>
        <button id="btn-ghost">👻 Ghost Mode</button>
        <button id="btn-reset">🗑️ Reset</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const gestureOut = document.getElementById('gesture-out');
    
    let isGhost = false;
    let facing = 'user';
    let count = 0;
    let isDown = false;
    let poseDetector;

    // Conexiones extendidas (incluye cabeza)
    const CONNECTIONS = [
      [0,1], [1,2], [2,3], [0,4], [4,5], [5,6], // Rostro
      [9,10], [11,12], // Hombros
      [11,13], [13,15], [12,14], [14,16], // Brazos
      [11,23], [12,24], [23,24], // Tronco
      [23,25], [25,27], [24,26], [26,28]  // Piernas
    ];

    async function startCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: facing,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });
      
      video.srcObject = stream;
      // Corregir efecto espejo solo si usamos la cámara frontal
      video.style.transform = facing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      
      return new Promise(res => {
        video.onloadedmetadata = () => {
          video.play();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          res();
        };
      });
    }

    function onResults(res) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Si es cámara frontal, invertir el canvas para que coincida con el video
      if (facing === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      if (isGhost) {
        ctx.fillStyle = "black";
        ctx.fillRect(0,0, canvas.width, canvas.height);
      }

      if (res.poseLandmarks) {
        drawSkeleton(res.poseLandmarks);
        processGestures(res.poseLandmarks);
      } else {
        gestureOut.innerText = "BUSCANDO PERSONA...";
      }
      ctx.restore();
    }

    function drawSkeleton(lm) {
      // Dibujar líneas
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#00f2ff";
      ctx.lineCap = "round";
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#00f2ff";

      CONNECTIONS.forEach(([a, b]) => {
        const p1 = lm[a];
        const p2 = lm[b];
        if (p1.visibility > 0.6 && p2.visibility > 0.6) {
          ctx.beginPath();
          ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
          ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
          ctx.stroke();
        }
      });

      // Dibujar puntos
      ctx.shadowBlur = 0;
      ctx.fillStyle = "white";
      lm.forEach((p, i) => {
        if (p.visibility > 0.6) {
          ctx.beginPath();
          ctx.arc(p.x * canvas.width, p.y * canvas.height, i < 11 ? 3 : 5, 0, Math.PI*2);
          ctx.fill();
        }
      });
    }

    function processGestures(lm) {
      const rW = lm[16], lW = lm[15], nose = lm[0], hip = (lm[23].y + lm[24].y)/2, knee = (lm[25].y + lm[26].y)/2;

      // 1. Sentadilla
      const diff = knee - hip;
      if (diff < 0.12 && !isDown) {
        isDown = true;
      } else if (diff > 0.22 && isDown) {
        isDown = false;
        count++;
        document.getElementById('val-squat').innerText = count;
        document.getElementById('val-cal').innerText = (count * 0.4).toFixed(1);
      }

      // 2. Gestos de manos
      if (rW.y < nose.y && lW.y < nose.y) {
        gestureOut.innerText = "¡MODO VICTORIA! ✌️";
      } else if (rW.y < nose.y) {
        gestureOut.innerText = "MANO DERECHA ARRIBA";
      } else if (lW.y < nose.y) {
        gestureOut.innerText = "MANO IZQUIERDA ARRIBA";
      } else if (diff < 0.12) {
        gestureOut.innerText = "SENTADILLA DETECTADA";
      } else {
        gestureOut.innerText = "SISTEMA LISTO";
      }

      // Simular Energía
      document.getElementById('val-power').innerText = Math.floor(Math.random() * 20 + 80) + "%";
    }

    async function init() {
      poseDetector = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });
      
      poseDetector.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.7
      });

      poseDetector.onResults(onResults);

      await startCamera();

      const loop = async () => {
        await poseDetector.send({image: video});
        video.requestVideoFrameCallback(loop);
      };
      loop();
    }

    // Controles
    document.getElementById('btn-camera').onclick = async () => {
      facing = (facing === 'user') ? 'environment' : 'user';
      await startCamera();
    };

    document.getElementById('btn-ghost').onclick = function() {
      isGhost = !isGhost;
      this.classList.toggle('active');
      video.style.opacity = isGhost ? "0" : "1";
    };

    document.getElementById('btn-reset').onclick = () => {
      count = 0;
      document.getElementById('val-squat').innerText = "0";
      document.getElementById('val-cal').innerText = "0";
    };

    init();
  </script>
</body>
</html>
