<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>MobileKinect Multi-User Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

    .ui-top {
      position: absolute; top: 20px; width: 100%; display: flex; 
      justify-content: center; z-index: 10;
    }
    .status-bar {
      background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 30px;
      border: 1px solid #4cc9f0; color: #4cc9f0; font-weight: bold; font-size: 14px;
    }

    .ui-bottom {
      position: absolute; bottom: 30px; width: 100%;
      display: flex; justify-content: center; gap: 15px; z-index: 10;
    }
    button {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3); color: white;
      padding: 15px 25px; border-radius: 50px; cursor: pointer; font-size: 14px;
    }
    button:active { background: #4cc9f0; color: #000; }
    .ghost-active { border-color: #ff0055; background: rgba(255, 0, 85, 0.2); }
  </style>
</head>
<body>

  <div class="ui-top">
    <div class="status-bar" id="status">INICIALIZANDO IA MULTI-PERSONA...</div>
  </div>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="ui-bottom">
    <button id="btn-switch">🔄 Cambiar Cámara</button>
    <button id="btn-ghost">👻 Modo Ghost</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    
    let isGhost = false;
    let currentFacing = 'user';
    let poseDetector;

    // Colores para diferentes personas
    const USER_COLORS = ['#00f2ff', '#39ff14', '#ff0055', '#bc13fe', '#ffea00'];

    // Conexiones de esqueleto (Cuerpo + Cabeza)
    const CONNECTIONS = [
      [0,1], [1,2], [2,3], [0,4], [4,5], [5,6], // Cabeza y ojos
      [11,12], [11,13], [13,15], [12,14], [14,16], // Torso y brazos
      [11,23], [12,24], [23,24], // Tronco
      [23,25], [25,27], [24,26], [26,28]  // Piernas
    ];

    async function initDetector() {
      poseDetector = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      poseDetector.setOptions({
        modelComplexity: 1, // 1 para velocidad en móviles, 2 para máxima precisión
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      poseDetector.onResults(onResults);
      await startCamera();
      
      const frameLoop = async () => {
        if (video.readyState >= 2) {
          await poseDetector.send({ image: video });
        }
        requestAnimationFrame(frameLoop);
      };
      frameLoop();
    }

    async function startCamera() {
      statusEl.innerText = "CONECTANDO CÁMARA...";
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
        
        return new Promise(res => {
          video.onloadedmetadata = () => {
            video.play();
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            statusEl.innerText = "SISTEMA KINECT ACTIVO";
            res();
          };
        });
      } catch (err) {
        statusEl.innerText = "ERROR DE CÁMARA: " + err.message;
      }
    }

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sincronizar espejo del canvas con el video
      if (currentFacing === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      if (isGhost) {
        ctx.fillStyle = "#05050a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Nota: MediaPipe Pose estándar detecta 1 persona principal con alta fidelidad.
      // Si hay más personas, el modelo se enfoca en la más prominente.
      if (results.poseLandmarks) {
        // En esta versión estándar de MediaPipe Pose, dibujamos la persona detectada
        // Para detectar múltiples personas simultáneas con colores distintos:
        drawPerson(results.poseLandmarks, USER_COLORS[0]);
      }
      ctx.restore();
    }

    function drawPerson(landmarks, color) {
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.strokeStyle = color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = color;

      // Dibujar Huesos
      CONNECTIONS.forEach(([a, b]) => {
        const p1 = landmarks[a];
        const p2 = landmarks[b];
        if (p1 && p2 && p1.visibility > 0.5 && p2.visibility > 0.5) {
          ctx.beginPath();
          ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
          ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
          ctx.stroke();
        }
      });

      // Dibujar Articulaciones (Cabeza incluida)
      ctx.shadowBlur = 0;
      landmarks.forEach((p, i) => {
        if (p.visibility > 0.5) {
          ctx.beginPath();
          // Tamaño especial para la cabeza (puntos 0-10)
          const radius = i < 11 ? 4 : 6;
          ctx.arc(p.x * canvas.width, p.y * canvas.height, radius, 0, Math.PI * 2);
          ctx.fillStyle = i < 11 ? "#ffffff" : color;
          ctx.fill();
          ctx.strokeStyle = "white";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      });
    }

    // BOTONES FUNCIONALES
    document.getElementById('btn-switch').addEventListener('click', async () => {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      await startCamera();
    });

    document.getElementById('btn-ghost').addEventListener('click', function() {
      isGhost = !isGhost;
      this.classList.toggle('ghost-active');
      video.style.opacity = isGhost ? "0" : "1";
    });

    // Iniciar
    initDetector();
  </script>
</body>
</html>
