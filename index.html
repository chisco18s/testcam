<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector Pro Traducto</title>
    <style>
        :root {
            --primary: #6200ee;
            --highlight: #ffff00;
        }
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            padding-bottom: 100px;
        }
        #text-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 1.1em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-height: 300px;
        }
        .word { display: inline-block; margin-right: 4px; border-radius: 3px; }
        .active { background-color: var(--highlight); transition: background 0.1s; }
        
        /* Menú Inferior Estilo App */
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #333;
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        .controls { margin-top: 10px; display: none; background: #444; padding: 15px; position: fixed; bottom: 70px; width: 90%; left: 5%; border-radius: 10px;}
    </style>
</head>
<body>

    <div id="text-container">
        Pulsa el botón "Editar" para pegar tu texto en inglés aquí.
    </div>

    <div id="settings" class="controls">
        <label>Velocidad:</label>
        <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
        <br><br>
        <button onclick="translateText()">Traducir a Español</button>
    </div>

    <div class="bottom-menu">
        <button onclick="document.getElementById('settings').style.display = 
            document.getElementById('settings').style.display === 'block' ? 'none' : 'block'">⚙️ Ajustes</button>
        <button onclick="speak()">▶️ Leer</button>
        <button onclick="stop()">⏹️ Parar</button>
        <button onclick="editText()">✏️ Editar</button>
    </div>

    <script>
        let synth = window.speechSynthesis;
        let originalText = "Welcome to your reading app. This is a demonstration of English text to be translated.";
        const container = document.getElementById('text-container');

        function renderText(text) {
            container.innerHTML = text.split(' ').map(word => `<span class="word">${word}</span>`).join(' ');
        }

        renderText(originalText);

        function speak() {
            if (synth.speaking) return;
            const words = document.querySelectorAll('.word');
            const utterance = new SpeechSynthesisUtterance(container.innerText);
            
            // Configurar idioma (Detectar si es inglés o español)
            utterance.lang = 'en-US'; 
            utterance.rate = document.getElementById('rate').value;

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const wordIndex = getWordAtOffset(event.charIndex);
                    highlightWord(wordIndex);
                }
            };

            synth.speak(utterance);
        }

        function getWordAtOffset(offset) {
            const text = container.innerText;
            return text.substring(0, offset).split(' ').length - 1;
        }

        function highlightWord(index) {
            const spans = document.querySelectorAll('.word');
            spans.forEach(s => s.classList.remove('active'));
            if (spans[index]) spans[index].classList.add('active');
        }

        function stop() {
            synth.cancel();
            document.querySelectorAll('.word').forEach(s => s.classList.remove('active'));
        }

        function editText() {
            const newText = prompt("Pega el texto en Inglés aquí:", container.innerText);
            if (newText) {
                originalText = newText;
                renderText(newText);
            }
        }

        async function translateText() {
            const text = container.innerText;
            // Nota: Para una traducción real sin costo, usamos una URL de consulta de Google.
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q=${encodeURI(text)}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                const translated = data[0].map(item => item[0]).join('');
                renderText(translated);
                alert("Texto traducido. Cambia el idioma de lectura a Español en la configuración si es necesario.");
            } catch (e) {
                alert("Error en la traducción.");
            }
        }
    </script>
</body>
</html>
