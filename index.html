<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Spectral AI - Real Entities</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <style>
    :root { --main: #00ff41; --danger: #ff3c3c; --ghost: #00f2ff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
    body { background: #000; color: var(--main); overflow: hidden; position: fixed; width: 100%; height: 100%; }

    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.3) contrast(1.5) sepia(100%) hue-rotate(80deg); opacity: 0.4; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; }

    #hud-top { 
        position: absolute; top: 0; width: 100%; display: flex; justify-content: space-around; 
        z-index: 20; padding: 40px 10px 10px 10px; 
        background: linear-gradient(to bottom, rgba(0,20,0,0.8), transparent);
    }
    .value { font-size: 1.1rem; font-weight: bold; color: white; }

    /* Registro con descripción */
    #registry-console { 
        position: absolute; bottom: 120px; left: 10px; right: 10px; height: 130px; 
        background: rgba(0, 15, 0, 0.6); border-left: 3px solid var(--danger);
        padding: 8px; overflow: hidden; font-size: 10px; z-index: 25;
        display: flex; flex-direction: column-reverse;
    }
    .log-entry { margin-bottom: 5px; animation: slideIn 0.3s ease; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
    .log-name { color: var(--danger); font-weight: bold; font-size: 12px; }
    .log-desc { color: #aaa; font-style: italic; }

    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

    #proximity-bar { position: absolute; right: 10px; top: 25%; width: 8px; height: 40%; border: 1px solid #333; z-index: 20; background: #111; }
    #proximity-fill { width: 100%; height: 0%; background: var(--danger); transition: height 0.3s; box-shadow: 0 0 10px var(--danger); }
    
    .entity-tag { position: absolute; color: white; font-weight: bold; padding: 2px 8px; border: 1px solid var(--danger); background: rgba(255,0,0,0.4); z-index: 40; font-size: 11px; pointer-events: none; }
    
    .bottom-bar { position: fixed; bottom: 0; width: 100%; padding: 15px 20px 30px 20px; background: #000; border-top: 1px solid var(--main); display: flex; justify-content: space-between; align-items: center; z-index: 30; }
    #start-overlay { position: fixed; inset: 0; background: black; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h1 style="color: var(--danger); letter-spacing: 4px;">ARCHIVOS ESPECTRALES</h1>
    <p style="color: #666; margin: 20px 0;">Base de Datos de Entidades Reales v2.1</p>
    <button onclick="initApp()" style="background: transparent; border: 1px solid var(--main); color: var(--main); padding: 15px 30px; font-size: 1rem;">ACCEDER AL SISTEMA</button>
  </div>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="hud-top">
    <div class="data-box"><div style="font-size: 9px">EMF LEVEL</div><div class="value" id="val-emf">0.00</div></div>
    <div class="data-box"><div style="font-size: 9px">AMENAZA</div><div class="value" id="val-threat" style="color:var(--danger)">BAJA</div></div>
  </div>

  <div id="proximity-bar"><div id="proximity-fill"></div></div>
  <div id="registry-console"></div>
  <div id="entity-label" class="entity-tag" style="display:none">ID: DETECTED</div>

  <div class="bottom-bar">
    <div style="font-size: 10px;">ID ENTIDAD ACTIVA<br><span id="timer" style="color:white">00:00:00</span></div>
    <div style="text-align: right; color: var(--main); font-size: 10px;">PROCESADOR SENS-AI<br>CORE: ONLINE</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const registry = document.getElementById('registry-console');
    const entityLabel = document.getElementById('entity-label');

    // BASE DE DATOS DE ENTIDADES REALES
    const REAL_ENTITIES = [
        { name: "Paimon", desc: "Rey del infierno, obediente a Lucifer. Conocido por su voz atronadora." },
        { name: "Valak", desc: "Gran Presidente del infierno. Se manifiesta como un niño con alas de ángel." },
        { name: "The Hat Man", desc: "Sombra alta con sombrero. Reportado mundialmente en parálisis del sueño." },
        { name: "Oni", desc: "Criatura del folclore japonés. Representa la fuerza y la furia destructiva." },
        { name: "Banshee", desc: "Espíritu femenino celta cuyo grito anuncia una muerte inminente." },
        { name: "Zozo", desc: "Entidad reportada frecuentemente en sesiones de Ouija. Altamente hostil." },
        { name: "Succubus", desc: "Entidad que consume la energía vital de sus víctimas durante el sueño." }
    ];

    let currentEntity = null;

    async function initApp() {
        document.getElementById('start-overlay').style.display = 'none';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.play();
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 0, minDetectionConfidence: 0.6 });
        pose.onResults(onResults);

        setInterval(() => { if(video.readyState === 4) pose.send({ image: video }); }, 100);
        setInterval(() => { document.getElementById('timer').innerText = new Date().toLocaleTimeString(); }, 1000);
    }

    function addLog(entity) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-name">${entity.name}</span><br><span class="log-desc">${entity.desc}</span>`;
        registry.prepend(entry);
        if (registry.children.length > 4) registry.lastChild.remove();
    }

    function onResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (results.poseLandmarks) {
            if (!currentEntity) {
                currentEntity = REAL_ENTITIES[Math.floor(Math.random() * REAL_ENTITIES.length)];
                addLog(currentEntity);
                speak(`Precaución. Identificado como ${currentEntity.name}.`);
            }
            drawGhost(results.poseLandmarks);
            updateHUD(true);
        } else {
            currentEntity = null;
            entityLabel.style.display = 'none';
            updateHUD(false);
        }
    }

    function updateHUD(detected) {
        const emf = detected ? (Math.random()*15).toFixed(2) : (Math.random()*0.5).toFixed(2);
        document.getElementById('val-emf').innerText = emf;
        document.getElementById('val-threat').innerText = emf > 10 ? "EXTREMA" : (detected ? "ALTA" : "BAJA");
        document.getElementById('proximity-fill').style.height = (emf * 6) + "%";
    }

    function drawGhost(lm) {
        ctx.strokeStyle = "rgba(255, 0, 0, 0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        lm.forEach((p, i) => {
            const x = p.x * canvas.width;
            const y = p.y * canvas.height;
            if (i === 0) {
                ctx.moveTo(x, y);
                entityLabel.style.display = 'block';
                entityLabel.style.left = x + 'px';
                entityLabel.style.top = (y - 40) + 'px';
                entityLabel.innerText = currentEntity.name;
            }
            ctx.lineTo(x + (Math.random()*10-5), y + (Math.random()*10-5));
            ctx.fillStyle = "white";
            ctx.fillRect(x, y, 2, 2);
        });
        ctx.stroke();
    }

    function speak(txt) {
        const s = new SpeechSynthesisUtterance(txt);
        s.lang = 'es-ES';
        s.pitch = 0.5;
        window.speechSynthesis.speak(s);
    }
  </script>
</body>
</html>
