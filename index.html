<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Kinect Pro Multi-User — Camera Fix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: sans-serif; overflow: hidden; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
    
    .ui { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 10; }
    button {
      background: rgba(255,255,255,0.15); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.3); color: white;
      padding: 15px 25px; border-radius: 50px; cursor: pointer; font-weight: bold;
    }
    button:active { background: #00f2ff; color: #000; }
    .status {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px;
      color: #00f2ff; font-weight: bold; z-index: 10; border: 1px solid #00f2ff;
    }
  </style>
</head>
<body>

  <div class="status" id="status">INICIALIZANDO SISTEMA...</div>
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="ui">
    <button id="btn-camera">🔄 Girar Cámara</button>
    <button id="btn-ghost">👻 Modo Ghost</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    
    let detector;
    let isGhost = false;
    let currentFacing = 'user';
    const COLORS = ['#00f2ff', '#39ff14', '#ff0055', '#ffea00'];

    const CONNECTIONS = [
      [0,1], [0,2], [1,3], [2,4], // Cabeza
      [5,6], [5,7], [7,9], [6,8], [8,10], // Brazos
      [5,11], [6,12], [11,12], // Torso
      [11,13], [13,15], [12,14], [14,16] // Piernas
    ];

    async function init() {
      // 1. Configurar Cámara primero
      await setupCamera();
      
      // 2. Configurar Detector
      const model = poseDetection.SupportedModels.MoveNet;
      detector = await poseDetection.createDetector(model, {
        modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
        enableSmoothing: true
      });
      
      statusEl.innerText = "KINECT MULTI-PERSONA ACTIVO";
      renderLoop();
    }

    async function setupCamera() {
      // Detener tracks anteriores para liberar la cámara
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing, width: { ideal: 640 }, height: { ideal: 480 } }
      });
      
      video.srcObject = stream;
      video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      
      return new Promise(res => {
        video.onloadedmetadata = () => {
          video.play();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          res();
        };
      });
    }

    async function renderLoop() {
      if (detector && video.readyState >= 2) {
        const poses = await detector.estimatePoses(video);
        
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (currentFacing === 'user') {
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        }

        if (isGhost) {
          ctx.fillStyle = "black";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Dibujar hasta 4 personas si existen
        poses.slice(0, 4).forEach((pose, index) => {
          if (pose.score > 0.25) {
            drawSkeleton(pose, COLORS[index]);
          }
        });
        
        ctx.restore();
      }
      requestAnimationFrame(renderLoop);
    }

    function drawSkeleton(pose, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.shadowBlur = 12;
      ctx.shadowColor = color;

      CONNECTIONS.forEach(([i, j]) => {
        const kp1 = pose.keypoints[i];
        const kp2 = pose.keypoints[j];
        if (kp1.score > 0.3 && kp2.score > 0.3) {
          ctx.beginPath();
          ctx.moveTo(kp1.x, kp1.y);
          ctx.lineTo(kp2.x, kp2.y);
          ctx.stroke();
        }
      });

      // Cabeza y puntos clave
      ctx.shadowBlur = 0;
      pose.keypoints.forEach((kp, i) => {
        if (kp.score > 0.3) {
          ctx.beginPath();
          ctx.arc(kp.x, kp.y, i < 5 ? 3 : 5, 0, Math.PI * 2);
          ctx.fillStyle = "white";
          ctx.fill();
        }
      });
    }

    // BOTONES REVISADOS
    document.getElementById('btn-camera').onclick = async () => {
      currentFacing = (currentFacing === 'user') ? 'environment' : 'user';
      statusEl.innerText = "RECONECTANDO CÁMARA...";
      await setupCamera();
      statusEl.innerText = "KINECT MULTI-PERSONA ACTIVO";
    };

    document.getElementById('btn-ghost').onclick = function() {
      isGhost = !isGhost;
      video.style.opacity = isGhost ? "0" : "1";
    };

    init();
  </script>
</body>
</html>
