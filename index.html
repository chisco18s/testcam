<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Kinect AI Multi-User Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: sans-serif; overflow: hidden; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
    
    .ui { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 10; }
    button {
      background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3); color: white;
      padding: 12px 20px; border-radius: 50px; cursor: pointer;
    }
    .status {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px;
      color: #00f2ff; font-weight: bold; z-index: 10; font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="status" id="status">INICIALIZANDO MULTI-POSE...</div>
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="ui">
    <button id="btn-camera">🔄 Girar Cámara</button>
    <button id="btn-ghost">👻 Modo Ghost</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    
    let detector;
    let isGhost = false;
    let currentFacing = 'user';
    const COLORS = ['#00f2ff', '#39ff14', '#ff0055', '#ffea00'];

    // Mapa de conexiones MoveNet (17 puntos clave)
    const CONNECTIONS = [
      [0,1], [0,2], [1,3], [2,4], // Cabeza
      [5,6], [5,7], [7,9], [6,8], [8,10], // Brazos
      [5,11], [6,12], [11,12], // Torso
      [11,13], [13,15], [12,14], [14,16] // Piernas
    ];

    async function setupDetector() {
      const model = poseDetection.SupportedModels.MoveNet;
      detector = await poseDetection.createDetector(model, {
        modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
        enableSmoothing: true
      });
      statusEl.innerText = "KINECT MULTI-PERSONA LISTO";
      startDetection();
    }

    async function setupCamera() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing, width: 640, height: 480 }
      });
      video.srcObject = stream;
      video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      return new Promise(res => video.onloadedmetadata = () => {
        video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        res();
      });
    }

    async function startDetection() {
      const poses = await detector.estimatePoses(video);
      
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Espejo manual para el canvas si es cámara frontal
      if (currentFacing === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      if (isGhost) {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Filtrar hasta 4 personas
      poses.slice(0, 4).forEach((pose, index) => {
        if (pose.score > 0.2) {
          drawPose(pose, COLORS[index]);
        }
      });
      
      ctx.restore();
      requestAnimationFrame(startDetection);
    }

    function drawPose(pose, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.shadowBlur = 10;
      ctx.shadowColor = color;

      // Dibujar esqueleto
      CONNECTIONS.forEach(([i, j]) => {
        const p1 = pose.keypoints[i];
        const p2 = pose.keypoints[j];
        if (p1.score > 0.3 && p2.score > 0.3) {
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      });

      // Dibujar articulaciones
      ctx.shadowBlur = 0;
      pose.keypoints.forEach(kp => {
        if (kp.score > 0.3) {
          ctx.beginPath();
          ctx.arc(kp.x, kp.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "white";
          ctx.fill();
        }
      });
    }

    document.getElementById('btn-camera').onclick = async () => {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      await setupCamera();
    };

    document.getElementById('btn-ghost').onclick = function() {
      isGhost = !isGhost;
      video.style.opacity = isGhost ? "0" : "1";
    };

    window.onload = async () => {
      await setupCamera();
      await setupDetector();
    };
  </script>
</body>
</html>
