<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Kinect AI Pro — Ultra Flow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

    /* HUD Superior */
    .hud-top {
      position: absolute; top: 20px; width: 100%;
      display: flex; justify-content: space-between; padding: 0 25px;
      z-index: 20;
    }
    .metric { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 15px; border-left: 4px solid #00f2ff; }
    .metric span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .metric b { font-size: 20px; color: #00f2ff; }

    /* Panel de Control */
    .controls {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 15px; z-index: 20;
    }
    button {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2); color: white;
      padding: 12px 25px; border-radius: 30px; cursor: pointer; font-weight: bold;
    }
    button:active { background: #00f2ff; color: #000; }

    /* Animación de golpe */
    @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
    .hit-effect {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: white; opacity: 0; pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body>

  <div id="flash" class="hit-effect"></div>
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="hud-top">
    <div class="metric"><span>Movimiento</span><b id="gesture-txt">Buscando...</b></div>
    <div class="metric"><span>Puntos</span><b id="score-txt">0</b></div>
  </div>

  <div class="controls">
    <button onclick="toggleGhost()">👻 Esqueleto</button>
    <button onclick="switchCamera()">🔄 Girar</button>
    <button onclick="resetScore()">🗑️ Reset</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const gestureTxt = document.getElementById('gesture-txt');
    const scoreTxt = document.getElementById('score-txt');
    const flash = document.getElementById('flash');

    let ghostMode = false;
    let score = 0;
    let lastPunchTime = 0;

    // Configuración de conexiones (simplificada para fluidez)
    const CONNECTIONS = [
        [11,12], [11,13], [13,15], [12,14], [14,16], // Torso y brazos
        [11,23], [12,24], [23,24], [23,25], [24,26]  // Caderas y rodillas
    ];

    async function init() {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'user', width: 1280, height: 720 }, audio: false 
        });
        video.srcObject = stream;
        video.play();

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.7 });
        pose.onResults(draw);

        async function detect() {
            await pose.send({image: video});
            requestAnimationFrame(detect);
        }
        detect();
    }

    function draw(res) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (ghostMode) {
            ctx.fillStyle = "black";
            ctx.fillRect(0,0, canvas.width, canvas.height);
        }

        if (!res.poseLandmarks) {
            gestureTxt.innerText = "Fuera de rango";
            return;
        }

        // --- DIBUJO DE ESQUELETO ---
        ctx.lineJoin = 'round';
        ctx.lineWidth = 5;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00f2ff";
        ctx.strokeStyle = "#00f2ff";

        CONNECTIONS.forEach(([a, b]) => {
            const p1 = res.poseLandmarks[a];
            const p2 = res.poseLandmarks[b];
            if (p1.visibility > 0.5 && p2.visibility > 0.5) {
                ctx.beginPath();
                ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
                ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
                ctx.stroke();
            }
        });

        // Puntos de articulación
        ctx.fillStyle = "#fff";
        res.poseLandmarks.forEach((p, i) => {
            if (p.visibility > 0.5 && i > 10) {
                ctx.beginPath();
                ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        checkGestures(res.poseLandmarks);
    }

    function checkGestures(lm) {
        const rWrist = lm[16], lWrist = lm[15], head = lm[0], rShoulder = lm[12];
        
        // 1. Gesto: Saludando (Mano sobre la cabeza)
        if (rWrist.y < head.y || lWrist.y < head.y) {
            updateGesture("HOLA 👋", "#00f2ff");
        } 
        // 2. Gesto: Guardia de Boxeo (Manos cerca de la cara)
        else if (Math.abs(rWrist.x - head.x) < 0.1 && rWrist.y < rShoulder.y) {
            updateGesture("GUARDIA 🥊", "#ffcc00");
        }
        else {
            updateGesture("IDLE", "#fff");
        }

        // 3. Función: Detección de Golpe (Punch)
        // Detecta una aceleración rápida de la mano hacia adelante
        const punchSpeed = Math.abs(rWrist.z); 
        if (punchSpeed > 1.2 && (Date.now() - lastPunchTime > 500)) {
            triggerPunch();
        }
    }

    function updateGesture(txt, color) {
        gestureTxt.innerText = txt;
        gestureTxt.style.color = color;
    }

    function triggerPunch() {
        score += 10;
        scoreTxt.innerText = score;
        lastPunchTime = Date.now();
        flash.style.animation = "none";
        void flash.offsetWidth; // Reiniciar animación
        flash.style.animation = "flash 0.2s ease-out";
    }

    function toggleGhost() { ghostMode = !ghostMode; video.style.opacity = ghostMode ? 0 : 1; }
    function resetScore() { score = 0; scoreTxt.innerText = score; }
    async function switchCamera() {
        const mode = video.getAttribute('data-mode') === 'user' ? 'environment' : 'user';
        video.setAttribute('data-mode', mode);
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
        video.srcObject = stream;
    }

    init();
  </script>
</body>
</html>
