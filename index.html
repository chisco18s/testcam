<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>AI Coach Sensei Pro</title>
  <style>
    :root { --neon: #00f2ff; --accent: #7000ff; --danger: #ff4444; --zen: #00ff88; --dark: #0a0a0a; }
    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
    body { background: #000; color: white; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    
    /* CAPAS DE VIDEO Y CANVAS */
    #viewport { position: relative; width: 100vw; height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.6; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; }

    /* INTERFAZ HUD */
    #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 30px; z-index: 10; display: none; pointer-events: none; }
    .stats-container { display: flex; justify-content: space-between; align-items: flex-start; }
    .stat-card { background: rgba(0,0,0,0.7); padding: 15px; border-radius: 15px; border-left: 4px solid var(--neon); backdrop-filter: blur(10px); min-width: 120px; }
    .stat-value { font-size: 32px; font-weight: 900; display: block; color: #fff; }
    .stat-label { font-size: 10px; text-transform: uppercase; color: var(--neon); letter-spacing: 1px; }

    /* BARRA DE PROGRESO */
    #timer-bar-container { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.1); z-index: 20; }
    #timer-bar { width: 100%; height: 100%; background: var(--neon); transition: width 1s linear; box-shadow: 0 0 15px var(--neon); }

    /* OVERLAYS (MENÚ Y CARGA) */
    .overlay { position: fixed; inset: 0; background: var(--dark); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .btn-start { background: var(--neon); color: #000; border: none; padding: 20px 50px; border-radius: 50px; font-size: 1.5rem; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 0 30px rgba(0,242,255,0.4); }
    .btn-start:hover { transform: scale(1.1); box-shadow: 0 0 50px var(--neon); }
    
    /* FEEDBACK DINÁMICO */
    #feedback-box { position: absolute; bottom: 150px; width: 100%; text-align: center; z-index: 50; transition: 0.3s; opacity: 0; transform: translateY(20px); }
    .feedback-pill { background: var(--accent); color: white; padding: 12px 30px; border-radius: 50px; font-weight: bold; font-size: 1.2rem; display: inline-block; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="start-screen" class="overlay">
    <h1 style="font-size: 3rem; margin-bottom: 10px; color: var(--neon);">SENSEI AI</h1>
    <p style="color: #888; margin-bottom: 40px; max-width: 300px;">Entrenador biomecánico profesional con visión artificial</p>
    <button class="btn-start" onclick="initApp()">INICIAR</button>
  </div>

  <div id="end-screen" class="overlay hidden">
    <h1 style="color: var(--zen); margin-bottom: 20px;">¡SESIÓN FINALIZADA!</h1>
    <div id="results-box" style="margin-bottom: 30px; font-size: 1.2rem; line-height: 2;"></div>
    <button class="btn-start" style="background: white;" onclick="location.reload()">REINTENTAR</button>
  </div>

  <div id="viewport">
    <div id="timer-bar-container"><div id="timer-bar"></div></div>
    
    <div id="hud">
      <div class="stats-container">
        <div class="stat-card">
          <span class="stat-label">Repeticiones</span>
          <span id="ui-reps" class="stat-value">0</span>
        </div>
        <div class="stat-card" style="border-color: var(--accent);">
          <span class="stat-label">Tiempo</span>
          <span id="ui-timer" class="stat-value">30s</span>
        </div>
      </div>
    </div>

    <div id="feedback-box">
      <div class="feedback-pill" id="ui-msg">¡CALIBRANDO!</div>
    </div>

    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>

  <script>
    const state = {
        active: false,
        reps: 0,
        timeLeft: 30,
        stage: 'up',
        lastSpeak: 0,
        history: [],
        bestAngle: 180,
        totalPerfect: 0
    };

    const dom = {
        video: document.getElementById('video'),
        canvas: document.getElementById('canvas'),
        ctx: document.getElementById('canvas').getContext('2d'),
        timerBar: document.getElementById('timer-bar')
    };

    // --- MEJORA 1: MOTOR DE VOZ INTELIGENTE ---
    function coachTalk(text, force = false) {
        if (!force && Date.now() - state.lastSpeak < 3000) return;
        state.lastSpeak = Date.now();
        
        const msg = document.getElementById('ui-msg');
        msg.innerText = text.toUpperCase();
        document.getElementById('feedback-box').style.opacity = 1;
        document.getElementById('feedback-box').style.transform = "translateY(0)";

        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'es-ES';
        speech.rate = 1.2;
        window.speechSynthesis.speak(speech);

        setTimeout(() => {
            document.getElementById('feedback-box').style.opacity = 0;
            document.getElementById('feedback-box').style.transform = "translateY(20px)";
        }, 2500);
    }

    // --- MEJORA 2: CÁLCULO DE ÁNGULOS (BIOMECÁNICA) ---
    function findAngle(p1, p2, p3) {
        const r12 = Math.sqrt(Math.pow(p2.x-p1.x, 2) + Math.pow(p2.y-p1.y, 2));
        const r23 = Math.sqrt(Math.pow(p3.x-p2.x, 2) + Math.pow(p3.y-p2.y, 2));
        const r13 = Math.sqrt(Math.pow(p3.x-p1.x, 2) + Math.pow(p3.y-p1.y, 2));
        const angle = Math.acos((Math.pow(r12, 2) + Math.pow(r23, 2) - Math.pow(r13, 2)) / (2 * r12 * r23));
        return angle * (180 / Math.PI);
    }

    // --- REPARACIÓN DE PANTALLA NEGRA ---
    async function initApp() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').style.display = 'block';

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } 
            });
            dom.video.srcObject = stream;
            await dom.video.play();
            
            // Ajustar canvas al tamaño real del video
            dom.canvas.width = dom.video.videoWidth;
            dom.canvas.height = dom.video.videoHeight;

            startPoseAI();
            startCountdown();
        } catch (err) {
            alert("Error al acceder a la cámara. Por favor, permite los permisos.");
        }
    }

    function startCountdown() {
        coachTalk("¡Prepárate! Aléjate para que vea tus pies.");
        const interval = setInterval(() => {
            state.timeLeft--;
            document.getElementById('ui-timer').innerText = state.timeLeft + "s";
            dom.timerBar.style.width = (state.timeLeft / 30 * 100) + "%";

            if (state.timeLeft <= 0) {
                clearInterval(interval);
                showSummary();
            }
        }, 1000);
        state.active = true;
    }

    function showSummary() {
        state.active = false;
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('results-box').innerHTML = `
            ⭐ Repeticiones: <b>${state.reps}</b><br>
            🎯 Calidad Media: <b>${state.totalPerfect > 0 ? 'ALTA' : 'MEDIA'}</b><br>
            🔥 Mejor Ángulo: <b>${state.bestAngle.toFixed(0)}°</b>
        `;
        coachTalk("Entrenamiento completado. ¡Buen trabajo!");
    }

    function startPoseAI() {
        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        pose.onResults(onResults);

        const detect = async () => {
            if (state.active) await pose.send({ image: dom.video });
            requestAnimationFrame(detect);
        };
        detect();
    }

    function onResults(results) {
        if (!results.poseLandmarks) return;
        const lm = results.poseLandmarks;
        const ctx = dom.ctx;

        ctx.save();
        ctx.clearRect(0, 0, dom.canvas.width, dom.canvas.height);
        
        // Efecto espejo para el dibujo
        ctx.translate(dom.canvas.width, 0);
        ctx.scale(-1, 1);

        // --- MEJORA 3: LÓGICA DE SENTADILLA PROFESIONAL ---
        // Ángulo de la rodilla derecha (Cadera 24, Rodilla 26, Tobillo 28)
        const kneeAngle = findAngle(lm[24], lm[26], lm[28]);
        
        if (kneeAngle < state.bestAngle) state.bestAngle = kneeAngle;

        // Visualización del ángulo en la rodilla
        ctx.fillStyle = "white";
        ctx.font = "bold 30px Arial";
        ctx.fillText(Math.round(kneeAngle) + "°", lm[26].x * dom.canvas.width + 20, lm[26].y * dom.canvas.height);

        // Lógica de conteo
        if (state.stage === 'up' && kneeAngle < 100) {
            state.stage = 'down';
        }
        if (state.stage === 'down' && kneeAngle > 150) {
            state.reps++;
            state.stage = 'up';
            document.getElementById('ui-reps').innerText = state.reps;
            
            if (kneeAngle > 165) {
                coachTalk("¡Excelente extensión!");
                state.totalPerfect++;
            } else {
                coachTalk("¡Bien! Sigue así.");
            }
        }

        drawSkeleton(ctx, lm, kneeAngle);
        ctx.restore();
    }

    function drawSkeleton(ctx, lm, angle) {
        ctx.strokeStyle = angle < 100 ? "var(--zen)" : "white";
        ctx.lineWidth = 6;
        const connections = [[11,12], [11,23], [12,24], [23,24], [24,26], [26,28], [23,25], [25,27], [11,13], [13,15], [12,14], [14,16]];
        
        connections.forEach(([a, b]) => {
            if (lm[a].visibility > 0.5 && lm[b].visibility > 0.5) {
                ctx.beginPath();
                ctx.moveTo(lm[a].x * dom.canvas.width, lm[a].y * dom.canvas.height);
                ctx.lineTo(lm[b].x * dom.canvas.width, lm[b].y * dom.canvas.height);
                ctx.stroke();
            }
        });

        // Puntos de articulación
        ctx.fillStyle = "var(--neon)";
        [24, 26, 28].forEach(i => {
            ctx.beginPath();
            ctx.arc(lm[i].x * dom.canvas.width, lm[i].y * dom.canvas.height, 8, 0, 2 * Math.PI);
            ctx.fill();
        });
    }
  </script>
</body>
</html>
