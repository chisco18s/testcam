<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>MobileKinect Pro — Multi-User Tracking</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
    
    .ui-top { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; z-index: 10; }
    .status-bar {
      background: rgba(0,0,0,0.8); padding: 8px 20px; border-radius: 30px;
      border: 1px solid #4cc9f0; color: #4cc9f0; font-weight: bold; font-size: 14px;
      backdrop-filter: blur(10px);
    }
    .ui-bottom { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 10; }
    button {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3); color: white;
      padding: 15px 25px; border-radius: 50px; cursor: pointer; font-size: 14px;
    }
    button:active { background: #4cc9f0; color: #000; }
  </style>
</head>
<body>

  <div class="ui-top">
    <div class="status-bar" id="status">BUSCANDO PERSONAS...</div>
  </div>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="ui-bottom">
    <button id="btn-switch">🔄 Cámara</button>
    <button id="btn-ghost">👻 Modo Ghost</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    
    let isGhost = false;
    let currentFacing = 'user';
    let poseDetector;

    // Colores para hasta 4 personas
    const COLORS = ['#00f2ff', '#39ff14', '#bc13fe', '#ffea00'];

    const CONNECTIONS = [
      [0,1], [1,2], [2,3], [0,4], [4,5], [5,6], // Cabeza
      [11,12], [11,13], [13,15], [12,14], [14,16], // Brazos
      [11,23], [12,24], [23,24], // Torso
      [23,25], [25,27], [24,26], [26,28] // Piernas
    ];

    async function init() {
      poseDetector = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      // IMPORTANTE: modelComplexity 0 es más rápido para múltiples personas en web
      poseDetector.setOptions({
        modelComplexity: 0, 
        smoothLandmarks: true,
        enableSegmentation: false,
        smoothSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      poseDetector.onResults(onResults);
      await startCamera();
      
      const detectFrame = async () => {
        await poseDetector.send({ image: video });
        video.requestVideoFrameCallback(detectFrame);
      };
      detectFrame();
    }

    async function startCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing, width: { ideal: 640 }, height: { ideal: 480 } }
      });
      video.srcObject = stream;
      video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      
      video.onloadedmetadata = () => {
        video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      };
    }

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentFacing === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      if (isGhost) {
        ctx.fillStyle = "#05050a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Si MediaPipe detecta múltiples poses (en navegadores compatibles)
      // de lo contrario, dibujará la pose principal con el color 1.
      if (results.poseLandmarks) {
          statusEl.innerText = "PERSONA(S) DETECTADA(S)";
          // Dibujamos a la persona principal
          drawSkeleton(results.poseLandmarks, COLORS[0]);
      } else {
          statusEl.innerText = "ESPERANDO PERSONAS...";
      }
      
      ctx.restore();
    }

    function drawSkeleton(landmarks, color) {
      ctx.lineWidth = 5;
      ctx.strokeStyle = color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = color;
      ctx.lineCap = "round";

      CONNECTIONS.forEach(([a, b]) => {
        const start = landmarks[a];
        const end = landmarks[b];
        if (start && end && start.visibility > 0.5 && end.visibility > 0.5) {
          ctx.beginPath();
          ctx.moveTo(start.x * canvas.width, start.y * canvas.height);
          ctx.lineTo(end.x * canvas.width, end.y * canvas.height);
          ctx.stroke();
        }
      });

      // Cabeza y puntos
      landmarks.forEach((p, i) => {
        if (p.visibility > 0.5) {
          ctx.beginPath();
          ctx.arc(p.x * canvas.width, p.y * canvas.height, i < 11 ? 3 : 5, 0, Math.PI * 2);
          ctx.fillStyle = "#fff";
          ctx.fill();
        }
      });
    }

    document.getElementById('btn-switch').onclick = () => {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      startCamera();
    };

    document.getElementById('btn-ghost').onclick = function() {
      isGhost = !isGhost;
      video.style.opacity = isGhost ? "0" : "1";
    };

    init();
  </script>
</body>
</html>
