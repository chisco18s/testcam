<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPECTRAL AI v7 - EVP & SCAN</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <style>
        :root { 
            --main: #00ff41; 
            --danger: #ff0000; 
            --ui-color: var(--main);
            --glass: rgba(0, 10, 0, 0.85); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: #000; color: var(--ui-color); overflow: hidden; width: 100vw; height: 100vh; transition: color 0.4s; }

        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* HUD Superior */
        #hud-top { 
            position: absolute; top: 0; width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr;
            z-index: 20; padding: 50px 15px 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            border-bottom: 1px solid var(--ui-color);
        }
        .val { font-size: 14px; font-weight: bold; display: block; }
        .label { font-size: 8px; text-transform: uppercase; opacity: 0.7; }

        /* Consola EVP (Psicofonías) */
        #evp-console {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            width: 80%; text-align: center; z-index: 25;
            background: rgba(0,0,0,0.5); padding: 5px; border: 1px dashed var(--ui-color);
        }
        #evp-word { font-size: 18px; font-style: italic; color: #fff; text-shadow: 0 0 10px var(--ui-color); }

        /* Registro Inferior */
        #registry { 
            position: absolute; bottom: 100px; left: 15px; width: 60%; height: 80px;
            background: rgba(0,0,0,0.6); border-left: 3px solid var(--ui-color); 
            padding: 8px; z-index: 25; font-size: 9px; overflow: hidden;
            display: flex; flex-direction: column-reverse;
        }

        .entity-tag { 
            position: absolute; color: #fff; padding: 4px 10px; border: 1px solid #fff;
            background: var(--danger); z-index: 40; font-size: 10px; font-weight: bold;
        }

        .bottom-ui { 
            position: fixed; bottom: 0; width: 100%; height: 80px; background: #000;
            z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            border-top: 1px solid var(--ui-color);
        }
        .capture-btn { width: 55px; height: 55px; background: var(--danger); border: 3px solid #fff; border-radius: 50%; }

        #start-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1 style="color:var(--main); margin-bottom: 20px;">SPECTRAL AI v7.0</h1>
    <button onclick="init()" style="background:none; border:1px solid var(--main); color:var(--main); padding:15px 30px;">[ INICIAR ESCANEO BIO-ACÚSTICO ]</button>
</div>

<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud-top">
    <div style="text-align:center"><span class="label">EMF</span><span id="emf" class="val">0.00</span></div>
    <div style="text-align:center"><span class="label">TIPO</span><span id="obj-type" class="val">BUSCANDO</span></div>
    <div style="text-align:center"><span class="label">PSICO-AUDIÓMETRO</span><span id="audio-lvl" class="val">0%</span></div>
</div>

<div id="evp-console">
    <span class="label">CAPTACIÓN PSICOFÓNICA (EVP)</span><br>
    <span id="evp-word">--- ESCUCHANDO ---</span>
</div>

<div id="registry"></div>
<div id="entity-tag" class="entity-tag" style="display:none"></div>

<div class="bottom-ui">
    <div style="font-size: 8px;">MIC_STATUS: ANALYZING<br>POSE_ENGINE: v1.0</div>
    <button class="capture-btn" onclick="takePhoto()"></button>
    <div style="text-align:right"><span id="clock" style="font-size: 14px; color:#fff">00:00:00</span></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tag = document.getElementById('entity-tag');
    let audioCtx, analyser, dataArray;
    
    // SISTEMA DE PERSISTENCIA
    let activeEntity = null; // Guardará { nombre, categoria, timestamp }

    const WORDS_EVP = ["MORIR", "VETE", "AYUDA", "AQUÍ", "SANGRE", "CORRE", "FRÍO", "ELLOS", "MÍRAME", "NUNCA"];
    const HUMAN_NAMES = ["SUJETO ALPHA", "S-HUMANOID", "ENTIDAD BIÓTICA", "PRESENCIA HUMANA"];
    const UNKNOWN_NAMES = ["OBJETO NO IDENTIFICADO", "ANOMALÍA CLASE-V", "RESIDUO SOMBRÍO", "VÓRTICE"];

    function getStaticEntity(isHuman) {
        const pool = isHuman ? HUMAN_NAMES : UNKNOWN_NAMES;
        return {
            name: pool[Math.floor(Math.random() * pool.length)] + " [" + Math.floor(Math.random()*999) + "]",
            category: isHuman ? "HUMANO" : "NO IDENTIFICADO"
        };
    }

    async function init() {
        document.getElementById('start-screen').style.display = 'none';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
        video.srcObject = stream;
        video.play();
        
        // Setup Audio para Psicofonías
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 0, minDetectionConfidence: 0.6 });
        pose.onResults(onResults);

        const frame = async () => {
            if(video.readyState === 4) {
                await pose.send({ image: video });
                updateEVP();
            }
            requestAnimationFrame(frame);
        };
        frame();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    }

    function onResults(res) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const objTypeEl = document.getElementById('obj-type');

        if (res.poseLandmarks) {
            // Si NO había entidad o se perdió la anterior, fijamos una nueva
            if (!activeEntity) {
                activeEntity = getStaticEntity(true); // Se detectó pose = Humano
                document.body.style.setProperty('--ui-color', 'var(--danger)');
                addLog(`BLOQUEADO: ${activeEntity.name}`);
                navigator.vibrate([100, 50, 100]); // Vibración de detección
            }
            
            objTypeEl.innerText = activeEntity.category;
            drawUI(res.poseLandmarks);
        } else {
            // Reset cuando no hay nadie
            if (activeEntity) {
                activeEntity = null;
                document.body.style.setProperty('--ui-color', 'var(--main)');
                tag.style.display = 'none';
                objTypeEl.innerText = "BUSCANDO";
            }
        }
    }

    function drawUI(lm) {
        const head = lm[0];
        tag.style.display = 'block';
        tag.style.left = (head.x * canvas.width) + 'px';
        tag.style.top = (head.y * canvas.height - 40) + 'px';
        tag.innerText = activeEntity.name;

        // Dibujo de esqueleto técnico
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        lm.forEach((p) => ctx.lineTo(p.x * canvas.width, p.y * canvas.height));
        ctx.stroke();
    }

    function updateEVP() {
        analyser.getByteFrequencyData(dataArray);
        const sum = dataArray.reduce((a, b) => a + b, 0);
        const avg = sum / dataArray.length;
        document.getElementById('audio-lvl').innerText = Math.floor(avg) + "%";

        // Probabilidad de captar palabra si hay ruido
        if (avg > 30 && Math.random() > 0.995) {
            const word = WORDS_EVP[Math.floor(Math.random() * WORDS_EVP.length)];
            document.getElementById('evp-word').innerText = "» " + word + " «";
            addLog(`EVP CAPTADO: "${word}"`);
            setTimeout(() => { document.getElementById('evp-word').innerText = "--- ESCUCHANDO ---"; }, 2000);
        }
        
        const emf = activeEntity ? (30 + avg).toFixed(2) : (avg/4).toFixed(2);
        document.getElementById('emf').innerText = emf;
    }

    function addLog(msg) {
        const item = document.createElement('div');
        item.innerHTML = `[${new Date().getSeconds()}s] ${msg}`;
        registry.prepend(item);
        if (registry.children.length > 5) registry.lastChild.remove();
    }

    function takePhoto() {
        alert("EXPEDIENTE GUARDADO: " + (activeEntity ? activeEntity.name : "SCAN_VACIO"));
    }
</script>
</body>
</html>
