<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Spectral AI - Entity Hunter</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <style>
    :root { --main: #00ff41; --danger: #ff0000; --ghost: #00f2ff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
    body { background: #000; color: var(--main); overflow: hidden; }

    /* Cámara con filtro de ruido */
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5) contrast(1.2) grayscale(1); opacity: 0.4; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; }

    /* HUD Superior */
    #hud-top { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; z-index: 20; padding: 10px; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--main); }
    .data-box { text-align: center; }
    .label { font-size: 10px; display: block; }
    .value { font-size: 18px; font-weight: bold; color: white; }

    /* Barra de Proximidad */
    #proximity-bar { position: absolute; right: 20px; top: 20%; width: 10px; height: 60%; border: 1px solid var(--main); z-index: 20; }
    #proximity-fill { width: 100%; height: 0%; background: var(--main); position: absolute; bottom: 0; transition: height 0.3s; box-shadow: 0 0 15px var(--main); }

    /* Consola de Eventos */
    #console { position: absolute; bottom: 120px; left: 20px; width: 250px; height: 80px; overflow: hidden; font-size: 11px; z-index: 20; color: var(--ghost); }

    /* Radar y Botones */
    .bottom-ui { position: fixed; bottom: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 30; background: linear-gradient(transparent, black); }
    #radar { width: 80px; height: 80px; border: 1px solid var(--main); border-radius: 50%; position: relative; overflow: hidden; }
    #sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, rgba(0,255,65,0.4) 0deg, transparent 90deg); animation: rotate 2s linear infinite; border-radius: 50%; }
    
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

    .scanner-line { position: absolute; width: 100%; height: 2px; background: rgba(0,255,65,0.2); z-index: 15; animation: scan 4s linear infinite; }
    @keyframes scan { from { top: 0; } to { top: 100%; } }

    .entity-tag { position: absolute; color: var(--danger); font-weight: bold; padding: 2px 5px; border: 1px solid var(--danger); background: rgba(0,0,0,0.8); z-index: 40; pointer-events: none; text-transform: uppercase; }
  </style>
</head>
<body>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="scanner-line"></div>

  <div id="hud-top">
    <div class="data-box"><span class="label">SENS_AI</span><span class="value" id="val-sens">ACTIVO</span></div>
    <div class="data-box"><span class="label">FLUX_EMF</span><span class="value" id="val-emf">0.02</span></div>
    <div class="data-box"><span class="label">STATUS</span><span class="value" style="color:var(--danger)">BUSCANDO</span></div>
  </div>

  <div id="proximity-bar"><div id="proximity-fill"></div></div>
  <div id="console"></div>
  <div id="entity-label" class="entity-tag" style="display:none">ENTITY: DETECTED</div>

  <div class="bottom-ui">
    <div id="radar"><div id="sweep"></div></div>
    <div style="text-align: right">
        <p style="font-size: 10px">SISTEMA DE ANÁLISIS ESPECTRAL</p>
        <p id="clock" style="font-size: 14px">00:00:00</p>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const consoleDiv = document.getElementById('console');
    const proxFill = document.getElementById('proximity-fill');
    const entityLabel = document.getElementById('entity-label');

    const NAMES = ["Sombra", "Poltergeist", "Ente", "Eco Psíquico", "Aparición", "Anomalía v.4"];
    let lastSpeak = 0;

    function addLog(msg) {
        const p = document.createElement('div');
        p.innerText = `> ${msg}`;
        consoleDiv.prepend(p);
        if (consoleDiv.children.length > 5) consoleDiv.lastChild.remove();
    }

    async function start() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.play();
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
        
        pose.onResults(onResults);

        const frame = async () => {
            await pose.send({ image: video });
            updateClock();
            requestAnimationFrame(frame);
        };
        frame();
    }

    function onResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (results.poseLandmarks) {
            drawGhost(results.poseLandmarks);
            updateUI(true);
        } else {
            updateUI(false);
            entityLabel.style.display = 'none';
        }
    }

    function drawGhost(lm) {
        // Dibujar aura de partículas
        ctx.fillStyle = "rgba(0, 242, 255, 0.4)";
        lm.forEach((p, i) => {
            if (i % 2 === 0) {
                const x = p.x * canvas.width;
                const y = p.y * canvas.height;
                
                // Efecto de distorsión
                ctx.beginPath();
                ctx.arc(x + (Math.random()*10 - 5), y + (Math.random()*10 - 5), 4, 0, Math.PI*2);
                ctx.fill();
                
                // Líneas de conexión inestables
                if(i > 0) {
                    ctx.strokeStyle = "rgba(0, 255, 65, 0.2)";
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
            }
        });

        // Posicionar etiqueta de nombre sobre la cabeza (landmark 0)
        const head = lm[0];
        const hX = head.x * canvas.width;
        const hY = head.y * canvas.height;
        
        entityLabel.style.display = 'block';
        entityLabel.style.left = hX + 'px';
        entityLabel.style.top = (hY - 50) + 'px';
        
        if (Math.random() < 0.05) {
            const randomName = NAMES[Math.floor(Math.random()*NAMES.length)];
            entityLabel.innerText = `ENTITY: ${randomName}`;
        }
    }

    function updateUI(detected) {
        const emf = document.getElementById('val-emf');
        if (detected) {
            proxFill.style.height = (50 + Math.random() * 50) + "%";
            emf.innerText = (Math.random() * 8).toFixed(2);
            if (Date.now() - lastSpeak > 5000) {
                speak("Atención, anomalía detectada. Analizando patrón de energía.");
                addLog("Anomalía detectada en cuadrante visual");
                lastSpeak = Date.now();
            }
        } else {
            proxFill.style.height = (Math.random() * 10) + "%";
            emf.innerText = (Math.random() * 0.1).toFixed(2);
        }
    }

    function speak(txt) {
        const s = new SpeechSynthesisUtterance(txt);
        s.lang = 'es-ES';
        s.pitch = 0.6;
        s.rate = 0.9;
        window.speechSynthesis.speak(s);
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
    }

    start();
  </script>
</body>
</html>
