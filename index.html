<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>MobileKinect — Detección de Gestos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1b;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    .ui {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
      padding: 0 20px;
    }
    .status {
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 24px;
      display: inline-block;
      font-size: 18px;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }
    .instructions {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #4cc9f0;
    }
    .controls {
      margin-bottom: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls button {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      min-width: 90px;
    }
    .controls button.active {
      background: rgba(76, 201, 240, 0.3);
      border-color: #4cc9f0;
    }
  </style>
</head>
<body>

  <div class="container">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div class="instructions">Mueve tu cuerpo frente a la cámara. Aleja ~2 metros.</div>
    
    <div class="ui">
      <div class="controls">
        <button id="switchCamera">Cámara</button>
        <button class="filter-btn active" data-filter="none">Normal</button>
        <button class="filter-btn" data-filter="red">Rojo</button>
        <button class="filter-btn" data-filter="green">Verde</button>
      </div>
      <div class="status" id="status">Iniciando sistema...</div>
    </div>
  </div>

  <!-- ✅ Librerías CORRECTAS de MediaPipe (sin errores) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const switchBtn = document.getElementById('switchCamera');
    const filterButtons = Array.from(document.querySelectorAll('.filter-btn'));

    let currentFilter = 'none';
    let currentFacing = 'user';
    let pose = null;
    let isReady = false;

    // Inicializar cámara
    async function setupCamera(facing = 'user') {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: false
      });
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }
      video.srcObject = stream;
      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });
    }

    // Inicializar MediaPipe Pose
    function setupPose() {
      pose = new Pose({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults(onResults);
      isReady = true;
      statusEl.textContent = "✅ Listo. Esperando persona...";
    }

    // Procesar resultados
    function onResults(results) {
      // Ajustar canvas
      const w = video.videoWidth || 640;
      const h = video.videoHeight || 480;
      canvas.width = w;
      canvas.height = h;

      // Limpiar
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.poseLandmarks) {
        // Dibujar puntos
        drawKeypoints(results.poseLandmarks, ctx);
        // Dibujar esqueleto
        drawSkeleton(results.poseLandmarks, ctx);
        // Analizar gestos
        analyzeGestures(results.poseLandmarks);
      } else {
        statusEl.textContent = "🔍 Esperando persona...";
      }

      applyFilter();
    }

    function drawKeypoints(landmarks, ctx) {
      landmarks.forEach((landmark, i) => {
        if (landmark.visibility > 0.6) {
          const x = landmark.x * canvas.width;
          const y = landmark.y * canvas.height;
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, 2 * Math.PI);
          ctx.fillStyle = '#ff6b6b';
          ctx.fill();
        }
      });
    }

    const connections = [
      [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
      [11, 23], [12, 24], [23, 24],
      [23, 25], [25, 27], [24, 26], [26, 28]
    ];

    function drawSkeleton(landmarks, ctx) {
      connections.forEach(([i, j]) => {
        if (landmarks[i].visibility > 0.6 && landmarks[j].visibility > 0.6) {
          ctx.beginPath();
          ctx.moveTo(landmarks[i].x * canvas.width, landmarks[i].y * canvas.height);
          ctx.lineTo(landmarks[j].x * canvas.width, landmarks[j].y * canvas.height);
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#4ade80';
          ctx.stroke();
        }
      });
    }

    function analyzeGestures(landmarks) {
      const leftShoulder = landmarks[11];
      const rightShoulder = landmarks[12];
      const leftWrist = landmarks[15];
      const rightWrist = landmarks[16];
      const leftHip = landmarks[23];
      const rightHip = landmarks[24];
      const leftKnee = landmarks[25];
      const rightKnee = landmarks[26];

      // Verificar visibilidad
      if (!leftShoulder || !rightShoulder || !leftWrist || !rightWrist || 
          !leftHip || !rightHip || !leftKnee || !rightKnee) {
        statusEl.textContent = "❓ Postura no clara";
        return;
      }

      // Calcular alturas relativas (menor Y = más arriba en pantalla)
      const leftHandUp = leftWrist.y < leftShoulder.y - 0.05;
      const rightHandUp = rightWrist.y < rightShoulder.y - 0.05;
      const hipsY = (leftHip.y + rightHip.y) / 2;
      const kneesY = (leftKnee.y + rightKnee.y) / 2;
      const shouldersY = (leftShoulder.y + rightShoulder.y) / 2;
      const isCrouching = (hipsY - shouldersY) < (kneesY - hipsY) * 0.8;

      // Determinar acción específica
      if (isCrouching) {
        statusEl.textContent = "⬇️ AGACHADO";
      } else if (leftHandUp && rightHandUp) {
        statusEl.textContent = "🖐️ AMBAS MANOS LEVANTADAS";
      } else if (leftHandUp) {
        statusEl.textContent = "✋ MANO IZQUIERDA LEVANTADA";
      } else if (rightHandUp) {
        statusEl.textContent = "✋ MANO DERECHA LEVANTADA";
      } else if (Math.abs(leftWrist.x - rightWrist.x) > 0.3 && 
                Math.abs(leftWrist.y - shouldersY) < 0.1 && 
                Math.abs(rightWrist.y - shouldersY) < 0.1) {
        statusEl.textContent = "🚶‍♂️ CAMINANDO (movimiento detectado)";
      } else {
        statusEl.textContent = "🧍 DE PIE - NEUTRAL";
      }
    }

    function applyFilter() {
      if (currentFilter === 'none') return;
      ctx.save();
      ctx.globalCompositeOperation = 'source-atop';
      let color = '#000000';
      if (currentFilter === 'red') color = '#ff0000';
      if (currentFilter === 'green') color = '#00ff00';
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.12;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    async function switchCamera() {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      try {
        await setupCamera(currentFacing);
        statusEl.textContent = `🔄 Cámara: ${currentFacing === 'user' ? 'Frontal' : 'Trasera'}`;
        setTimeout(() => {
          if (isReady) statusEl.textContent = "✅ Listo. Esperando persona...";
        }, 1500);
      } catch (e) {
        statusEl.textContent = '❌ Error al cambiar cámara';
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      filterButtons.forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
    }

    // Bucle principal
    async function detectLoop() {
      if (isReady && video.readyState >= 2) {
        pose.send({ image: video });
      }
      requestAnimationFrame(detectLoop);
    }

    // Iniciar
    async function init() {
      try {
        await setupCamera(currentFacing);
        
        switchBtn.addEventListener('click', switchCamera);
        filterButtons.forEach(btn => {
          btn.addEventListener('click', () => setFilter(btn.dataset.filter));
        });
        setFilter('none');
        
        setupPose();
        detectLoop();
      } catch (e) {
        statusEl.textContent = "❌ Error: " + e.message;
        console.error(e);
      }
    }

    window.addEventListener('load', init);
  </script>

</body>
</html>
