<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Kinect Life Quality Suite</title>
  <style>
    :root { --neon: #00f2ff; --accent: #7000ff; --danger: #ff4444; --zen: #00ff88; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; position: fixed; width: 100%; height: 100%; }
    
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

    /* --- MENÚ DE INICIO --- */
    #main-menu {
      position: absolute; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    h1 { margin-bottom: 30px; font-size: 24px; text-align: center; color: var(--neon); text-transform: uppercase; letter-spacing: 2px; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 400px; }
    .menu-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
      padding: 20px 10px; border-radius: 15px; color: white; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 10px; transition: 0.3s;
    }
    .menu-btn:active { transform: scale(0.95); background: var(--accent); }
    .menu-btn i { font-size: 24px; }
    .menu-btn span { font-size: 12px; font-weight: bold; text-align: center; }

    /* --- HUD DINÁMICO --- */
    #hud {
      position: absolute; top: 15px; width: 100%; padding: 0 15px;
      display: flex; justify-content: space-between; z-index: 10; pointer-events: none;
      display: none;
    }
    .stat-card { background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; border-left: 3px solid var(--neon); min-width: 90px; }
    .label { font-size: 9px; color: var(--neon); text-transform: uppercase; display: block; }
    .value { font-size: 18px; font-weight: bold; }

    /* --- ALERTAS Y FEEDBACK --- */
    #alert-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; width: 80%; z-index: 20; pointer-events: none;
      font-size: 32px; font-weight: 900; text-transform: uppercase; opacity: 0; transition: 0.3s;
    }
    .warning { color: var(--danger); text-shadow: 0 0 20px var(--danger); }
    .success { color: var(--zen); text-shadow: 0 0 20px var(--zen); }

    /* --- BOTÓN DE SALIDA --- */
    #btn-exit { position: absolute; top: 80px; right: 15px; z-index: 20; padding: 10px; border-radius: 50%; background: rgba(255,0,0,0.3); border: 1px solid red; display: none; }
  </style>
</head>
<body>

  <div id="main-menu">
    <h1>Kinect Life Suite</h1>
    <div class="menu-grid">
      <div class="menu-btn" onclick="startApp('fitness')">
        <span>💪</span>
        <span>ENTRENAMIENTO<br>PRO</span>
      </div>
      <div class="menu-btn" onclick="startApp('posture')">
        <span>🧘</span>
        <span>CORRECTOR<br>POSTURAL</span>
      </div>
      <div class="menu-btn" onclick="startApp('balance')">
        <span>⚖️</span>
        <span>TEST DE<br>EQUILIBRIO</span>
      </div>
      <div class="menu-btn" onclick="startApp('zen')">
        <span>✨</span>
        <span>MODO<br>ZEN</span>
      </div>
    </div>
  </div>

  <div id="hud">
    <div class="stat-card">
        <span class="label" id="label-1">Dato 1</span>
        <span id="val-1" class="value">0</span>
    </div>
    <div class="stat-card" style="border-color: var(--accent);">
        <span class="label" id="label-2">Dato 2</span>
        <span id="val-2" class="value">0</span>
    </div>
  </div>

  <button id="btn-exit" onclick="exitToMenu()">❌</button>
  <div id="alert-box">¡ALERTA!</div>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const alertBox = document.getElementById('alert-box');
    
    let poseDetector;
    let currentMode = null;
    let isRunning = false;
    
    // Variables de Estado
    let reps = 0, stage = "start", calories = 0;
    let balanceHistory = [];
    let lastHandPos = {x:0, y:0};

    async function initDetector() {
      poseDetector = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });
      poseDetector.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      poseDetector.onResults(onResults);
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      video.srcObject = stream;
      video.style.transform = "scaleX(-1)";
      video.onloadedmetadata = () => {
          video.play();
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
      };

      const loop = async () => {
        if (isRunning && video.readyState >= 2) await poseDetector.send({ image: video });
        requestAnimationFrame(loop);
      };
      loop();
    }

    function startApp(mode) {
      currentMode = mode;
      isRunning = true;
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('btn-exit').style.display = 'block';
      resetCounters();
      setupHUD();
    }

    function exitToMenu() {
      isRunning = false;
      document.getElementById('main-menu').style.display = 'flex';
      document.getElementById('hud').style.display = 'none';
      document.getElementById('btn-exit').style.display = 'none';
    }

    function setupHUD() {
        const l1 = document.getElementById('label-1');
        const l2 = document.getElementById('label-2');
        if(currentMode === 'fitness') { l1.innerText="Reps"; l2.innerText="Calorías"; }
        if(currentMode === 'posture') { l1.innerText="Postura"; l2.innerText="Ángulo"; }
        if(currentMode === 'balance') { l1.innerText="Estabilidad"; l2.innerText="Desvío"; }
        if(currentMode === 'zen') { l1.innerText="Fluidez"; l2.innerText="Calma"; }
    }

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(canvas.width, 0); ctx.scale(-1, 1);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        drawSkeleton(lm);

        if(currentMode === 'fitness') processFitness(lm);
        if(currentMode === 'posture') processPosture(lm);
        if(currentMode === 'balance') processBalance(lm);
        if(currentMode === 'zen') processZen(lm);
      }
      ctx.restore();
    }

    // --- LÓGICA POR MODO ---

    function processFitness(lm) {
        const hip = (lm[23].y + lm[24].y)/2;
        const knee = (lm[25].y + lm[26].y)/2;
        if (stage === "start" && hip > knee - 0.05) stage = "down";
        if (stage === "down" && hip < knee - 0.15) {
            reps++; calories += 0.5; stage = "start";
            updateStats(reps, calories.toFixed(1));
        }
    }

    function processPosture(lm) {
        // Medimos ángulo de la oreja respecto al hombro (Cuello de texto)
        const ear = lm[7]; const shoulder = lm[11];
        const dist = Math.abs(ear.x - shoulder.x);
        const angle = Math.abs(ear.y - shoulder.y);
        
        document.getElementById('val-2').innerText = (dist * 100).toFixed(0) + "%";

        if (dist > 0.15) { // Cabeza muy adelantada
            showAlert("¡ENDEREZA TU CUELLO!", "warning");
            document.getElementById('val-1').innerText = "MALA";
        } else {
            hideAlert();
            document.getElementById('val-1').innerText = "EXCELENTE";
        }
    }

    function processBalance(lm) {
        const nose = lm[0];
        balanceHistory.push(nose.x);
        if(balanceHistory.length > 50) balanceHistory.shift();
        
        const deviation = Math.max(...balanceHistory) - Math.min(...balanceHistory);
        document.getElementById('val-2').innerText = (deviation * 100).toFixed(1);
        
        if(deviation > 0.1) {
            showAlert("¡ESTABILÍZATE!", "warning");
            document.getElementById('val-1').innerText = "INESTABLE";
        } else {
            hideAlert();
            document.getElementById('val-1').innerText = "ESTABLE";
        }
    }

    function processZen(lm) {
        const hand = lm[15];
        const movement = Math.abs(hand.x - lastHandPos.x) + Math.abs(hand.y - lastHandPos.y);
        lastHandPos = {x: hand.x, y: hand.y};

        if(movement > 0.05) {
            showAlert("MÁS LENTO...", "warning");
            document.getElementById('val-1').innerText = "RÁPIDO";
        } else {
            showAlert("BIEN...", "success");
            document.getElementById('val-1').innerText = "FLUIDO";
        }
    }

    // --- UTILIDADES ---

    function drawSkeleton(lm) {
        ctx.strokeStyle = "white"; ctx.lineWidth = 4;
        const parts = [[11,12], [11,23], [12,24], [23,24], [11,13], [13,15], [12,14], [14,16], [23,25], [25,27], [24,26], [26,28]];
        parts.forEach(([a,b]) => {
            if(lm[a].visibility > 0.5 && lm[b].visibility > 0.5) {
                ctx.beginPath();
                ctx.moveTo(lm[a].x * canvas.width, lm[a].y * canvas.height);
                ctx.lineTo(lm[b].x * canvas.width, lm[b].y * canvas.height);
                ctx.stroke();
            }
        });
    }

    function showAlert(txt, type) {
        alertBox.innerText = txt;
        alertBox.className = type;
        alertBox.style.opacity = 1;
    }

    function hideAlert() { alertBox.style.opacity = 0; }

    function updateStats(v1, v2) {
        document.getElementById('val-1').innerText = v1;
        document.getElementById('val-2').innerText = v2;
    }

    function resetCounters() {
        reps = 0; calories = 0; stage = "start";
        updateStats(0,0);
    }

    initDetector();
  </script>
</body>
</html>
