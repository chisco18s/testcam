<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Kinect Ultra-Fast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
    .ui { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 10; }
    button {
      background: rgba(255,255,255,0.2); border: 1px solid #fff; color: #white;
      padding: 10px 20px; border-radius: 20px; font-size: 12px; color: white;
    }
  </style>
</head>
<body>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="ui">
    <button id="btn-camera">🔄 Cámara</button>
    <button id="btn-ghost">👻 Ghost</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimización de contexto
    
    let detector, isGhost = false, currentFacing = 'user';
    const COLORS = ['#00f2ff', '#39ff14', '#ff0055', '#ffea00'];

    // Solo las conexiones vitales para ahorrar ciclos de CPU
    const VITAL_CONNECTIONS = [[5,6],[5,11],[6,12],[11,12],[5,7],[7,9],[6,8],[8,10],[11,13],[13,15],[12,14],[14,16]];

    async function init() {
      await tf.setBackend('webgl');
      // Pre-compilación de shaders para evitar el lag inicial
      await tf.ready();
      
      await setupCamera();
      
      detector = await poseDetection.createDetector(
        poseDetection.SupportedModels.MoveNet, 
        {
          modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
          enableSmoothing: false, // Desactivado para ganar velocidad
          multiPoseMaxDimension: 160 // Resolución mínima para máxima fluidez
        }
      );
      
      render();
    }

    async function setupCamera() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { 
            facingMode: currentFacing, 
            width: { ideal: 480 }, // Resolución de entrada baja
            height: { ideal: 360 } 
        }
      });
      video.srcObject = stream;
      video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      await video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    async function render() {
      // tf.tidy limpia automáticamente la memoria de la GPU
      await tf.tidy(async () => {
        if (detector && video.readyState === 4) {
          const poses = await detector.estimatePoses(video, { maxPoses: 4 });
          
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (isGhost) { ctx.fillStyle = "black"; ctx.fillRect(0,0,canvas.width,canvas.height); }

          ctx.save();
          if (currentFacing === 'user') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }

          for (let i = 0; i < poses.length; i++) {
            if (poses[i].score > 0.2) drawSimplePose(poses[i], COLORS[i]);
          }
          ctx.restore();
        }
      });
      
      // setTimeout a 0 permite que el navegador respire entre frames
      setTimeout(() => requestAnimationFrame(render), 0);
    }

    function drawSimplePose(pose, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      
      // Dibujar solo líneas, no puntos (el dibujo de círculos es lento)
      VITAL_CONNECTIONS.forEach(([i, j]) => {
        const p1 = pose.keypoints[i];
        const p2 = pose.keypoints[j];
        if (p1.score > 0.3 && p2.score > 0.3) {
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      });

      // Dibujar un pequeño cuadrado para la cabeza (más rápido que un círculo)
      const head = pose.keypoints[0];
      if (head.score > 0.3) {
        ctx.fillStyle = "white";
        ctx.fillRect(head.x - 2, head.y - 2, 4, 4);
      }
    }

    document.getElementById('btn-camera').onclick = async () => {
      currentFacing = (currentFacing === 'user') ? 'environment' : 'user';
      await setupCamera();
    };

    document.getElementById('btn-ghost').onclick = () => isGhost = !isGhost;

    init();
  </script>
</body>
</html>
