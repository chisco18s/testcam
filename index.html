<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>MobileKinect Pro — Body Tracking</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05050a;
      color: white;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    .container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    #video {
      position: absolute;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 1;
      transition: opacity 0.3s;
    }
    #canvas {
      position: absolute;
      width: 100%; height: 100%;
      z-index: 5;
    }
    /* UI Overlay */
    .ui-panel {
      position: absolute;
      bottom: 30px;
      width: 90%;
      max-width: 500px;
      background: rgba(15, 15, 25, 0.85);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 100;
      text-align: center;
    }
    .stats-container {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
    }
    .stat-box { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; min-width: 80px; }
    .stat-val { display: block; font-size: 20px; font-weight: bold; color: #4cc9f0; }
    .stat-label { font-size: 10px; text-transform: uppercase; opacity: 0.7; }

    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button {
      background: rgba(255,255,255,0.1);
      border: none; color: white; padding: 10px 5px;
      border-radius: 10px; font-size: 12px; cursor: pointer;
      transition: all 0.2s;
    }
    button:active { transform: scale(0.95); background: #4cc9f0; }
    button.active { background: #4361ee; box-shadow: 0 0 15px rgba(67, 97, 238, 0.5); }
    
    .instruction-tag {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;
      font-size: 13px; z-index: 10; border: 1px solid #4cc9f0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="instruction-tag" id="hint">Cargando IA...</div>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div class="ui-panel">
      <div class="stats-container">
        <div class="stat-box">
          <span class="stat-val" id="count-val">0</span>
          <span class="stat-label">Sentadillas</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="pose-name">Buscando...</span>
          <span class="stat-label">Estado</span>
        </div>
      </div>

      <div class="controls">
        <button id="btn-camera">🔄 Cámara</button>
        <button id="btn-ghost">👻 Modo Ghost</button>
        <button id="btn-snap">📸 Captura</button>
        <button class="filter-btn" data-filter="red">🔴 Rojo</button>
        <button class="filter-btn" data-filter="cyan">🔵 Cyan</button>
        <button class="filter-btn" data-filter="none">⚪ Reset</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const poseNameEl = document.getElementById('pose-name');
    const countEl = document.getElementById('count-val');
    
    let currentFacing = 'user';
    let isGhostMode = false;
    let colorTheme = '#4ade80';
    let squatCount = 0;
    let isDown = false;

    // Conexiones de esqueleto (MediaPipe)
    const POSE_CONNECTIONS = [
      [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // Brazos
      [11, 23], [12, 24], [23, 24], // Torso
      [23, 25], [24, 26], [25, 27], [26, 28] // Piernas
    ];

    async function setupCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing, width: 640, height: 480 },
        audio: false
      });
      video.srcObject = stream;
      return new Promise(resolve => video.onloadedmetadata = () => {
        video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        resolve();
      });
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    pose.onResults(onResults);

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Dibujar fondo si es modo ghost
      if (isGhostMode) {
        ctx.fillStyle = '#05050a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (results.poseLandmarks) {
        drawVisuals(results.poseLandmarks);
        analyzePose(results.poseLandmarks);
        document.getElementById('hint').textContent = "Cuerpo Detectado";
      } else {
        poseNameEl.textContent = "Buscando...";
        document.getElementById('hint').textContent = "Aléjate un poco más";
      }
      ctx.restore();
    }

    function drawVisuals(landmarks) {
      // Dibujar Conexiones
      POSE_CONNECTIONS.forEach(([i, j]) => {
        const start = landmarks[i];
        const end = landmarks[j];
        if (start.visibility > 0.5 && end.visibility > 0.5) {
          ctx.beginPath();
          ctx.moveTo(start.x * canvas.width, start.y * canvas.height);
          ctx.lineTo(end.x * canvas.width, end.y * canvas.height);
          ctx.lineWidth = 4;
          ctx.strokeStyle = colorTheme;
          ctx.shadowBlur = 10;
          ctx.shadowColor = colorTheme;
          ctx.stroke();
        }
      });

      // Dibujar Puntos Clave
      landmarks.forEach((pt) => {
        if (pt.visibility > 0.5) {
          ctx.beginPath();
          ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 5, 0, 2 * Math.PI);
          ctx.fillStyle = "#fff";
          ctx.fill();
        }
      });
    }

    function analyzePose(landmarks) {
      const hip = landmarks[23].y;
      const knee = landmarks[25].y;
      const shoulder = landmarks[11].y;

      // Lógica de Sentadilla
      // En coordenadas normalizadas, mayor Y significa más abajo en pantalla
      const dist = knee - hip;
      
      if (dist < 0.12 && !isDown) { // Hip cerca de Knee (Bajando)
        isDown = true;
        poseNameEl.textContent = "¡ABAJO!";
        poseNameEl.style.color = "#ff6b6b";
      } else if (dist > 0.22 && isDown) { // Subiendo
        isDown = false;
        squatCount++;
        countEl.textContent = squatCount;
        poseNameEl.textContent = "¡ARRIBA!";
        poseNameEl.style.color = "#4ade80";
      }
    }

    // Eventos de botones
    document.getElementById('btn-camera').onclick = async () => {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      await setupCamera();
    };

    document.getElementById('btn-ghost').onclick = function() {
      isGhostMode = !isGhostMode;
      this.classList.toggle('active');
      video.style.opacity = isGhostMode ? "0" : "1";
    };

    document.getElementById('btn-snap').onclick = () => {
      const link = document.createElement('a');
      link.download = 'kinect-capture.png';
      link.href = canvas.toDataURL();
      link.click();
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        const f = btn.dataset.filter;
        if(f === 'red') colorTheme = '#ff4d4d';
        else if(f === 'cyan') colorTheme = '#4cc9f0';
        else colorTheme = '#4ade80';
      };
    });

    async function run() {
      await setupCamera();
      const frameDetection = async () => {
        await pose.send({image: video});
        requestAnimationFrame(frameDetection);
      };
      frameDetection();
    }

    run();
  </script>
</body>
</html>
