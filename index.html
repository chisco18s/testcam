<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Kinect Life Coach Pro v3</title>
  <style>
    :root { --neon: #00f2ff; --accent: #7000ff; --danger: #ff4444; --zen: #00ff88; --warning: #ffcc00; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; position: fixed; width: 100%; height: 100%; }
    
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(0.6); }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

    /* --- PANTALLAS --- */
    .screen { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); transition: 0.5s; }
    .hidden { opacity: 0; pointer-events: none; }

    /* --- MENÚ PRINCIPAL --- */
    h1 { margin-bottom: 20px; font-size: 28px; color: var(--neon); text-shadow: 0 0 10px var(--neon); }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%; max-width: 450px; }
    .menu-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
      padding: 20px 10px; border-radius: 20px; color: white; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 10px; transition: 0.3s;
    }
    .menu-btn:active { background: var(--accent); transform: scale(0.95); }

    /* --- INSTRUCCIONES --- */
    #setup-guide { text-align: center; padding: 30px; }
    .guide-step { margin: 15px 0; font-size: 18px; color: #ccc; }
    .pulse { animation: pulse-red 2s infinite; }
    @keyframes pulse-red { 0% { color: white; } 50% { color: var(--neon); } 100% { color: white; } }

    /* --- HUD EN VIVO --- */
    #hud { position: absolute; top: 15px; width: 100%; padding: 0 15px; display: none; justify-content: space-between; z-index: 10; }
    .stat-card { background: rgba(0,0,0,0.7); padding: 12px; border-radius: 15px; border-top: 3px solid var(--neon); min-width: 100px; text-align: center; }
    .label { font-size: 10px; color: var(--neon); text-transform: uppercase; }
    .value { font-size: 22px; font-weight: bold; }

    /* --- ALERTAS --- */
    #alert-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; width: 90%; z-index: 50; pointer-events: none;
      font-size: 30px; font-weight: 900; opacity: 0; transition: 0.2s;
    }

    /* --- CONTROLES --- */
    .btn-home { position: absolute; bottom: 30px; right: 20px; z-index: 200; width: 60px; height: 60px; border-radius: 50%; background: var(--danger); border: none; color: white; font-size: 24px; display: none; cursor: pointer; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
  </style>
</head>
<body>

  <div id="screen-menu" class="screen">
    <h1>LIFE QUALITY AI</h1>
    <p style="margin-bottom:20px; color:#888;">Elige tu modo de bienestar:</p>
    <div class="menu-grid">
      <div class="menu-btn" onclick="showSetup('fitness')"><span>💪</span><span>FITNESS PRO</span></div>
      <div class="menu-btn" onclick="showSetup('posture')"><span>🧘</span><span>POSTURA SMART</span></div>
      <div class="menu-btn" onclick="showSetup('balance')"><span>⚖️</span><span>EQUILIBRIO</span></div>
      <div class="menu-btn" onclick="showSetup('break')"><span>💻</span><span>PAUSA ACTIVA</span></div>
    </div>
  </div>

  <div id="screen-setup" class="screen hidden">
    <h2 id="setup-title" style="color:var(--neon)">PREPARACIÓN</h2>
    <div id="setup-guide">
      <div class="guide-step">1. Aléjate de la cámara (2-3 metros).</div>
      <div class="guide-step">2. Asegúrate de que se vean tus <b class="pulse">PIES y CABEZA</b>.</div>
      <div class="guide-step">3. Ilumina bien tu habitación.</div>
      <div class="guide-step" id="mode-instruction" style="color:var(--zen)">Instrucción del modo...</div>
    </div>
    <button class="menu-btn" style="background:var(--accent); padding:15px 40px;" onclick="startApp()">¡ESTOY LISTO!</button>
  </div>

  <div id="hud">
    <div class="stat-card"><span class="label" id="l1">Dato</span><span id="v1" class="value">0</span></div>
    <div id="sitting-tag" class="stat-card" style="border-color:var(--warning)"><span class="label">ESTADO</span><span id="v-status" class="value">BUSCANDO...</span></div>
    <div class="stat-card" style="border-color:var(--zen)"><span class="label" id="l2">Dato</span><span id="v2" class="value">0</span></div>
  </div>

  <button id="btn-home" class="btn-home" onclick="exitToMenu()">🏠</button>
  <div id="alert-overlay">ALERTA</div>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>

  <script>
    // --- MOTOR DE AUDIO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if(type === 'success') { // Tono agudo (Bien)
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        } else { // Tono grave (Error)
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        }
        
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
        osc.stop(audioCtx.currentTime + 0.5);
    }

    // --- VARIABLES GLOBALES ---
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const alertOverlay = document.getElementById('alert-overlay');
    
    let poseDetector;
    let currentMode = null;
    let isRunning = false;
    let isSitting = false;
    let reps = 0, stage = "start";

    // --- INICIALIZACIÓN ---
    async function init() {
      poseDetector = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
      poseDetector.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
      poseDetector.onResults(onResults);
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
      video.srcObject = stream;
      video.style.transform = "scaleX(-1)";
      video.onloadedmetadata = () => { video.play(); resize(); };
      
      const loop = async () => {
        if (isRunning && video.readyState >= 2) await poseDetector.send({ image: video });
        requestAnimationFrame(loop);
      };
      loop();
    }

    function showSetup(mode) {
        currentMode = mode;
        document.getElementById('screen-menu').classList.add('hidden');
        document.getElementById('screen-setup').classList.remove('hidden');
        const inst = document.getElementById('mode-instruction');
        if(mode === 'fitness') inst.innerText = "Haremos Sentadillas. Mantente de pie.";
        if(mode === 'posture') inst.innerText = "Analizaremos tu espalda sentado o de pie.";
        if(mode === 'balance') inst.innerText = "Ponte sobre una pierna cuando la app lo pida.";
        if(mode === 'break') inst.innerText = "Estiramientos guiados para tu jornada.";
    }

    function startApp() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        isRunning = true;
        document.getElementById('screen-setup').classList.add('hidden');
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('btn-home').style.display = 'block';
        setupHUD();
    }

    function exitToMenu() {
        isRunning = false;
        document.getElementById('screen-menu').classList.remove('hidden');
        document.getElementById('hud').style.display = 'none';
        document.getElementById('btn-home').style.display = 'none';
        reps = 0;
    }

    function setupHUD() {
        const l1 = document.getElementById('l1'), l2 = document.getElementById('l2');
        if(currentMode === 'fitness') { l1.innerText="REPS"; l2.innerText="META"; }
        if(currentMode === 'posture') { l1.innerText="ESTADO"; l2.innerText="CUELLO"; }
        if(currentMode === 'break') { l1.innerText="PASO"; l2.innerText="TIEMPO"; }
    }

    // --- PROCESAMIENTO ---
    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(canvas.width, 0); ctx.scale(-1, 1);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        drawSkeleton(lm);
        detectSitting(lm);

        if(currentMode === 'fitness') fitnessLogic(lm);
        if(currentMode === 'posture') postureLogic(lm);
        if(currentMode === 'break') breakLogic(lm);
      } else {
          showToast("¡NO TE VEO! ALÉJATE", "warning");
      }
      ctx.restore();
    }

    function detectSitting(lm) {
        // Lógica: Si la distancia vertical cadera-rodilla es pequeña, está sentado
        const hipY = (lm[23].y + lm[24].y) / 2;
        const kneeY = (lm[25].y + lm[26].y) / 2;
        const ankleY = (lm[27].y + lm[28].y) / 2;
        
        isSitting = (Math.abs(hipY - kneeY) < 0.12);
        document.getElementById('v-status').innerText = isSitting ? "SENTADO" : "DE PIE";
    }

    function fitnessLogic(lm) {
        if(isSitting) { showToast("¡PONTE DE PIE PARA EJERCITAR!", "warning"); return; }
        const hip = lm[24].y, knee = lm[26].y;
        if(stage === "start" && hip > knee - 0.05) { stage = "down"; playSound('success'); }
        if(stage === "down" && hip < knee - 0.15) { reps++; stage = "start"; playSound('success'); }
        document.getElementById('v1').innerText = reps;
        document.getElementById('v2').innerText = "15";
    }

    function postureLogic(lm) {
        const ear = lm[8], shoulder = lm[12];
        const neckLean = Math.abs(ear.x - shoulder.x);
        
        document.getElementById('v1').innerText = isSitting ? "EN SILLA" : "ERGUIDO";
        document.getElementById('v2').innerText = (neckLean * 100).toFixed(0) + "°";

        if(neckLean > 0.18) {
            showToast("¡ENDEREZA LA CABEZA!", "danger");
            playSound('error');
        } else {
            hideToast();
        }
    }

    function breakLogic(lm) {
        const handL = lm[15].y, head = lm[0].y;
        if(handL < head) {
            showToast("¡EXCELENTE ESTIRAMIENTO!", "success");
            document.getElementById('v1').innerText = "BIEN";
        } else {
            showToast("ESTIRA LOS BRAZOS ARRIBA", "warning");
            document.getElementById('v1').innerText = "ESPERANDO";
        }
    }

    // --- UI HELPERS ---
    function showToast(txt, type) {
        alertOverlay.innerText = txt;
        alertOverlay.style.color = type === 'danger' ? 'var(--danger)' : (type === 'success' ? 'var(--zen)' : 'var(--warning)');
        alertOverlay.style.opacity = 1;
    }
    function hideToast() { alertOverlay.style.opacity = 0; }

    function drawSkeleton(lm) {
        ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 3;
        const connections = [[11,12], [11,23], [12,24], [23,24], [11,13], [13,15], [12,14], [14,16], [23,25], [25,27], [24,26], [26,28]];
        connections.forEach(([a,b]) => {
            if(lm[a].visibility > 0.5 && lm[b].visibility > 0.5) {
                ctx.beginPath();
                ctx.moveTo(lm[a].x * canvas.width, lm[a].y * canvas.height);
                ctx.lineTo(lm[b].x * canvas.width, lm[b].y * canvas.height);
                ctx.stroke();
            }
        });
        // Puntos de interés
        ctx.fillStyle = varColor();
        [0, 15, 16, 27, 28].forEach(i => {
            ctx.beginPath();
            ctx.arc(lm[i].x * canvas.width, lm[i].y * canvas.height, 5, 0, 7);
            ctx.fill();
        });
    }

    function varColor() {
        if(currentMode === 'fitness') return '#00f2ff';
        if(currentMode === 'posture') return '#ffcc00';
        return '#00ff88';
    }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    init();
  </script>
</body>
</html>
