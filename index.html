<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPECTRAL AI - ADVANCED SCANNER</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <style>
        :root { 
            --main: #00ff41; 
            --danger: #ff3e3e; 
            --warn: #ffcc00; 
            --glass: rgba(0, 20, 0, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Courier New', monospace; }
        
        body { 
            background: #000; 
            color: var(--main); 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            user-select: none;
        }

        /* Capas de Video y Filtros */
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .filter-normal { filter: brightness(0.6) contrast(1.1); }
        .filter-night { filter: brightness(1.8) sepia(100%) hue-rotate(70deg) saturate(4); }
        .filter-thermal { filter: brightness(0.9) contrast(2.5) hue-rotate(240deg) saturate(5); }
        .filter-spectro { filter: invert(1) hue-rotate(180deg) contrast(1.5); }

        #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* Marco de Escaneo */
        .scan-line {
            position: absolute; width: 100%; height: 2px; background: rgba(0, 255, 65, 0.2);
            top: 0; z-index: 15; animation: scan 4s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        /* HUD Superior Profesional */
        #hud-top { 
            position: absolute; top: 0; width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr;
            z-index: 20; padding: 50px 15px 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .stat-box { text-align: center; }
        .label { font-size: 9px; opacity: 0.8; margin-bottom: 2px; }
        .value { font-size: 14px; font-weight: 800; }

        /* Botonera Lateral Inferior */
        #ui-layer { 
            position: absolute; bottom: 100px; right: 15px; 
            display: flex; flex-direction: column; gap: 10px; z-index: 30; 
        }
        .btn { 
            background: var(--glass); border: 1px solid var(--main); color: var(--main); 
            padding: 10px; font-size: 10px; border-radius: 2px; font-weight: bold;
            backdrop-filter: blur(5px); transition: 0.3s;
        }
        .btn.active { background: var(--main); color: #000; box-shadow: 0 0 15px var(--main); }

        /* Consola de Alertas */
        #registry { 
            position: absolute; bottom: 100px; left: 15px; width: 60%;
            height: 80px; background: rgba(0,0,0,0.5); border-left: 2px solid var(--main); 
            padding: 8px; z-index: 25; overflow: hidden; font-size: 9px;
            display: flex; flex-direction: column-reverse;
        }
        .log-entry { margin-bottom: 3px; border-bottom: 1px solid rgba(0,255,65,0.1); padding-bottom: 2px; }

        /* Etiqueta de Entidad */
        .entity-tag { 
            position: absolute; color: #fff; padding: 5px 12px; 
            border: 1px solid var(--danger); background: rgba(255, 0, 0, 0.2); 
            backdrop-filter: blur(5px); z-index: 40; font-size: 11px; font-weight: bold;
            pointer-events: none; border-radius: 3px; text-shadow: 0 0 5px #000;
        }

        .bottom-ui { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #000; z-index: 50; display: flex; justify-content: space-between; 
            align-items: center; padding: 0 20px; border-top: 1px solid var(--main);
        }

        #start-screen { 
            position: fixed; inset: 0; background: #000; z-index: 100; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        
        .capture-btn {
            width: 60px; height: 60px; background: var(--danger); border: 4px solid #fff;
            border-radius: 50%; box-shadow: 0 0 20px var(--danger);
        }
    </style>
</head>
<body>

<div id="start-screen">
    <div style="border: 1px solid var(--main); padding: 40px; text-align: center;">
        <h2 style="letter-spacing: 8px; margin-bottom: 20px;">SPECTRAL AI</h2>
        <p style="font-size: 10px; margin-bottom: 30px; opacity: 0.6;">SISTEMA DE ANÁLISIS BIO-ESPECTRAL V6.0</p>
        <button onclick="init()" class="btn" style="padding: 15px 30px;">AUTORIZAR ACCESO</button>
    </div>
</div>

<div class="scan-line"></div>
<video id="video" class="filter-normal" playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud-top">
    <div class="stat-box"><div class="label">SENS. PROXIMITY</div><div id="emf" class="value">0.00</div></div>
    <div class="stat-box"><div class="label">STATUS</div><div id="threat" class="value">SCANNING</div></div>
    <div class="stat-box"><div class="label">LATENCY</div><div class="value">24ms</div></div>
</div>

<div id="ui-layer">
    <button class="btn active" onclick="setFilter('normal', this)">STD</button>
    <button class="btn" onclick="setFilter('night', this)">NVD</button>
    <button class="btn" onclick="setFilter('thermal', this)">THR</button>
    <button class="btn" onclick="setFilter('spectro', this)">SPC</button>
</div>

<div id="registry"></div>
<div id="entity-tag" class="entity-tag" style="display:none"></div>

<div class="bottom-ui">
    <div style="font-size: 9px; opacity: 0.7;">CORE: ACTIVE<br>SENSORS: 100%</div>
    <button class="capture-btn" onclick="takePhoto()"></button>
    <div style="text-align:right"><div class="label">SYSTEM TIME</div><div id="clock" style="font-size: 14px; color:#fff">00:00:00</div></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const registry = document.getElementById('registry');
    const tag = document.getElementById('entity-tag');
    let audioCtx = null;
    let currentEntityName = "";

    // GENERADOR DE NOMBRES ALEATORIOS PROFESIONALES
    function generatePhenomenon() {
        const prefix = ["ANOMALÍA", "ENTIDAD", "MANIFESTACIÓN", "RESIDUO", "VÓRTICE", "PRESENCIA"];
        const nature = ["ELECTROMAGNÉTICA", "TÉRMICA", "ECTOPLÁSMICA", "SÓNICA", "RADIACTIVA", "DIMENSIONAL"];
        const level = ["CLASE-I", "CLASE-V", "TIPO-B", "ALPHA", "OMEGA", "NO-IDENTIFICADO"];
        
        return `${prefix[Math.floor(Math.random()*prefix.length)]} ${nature[Math.floor(Math.random()*nature.length)]} [${level[Math.floor(Math.random()*level.length)]}]`;
    }

    function setFilter(type, btn) {
        video.className = 'filter-' + type;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        beep(100, 0.05);
    }

    function beep(freq, dur) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    }

    async function init() {
        document.getElementById('start-screen').style.display = 'none';
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", focusMode: "continuous" } 
        });
        video.srcObject = stream;
        video.play();
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.6 });
        pose.onResults(onResults);

        const frame = async () => {
            if(video.readyState === 4) await pose.send({ image: video });
            requestAnimationFrame(frame);
        };
        frame();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    }

    function onResults(res) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const threatEl = document.getElementById('threat');

        if (res.poseLandmarks) {
            if (!currentEntityName) {
                currentEntityName = generatePhenomenon();
                addLog(currentEntityName);
                beep(800, 0.2);
            }
            drawGhost(res.poseLandmarks);
            updateHUD(true);
        } else {
            currentEntityName = "";
            tag.style.display = 'none';
            updateHUD(false);
        }
    }

    function drawGhost(lm) {
        ctx.strokeStyle = "rgba(0, 255, 65, 0.5)";
        ctx.lineWidth = 1;
        
        const head = lm[0];
        tag.style.display = 'block';
        tag.style.left = (head.x * canvas.width) + 'px';
        tag.style.top = (head.y * canvas.height - 40) + 'px';
        tag.innerText = currentEntityName;

        // Dibujo de esqueleto estilo "Wireframe" profesional
        ctx.beginPath();
        lm.forEach((p, i) => {
            const x = p.x * canvas.width;
            const y = p.y * canvas.height;
            ctx.lineTo(x, y);
            ctx.fillStyle = "rgba(0, 255, 65, 0.8)";
            ctx.fillRect(x-2, y-2, 4, 4);
        });
        ctx.stroke();
    }

    function addLog(name) {
        const item = document.createElement('div');
        item.className = 'log-entry';
        item.innerHTML = `<span style="color:var(--danger)">[DETECTADO]</span> ${name}`;
        registry.prepend(item);
        if (registry.children.length > 5) registry.lastChild.remove();
    }

    function updateHUD(det) {
        const emf = det ? (12.4 + Math.random()*40).toFixed(2) : (Math.random()*0.8).toFixed(2);
        document.getElementById('emf').innerText = emf + " μT";
        const threat = document.getElementById('threat');
        threat.innerText = det ? "⚠️ WARNING" : "SCANNING";
        threat.style.color = det ? "var(--danger)" : "var(--main)";
    }

    function takePhoto() {
        const captureCanvas = document.createElement('canvas');
        captureCanvas.width = canvas.width;
        captureCanvas.height = canvas.height;
        const cCtx = captureCanvas.getContext('2d');
        cCtx.filter = getComputedStyle(video).filter;
        cCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
        cCtx.filter = 'none';
        cCtx.drawImage(canvas, 0, 0);
        
        const link = document.createElement('a');
        link.download = `EV_${Date.now()}.png`;
        link.href = captureCanvas.toDataURL();
        link.click();
        beep(1200, 0.1);
    }
</script>
</body>
</html>
