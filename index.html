<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPECTRAL AI v8 - GEOMETRIC MESH</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <style>
        :root { --main: #00ff41; --danger: #ff0000; --ui-color: var(--main); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: #000; color: var(--ui-color); overflow: hidden; width: 100vw; height: 100vh; transition: color 0.4s; }

        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.7; }
        #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* HUD Superior */
        #hud-top { 
            position: absolute; top: 0; width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr;
            z-index: 20; padding: 50px 15px 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            border-bottom: 1px solid var(--ui-color);
        }
        .val { font-size: 14px; font-weight: bold; display: block; }
        .label { font-size: 8px; text-transform: uppercase; opacity: 0.7; }

        /* Consola EVP */
        #evp-console {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            width: 80%; text-align: center; z-index: 25; padding: 10px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--ui-color);
        }
        #evp-word { font-size: 20px; font-weight: bold; color: #fff; letter-spacing: 3px; }

        /* Etiqueta de Entidad */
        .entity-tag { 
            position: absolute; color: #fff; padding: 5px 10px; border: 1px solid #fff;
            background: var(--danger); z-index: 40; font-size: 10px; font-weight: bold;
            pointer-events: none; text-transform: uppercase;
        }

        .bottom-ui { 
            position: fixed; bottom: 0; width: 100%; height: 80px; background: #000;
            z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            border-top: 1px solid var(--ui-color);
        }
        .capture-btn { width: 60px; height: 60px; background: var(--danger); border: 4px solid #fff; border-radius: 50%; box-shadow: 0 0 15px var(--danger); }

        #start-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1 style="color:var(--main); letter-spacing: 5px;">SPECTRAL AI v8.0</h1>
    <p style="font-size: 10px; margin-bottom: 20px;">BIO-GEOMETRIC MESH SCANNER</p>
    <button onclick="init()" style="background:none; border:1px solid var(--main); color:var(--main); padding:15px 30px; cursor:pointer;">[ AUTORIZAR ]</button>
</div>

<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud-top">
    <div style="text-align:center"><span class="label">MAG_EMF</span><span id="emf" class="val">0.00</span></div>
    <div style="text-align:center"><span class="label">GEOMETRÍA</span><span id="obj-type" class="val">SCAN...</span></div>
    <div style="text-align:center"><span class="label">AUDIO_FRQ</span><span id="audio-lvl" class="val">0%</span></div>
</div>

<div id="evp-console">
    <span class="label">SISTEMA PSICOFÓNICO EVP</span><br>
    <span id="evp-word">---</span>
</div>

<div id="entity-tag" class="entity-tag" style="display:none"></div>

<div class="bottom-ui">
    <div style="font-size: 8px;">MESH_ENGINE: ACTIVE<br>SENSORS: 100%</div>
    <button class="capture-btn" onclick="takePhoto()"></button>
    <div style="text-align:right"><span id="clock" style="font-size: 14px; color:#fff">00:00:00</span></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tag = document.getElementById('entity-tag');
    let audioCtx, analyser, dataArray;
    
    let activeEntity = null;

    const WORDS_EVP = ["MÍRAME", "FRÍO", "VETE", "AQUÍ", "SOMBRA", "SANGRE", "NUNCA", "PUERTA"];
    const SPECTRA_TYPES = ["ESPECTRO HUMANOIDE", "ANOMALÍA VOLUMÉTRICA", "BIO-RESIDUO CLASE A"];

    function getStaticEntity() {
        return {
            name: SPECTRA_TYPES[Math.floor(Math.random() * SPECTRA_TYPES.length)],
            id: "ID-" + Math.floor(Math.random()*999)
        };
    }

    async function init() {
        document.getElementById('start-screen').style.display = 'none';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
        video.srcObject = stream;
        video.play();
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
        pose.onResults(onResults);

        const frame = async () => {
            if(video.readyState === 4) {
                await pose.send({ image: video });
                updateEVP();
            }
            requestAnimationFrame(frame);
        };
        frame();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    }

    function onResults(res) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (res.poseLandmarks) {
            if (!activeEntity) {
                activeEntity = getStaticEntity();
                document.body.style.setProperty('--ui-color', 'var(--danger)');
                navigator.vibrate([100, 50, 100]);
            }
            drawGeometricMesh(res.poseLandmarks);
            document.getElementById('obj-type').innerText = "DETECTADO";
        } else {
            if (activeEntity) {
                activeEntity = null;
                document.body.style.setProperty('--ui-color', 'var(--main)');
                tag.style.display = 'none';
                document.getElementById('obj-type').innerText = "SCAN...";
            }
        }
    }

    function drawGeometricMesh(lm) {
        const head = lm[0];
        tag.style.display = 'block';
        tag.style.left = (head.x * canvas.width) + 'px';
        tag.style.top = (head.y * canvas.height - 40) + 'px';
        tag.innerText = `${activeEntity.name} | ${activeEntity.id}`;

        // Estilo de Malla: Puntos y Líneas de interconexión
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.fillStyle = "rgba(255, 255, 255, 1)";

        // Dibujar Conexiones Triangulares/Malla
        ctx.beginPath();
        for(let i = 0; i < lm.length; i++) {
            const p1 = lm[i];
            const x1 = p1.x * canvas.width;
            const y1 = p1.y * canvas.height;

            // Conectar cada punto con los siguientes 2 para crear efecto de malla
            for(let j = i + 1; j < i + 3 && j < lm.length; j++) {
                const p2 = lm[j];
                ctx.moveTo(x1, y1);
                ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
            }
            
            // Dibujar el Punto (vértice)
            ctx.fillRect(x1 - 2, y1 - 2, 4, 4);
        }
        ctx.stroke();

        // Añadir "Glow" a la forma
        ctx.shadowBlur = 15;
        ctx.shadowColor = "white";
    }

    function updateEVP() {
        analyser.getByteFrequencyData(dataArray);
        const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
        document.getElementById('audio-lvl').innerText = Math.floor(avg) + "%";

        if (avg > 35 && Math.random() > 0.99) {
            const word = WORDS_EVP[Math.floor(Math.random() * WORDS_EVP.length)];
            document.getElementById('evp-word').innerText = word;
            setTimeout(() => { document.getElementById('evp-word').innerText = "---"; }, 1500);
            
            // Si hay detección y ruido alto, hablar (Síntesis de voz)
            if (activeEntity) speak(word);
        }
        
        document.getElementById('emf').innerText = (activeEntity ? 40 + avg : avg/3).toFixed(2);
    }

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 0.6;
        msg.pitch = 0.1;
        msg.volume = 0.5;
        window.speechSynthesis.speak(msg);
    }

    function takePhoto() {
        alert("GEOMETRÍA ESPECTRAL CAPTURADA");
    }
</script>
</body>
</html>
