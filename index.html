<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>MobileKinect Pro — Ultra Tracking</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05050a; color: white;
      font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none;
    }
    .container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    #video {
      position: absolute; width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1); transition: opacity 0.3s;
    }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; }

    /* HUD de Estadísticas */
    .ui-panel {
      position: absolute; bottom: 30px; width: 90%; max-width: 500px;
      background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(10px);
      padding: 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
      z-index: 100; text-align: center;
    }
    .stats-container { display: flex; justify-content: space-around; margin-bottom: 15px; }
    .stat-box { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; min-width: 80px; border-bottom: 2px solid #4cc9f0; }
    .stat-val { display: block; font-size: 20px; font-weight: bold; color: #4cc9f0; }
    .stat-label { font-size: 10px; text-transform: uppercase; opacity: 0.7; }

    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    button {
      background: rgba(255,255,255,0.1); border: none; color: white; padding: 12px 5px;
      border-radius: 12px; font-size: 12px; cursor: pointer; transition: all 0.2s; font-weight: bold;
    }
    button:active { transform: scale(0.9); background: #4cc9f0; color: #000; }
    button.active { background: #4361ee; box-shadow: 0 0 15px rgba(67, 97, 238, 0.5); }
    
    .instruction-tag {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px;
      font-size: 14px; z-index: 10; border: 1px solid #4cc9f0; color: #4cc9f0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="instruction-tag" id="hint">Iniciando Sensores...</div>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div class="ui-panel">
      <div class="stats-container">
        <div class="stat-box">
          <span class="stat-val" id="count-val">0</span>
          <span class="stat-label">Sentadillas</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="punch-val">0</span>
          <span class="stat-label">Golpes</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="pose-name">Buscando</span>
          <span class="stat-label">Gesto</span>
        </div>
      </div>

      <div class="controls">
        <button id="btn-camera">🔄 Cámara</button>
        <button id="btn-ghost">👻 Modo Ghost</button>
        <button id="btn-reset">🗑️ Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const poseNameEl = document.getElementById('pose-name');
    const countEl = document.getElementById('count-val');
    const punchEl = document.getElementById('punch-val');
    
    let currentFacing = 'user';
    let isGhostMode = false;
    let colorTheme = '#4cc9f0';
    let squatCount = 0;
    let punchCount = 0;
    let isDown = false;
    let lastHandY = 0;

    const POSE_CONNECTIONS = [
      [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
      [11, 23], [12, 24], [23, 24],
      [23, 25], [24, 26], [25, 27], [26, 28]
    ];

    async function setupCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing, width: 640, height: 480 },
        audio: false
      });
      video.srcObject = stream;
      return new Promise(resolve => video.onloadedmetadata = () => {
        video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        resolve();
      });
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    pose.onResults(onResults);

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (isGhostMode) {
        ctx.fillStyle = '#05050a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (results.poseLandmarks) {
        drawVisuals(results.poseLandmarks);
        analyzeMovement(results.poseLandmarks);
        document.getElementById('hint').textContent = "Sistema Activo";
      } else {
        document.getElementById('hint').textContent = "Buscando persona...";
      }
      ctx.restore();
    }

    function drawVisuals(landmarks) {
      // Dibujar líneas de esqueleto con resplandor
      ctx.lineWidth = 5;
      ctx.strokeStyle = colorTheme;
      ctx.shadowBlur = 15;
      ctx.shadowColor = colorTheme;

      POSE_CONNECTIONS.forEach(([i, j]) => {
        const s = landmarks[i];
        const e = landmarks[j];
        if (s.visibility > 0.6 && e.visibility > 0.6) {
          ctx.beginPath();
          ctx.moveTo(s.x * canvas.width, s.y * canvas.height);
          ctx.lineTo(e.x * canvas.width, e.y * canvas.height);
          ctx.stroke();
        }
      });

      // Dibujar puntos clave
      ctx.shadowBlur = 0;
      landmarks.forEach((pt, index) => {
        if (pt.visibility > 0.6 && index > 10) {
          ctx.beginPath();
          ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 4, 0, 2 * Math.PI);
          ctx.fillStyle = "#fff";
          ctx.fill();
        }
      });
    }

    function analyzeMovement(lm) {
      // 1. Lógica de Sentadilla
      const hipY = (lm[23].y + lm[24].y) / 2;
      const kneeY = (lm[25].y + lm[26].y) / 2;
      const diff = kneeY - hipY;

      if (diff < 0.12 && !isDown) {
        isDown = true;
      } else if (diff > 0.22 && isDown) {
        isDown = false;
        squatCount++;
        countEl.textContent = squatCount;
      }

      // 2. Lógica de Golpes (Punch)
      const rWrist = lm[16];
      const rShoulder = lm[12];
      // Si la muñeca se mueve rápido hacia adelante (eje Z o cambio brusco en X)
      if (rWrist.visibility > 0.8 && rWrist.y < rShoulder.y && Math.abs(rWrist.z) > 1.2) {
         if (Date.now() - lastHandY > 500) { // Anti-rebote
            punchCount++;
            punchEl.textContent = punchCount;
            lastHandY = Date.now();
         }
      }

      // 3. Reconocimiento de Gestos
      const lWrist = lm[15];
      const nose = lm[0];
      if (lWrist.y < nose.y || rWrist.y < nose.y) {
        poseNameEl.textContent = "HOLA 👋";
        poseNameEl.style.color = "#4ade80";
      } else if (diff < 0.12) {
        poseNameEl.textContent = "ABAJO";
        poseNameEl.style.color = "#ff6b6b";
      } else {
        poseNameEl.textContent = "IDLE";
        poseNameEl.style.color = "#4cc9f0";
      }
    }

    // Botones
    document.getElementById('btn-camera').onclick = async () => {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      await setupCamera();
    };

    document.getElementById('btn-ghost').onclick = function() {
      isGhostMode = !isGhostMode;
      this.classList.toggle('active');
      video.style.opacity = isGhostMode ? "0" : "1";
    };

    document.getElementById('btn-reset').onclick = () => {
      squatCount = 0; punchCount = 0;
      countEl.textContent = "0"; punchEl.textContent = "0";
    };

    async function run() {
      await setupCamera();
      const frameDetection = async () => {
        await pose.send({image: video});
        requestAnimationFrame(frameDetection);
      };
      frameDetection();
    }

    run();
  </script>
</body>
</html>
