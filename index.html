<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Kinect AI Pro — High Performance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: sans-serif; overflow: hidden; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
    
    .status {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px;
      color: #00f2ff; font-size: 11px; z-index: 10; border: 1px solid rgba(0,242,255,0.3);
      backdrop-filter: blur(5px);
    }

    .ui { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 10; }
    button {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2); color: white;
      padding: 12px 22px; border-radius: 50px; cursor: pointer; font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="status" id="status">OPTIMIZANDO RENDIMIENTO...</div>
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="ui">
    <button id="btn-camera">🔄 Cámara</button>
    <button id="btn-ghost">👻 Modo Ghost</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    
    let detector;
    let isGhost = false;
    let currentFacing = 'user';
    const COLORS = ['#00f2ff', '#39ff14', '#ff0055', '#ffea00'];

    // Conexiones simplificadas para ganar FPS
    const CONNECTIONS = [[0,1],[0,2],[5,6],[5,11],[6,12],[11,12],[5,7],[7,9],[6,8],[8,10],[11,13],[13,15],[12,14],[14,16]];

    async function init() {
      // Forzar Backend WebGL para usar la GPU del Honor
      await tf.setBackend('webgl');
      
      await setupCamera();
      
      detector = await poseDetection.createDetector(
        poseDetection.SupportedModels.MoveNet, 
        {
          modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
          enableSmoothing: true,
          multiPoseMaxDimension: 256 // Resolución reducida para máxima velocidad
        }
      );
      
      statusEl.innerText = "SISTEMA FLUIDO ACTIVO";
      render();
    }

    async function setupCamera() {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());

      // Resolución ideal balanceada para el Honor 400 Lite
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing, width: 640, height: 480 }
      });
      
      video.srcObject = stream;
      video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      
      return new Promise(res => {
        video.onloadedmetadata = () => {
          video.play();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          res();
        };
      });
    }

    async function render() {
      // Solo procesar si el video está listo para evitar lag
      if (detector && video.readyState === 4) {
        const poses = await detector.estimatePoses(video, {
          flipHorizontal: false,
          maxPoses: 4 // Límite de 4 personas
        });
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        if (currentFacing === 'user') {
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        }

        if (isGhost) {
          ctx.fillStyle = "black";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Dibujar solo poses con confianza alta (>20%)
        for (let i = 0; i < Math.min(poses.length, 4); i++) {
          if (poses[i].score > 0.2) {
            drawPose(poses[i], COLORS[i]);
          }
        }
        ctx.restore();
      }
      // Sincronización con el refresco de pantalla del móvil
      requestAnimationFrame(render);
    }

    function drawPose(pose, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 3; // Línea más delgada para reducir carga de dibujo
      ctx.lineCap = "round";

      CONNECTIONS.forEach(([i, j]) => {
        const p1 = pose.keypoints[i];
        const p2 = pose.keypoints[j];
        if (p1.score > 0.3 && p2.score > 0.3) {
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      });
    }

    document.getElementById('btn-camera').onclick = async () => {
      currentFacing = (currentFacing === 'user') ? 'environment' : 'user';
      statusEl.innerText = "REAJUSTANDO CÁMARA...";
      await setupCamera();
      statusEl.innerText = "SISTEMA FLUIDO ACTIVO";
    };

    document.getElementById('btn-ghost').onclick = function() {
      isGhost = !isGhost;
      video.style.opacity = isGhost ? "0" : "1";
    };

    init();
  </script>
</body>
</html>
