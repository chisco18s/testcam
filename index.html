<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spectral AI Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <style>
        :root { --main: #00ff41; --danger: #ff3c3c; --ghost: #00f2ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: #000; color: var(--main); overflow: hidden; position: fixed; width: 100vw; height: 100vh; }

        /* Filtros Dinámicos */
        .filter-normal { filter: brightness(0.5) grayscale(1); }
        .filter-thermal { filter: brightness(0.6) contrast(2) saturate(5) hue-rotate(240deg); }
        .filter-night { filter: brightness(0.8) sepia(100%) hue-rotate(80deg) saturate(2); }
        .filter-spectro { filter: brightness(0.5) invert(1) hue-rotate(180deg); }

        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; transition: filter 0.5s; }
        #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* Interfaz HUD */
        #hud-top { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-around; z-index: 20; padding: 45px 10px 15px; background: rgba(0,0,0,0.7); border-bottom: 1px solid var(--main); }
        .value { font-size: 1.2rem; font-weight: bold; color: white; }

        /* Selector de Filtros */
        #filter-bar { position: absolute; top: 110px; left: 0; width: 100%; display: flex; justify-content: center; gap: 5px; z-index: 30; padding: 5px; }
        .filter-btn { background: rgba(0,0,0,0.8); border: 1px solid var(--main); color: var(--main); padding: 8px 12px; font-size: 10px; border-radius: 4px; text-transform: uppercase; }
        .filter-btn.active { background: var(--main); color: black; }

        /* Consola de Registro */
        #registry { position: absolute; bottom: 130px; left: 15px; right: 15px; height: 120px; background: rgba(0,20,0,0.5); border-left: 3px solid var(--danger); padding: 10px; z-index: 20; overflow: hidden; display: flex; flex-direction: column-reverse; font-size: 11px; }
        .log-item { margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        .log-name { color: var(--danger); font-weight: bold; }

        /* Etiqueta flotante */
        .entity-tag { position: absolute; color: white; font-weight: bold; padding: 5px 10px; border: 1px solid var(--danger); background: rgba(255,0,0,0.4); z-index: 40; font-size: 12px; transform: translate(-50%, -100%); pointer-events: none; }

        .bottom-ui { position: fixed; bottom: 0; width: 100%; height: 100px; background: #000; z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 20px 20px; border-top: 1px solid var(--main); }
        #start-screen { position: fixed; inset: 0; background: black; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1 style="color:var(--danger); letter-spacing: 5px; margin-bottom: 20px;">SPECTRAL AI v3.0</h1>
    <button onclick="init()" style="padding: 20px 40px; background: transparent; border: 2px solid var(--main); color: var(--main); font-size: 1.2rem;">ACTIVAR ESCÁNER</button>
</div>

<video id="video" class="filter-normal" playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud-top">
    <div style="text-align:center"><small>EMF</small><div id="emf" class="value">0.00</div></div>
    <div style="text-align:center"><small>AMENAZA</small><div id="threat" class="value" style="color:var(--danger)">BAJA</div></div>
</div>

<div id="filter-bar">
    <button class="filter-btn active" onclick="setFilter('normal', this)">Normal</button>
    <button class="filter-btn" onclick="setFilter('thermal', this)">Térmica</button>
    <button class="filter-btn" onclick="setFilter('night', this)">Nocturna</button>
    <button class="filter-btn" onclick="setFilter('spectro', this)">Espectro</button>
</div>

<div id="registry"></div>
<div id="entity-tag" class="entity-tag" style="display:none"></div>

<div class="bottom-ui">
    <div><small>SISTEMA</small><br>ONLINE</div>
    <div style="text-align:right"><small>TIEMPO ACTIVO</small><br><span id="clock">00:00:00</span></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const registry = document.getElementById('registry');
    const tag = document.getElementById('entity-tag');

    const ENTITIES = [
        { n: "Paimon", d: "Rey infernal. Voz atronadora detectada." },
        { n: "Valak", d: "Entidad de alta jerarquía. Forma infantil." },
        { n: "The Hat Man", d: "Sombra residual. Vigilante del sueño." },
        { n: "Zozo", d: "Entidad parasitaria de tableros. Peligro." },
        { n: "Banshee", d: "Heraldo de muerte. Frecuencia sónica alta." }
    ];

    let currentName = "";

    function setFilter(type, btn) {
        video.className = 'filter-' + type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    async function init() {
        document.getElementById('start-screen').style.display = 'none';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.play();

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 0, minDetectionConfidence: 0.5 });
        pose.onResults(onResults);

        setInterval(() => { if(video.readyState === 4) pose.send({ image: video }); }, 80);
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    }

    function onResults(res) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (res.poseLandmarks) {
            if (!currentName) {
                const ent = ENTITIES[Math.floor(Math.random()*ENTITIES.length)];
                currentName = ent.n;
                addLog(ent);
                speak("Alerta. " + ent.n + " detectado.");
            }
            drawGhost(res.poseLandmarks);
            updateHUD(true);
        } else {
            currentName = "";
            tag.style.display = 'none';
            updateHUD(false);
        }
    }

    function drawGhost(lm) {
        ctx.strokeStyle = "rgba(0, 255, 65, 0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        lm.forEach((p, i) => {
            const x = p.x * canvas.width;
            const y = p.y * canvas.height;
            if (i === 0) {
                tag.style.display = 'block';
                tag.style.left = x + 'px';
                tag.style.top = (y - 20) + 'px';
                tag.innerText = "ID: " + currentName;
                ctx.moveTo(x, y);
            }
            ctx.lineTo(x + (Math.random()*6-3), y + (Math.random()*6-3));
            ctx.fillStyle = "white";
            ctx.fillRect(x-1, y-1, 3, 3);
        });
        ctx.stroke();
    }

    function addLog(e) {
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `<span class="log-name">${e.n}</span>: ${e.d}`;
        registry.prepend(item);
    }

    function updateHUD(det) {
        const emfValue = det ? (Math.random()*12).toFixed(2) : (Math.random()*0.3).toFixed(2);
        document.getElementById('emf').innerText = emfValue;
        document.getElementById('threat').innerText = emfValue > 9 ? "EXTREMA" : (det ? "ALTA" : "BAJA");
    }

    function speak(t) {
        const s = new SpeechSynthesisUtterance(t);
        s.lang = 'es-ES'; s.pitch = 0.5;
        window.speechSynthesis.speak(s);
    }
</script>
</body>
</html>
