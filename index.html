<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPECTRAL AI v10 - ANATOMY SCAN</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <style>
        :root { 
            --main: #00ff41; 
            --danger: #ff0000; 
            --ui-color: var(--main); 
            --fill-color: rgba(255, 0, 0, 0.2); /* Color de relleno de la malla */
            --outline-color: rgba(255, 255, 255, 0.8); /* Color del contorno */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: #000; color: var(--ui-color); overflow: hidden; width: 100vw; height: 100vh; transition: 0.3s; }

        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.5; }
        #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* HUD Superior */
        #hud-top { 
            position: absolute; top: 0; width: 100%; display: grid; grid-template-columns: 1fr 1fr;
            z-index: 20; padding: 50px 15px 15px; background: rgba(0,0,0,0.8);
            border-bottom: 1px solid var(--ui-color);
        }
        .val { font-size: 14px; font-weight: bold; display: block; }
        .label { font-size: 8px; text-transform: uppercase; opacity: 0.7; }

        /* Tag de Entidad Dinámico */
        .entity-tag { 
            position: absolute; color: #fff; padding: 5px 12px; border: 1px solid #fff;
            background: var(--danger); z-index: 40; font-size: 11px; font-weight: bold;
            pointer-events: none; box-shadow: 0 0 15px rgba(255,0,0,0.5);
            text-transform: uppercase;
        }
        .part-tag {
            position: absolute; color: white; background: rgba(0,0,0,0.5);
            font-size: 8px; padding: 2px 5px; border-left: 1px solid var(--ui-color);
            pointer-events: none; opacity: 0.8;
            transform: translate(-50%, -100%); /* Centrar la etiqueta sobre el punto */
        }

        /* Barra de progreso de análisis */
        #analysis-bar-container {
            position: absolute; bottom: 85px; left: 15px; width: calc(100% - 30px);
            height: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--ui-color);
            z-index: 45; overflow: hidden;
        }
        #analysis-bar {
            width: 0%; height: 100%; background: var(--ui-color); transition: width 0.1s linear;
        }

        .bottom-ui { 
            position: fixed; bottom: 0; width: 100%; height: 80px; background: #000;
            z-index: 50; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            border-top: 1px solid var(--ui-color);
        }
        .capture-btn { width: 60px; height: 60px; background: var(--danger); border: 4px solid #fff; border-radius: 50%; }

        #start-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1 style="color:var(--main); letter-spacing: 5px;">SPECTRAL AI v10</h1>
    <p style="font-size: 10px; margin-bottom: 20px;">ANATOMICAL / VOLUMETRIC SCANNER</p>
    <button onclick="init()" style="background:none; border:1px solid var(--main); color:var(--main); padding:15px 30px;">INICIAR SISTEMA</button>
</div>

<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud-top">
    <div style="text-align:center"><span class="label">EMF_LEVEL</span><span id="emf" class="val">0.00 μT</span></div>
    <div style="text-align:center"><span class="label">ANOMALÍA</span><span id="vol-type" class="val">BUSCANDO...</span></div>
</div>

<div id="entity-tag" class="entity-tag" style="display:none"></div>

<div id="analysis-bar-container"><div id="analysis-bar"></div></div>

<div class="bottom-ui">
    <div id="status-info" style="font-size: 8px;">OBJ_ID: NONE<br>STATUS: OFFLINE</div>
    <button class="capture-btn" onclick="takePhoto()"></button>
    <div style="text-align:right"><span id="clock" style="font-size: 14px; color:#fff">00:00:00</span></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tag = document.getElementById('entity-tag');
    const analysisBar = document.getElementById('analysis-bar');
    let audioCtx; // Removed analyser and dataArray as per request, can be re-added if EVP is desired.
    
    let activeEntity = null;
    let analysisProgress = 0; // Para la barra de progreso

    // Conexiones de MediaPipe Pose para un esqueleto más lógico
    const connections = [
        [0, 1], [0, 4], // Cabeza a hombros
        [1, 2], [2, 3], // Brazo izquierdo
        [4, 5], [5, 6], // Brazo derecho
        [0, 7], [0, 8], // Cuello a caderas (simulado)
        [7, 9], [9, 11], // Pierna izquierda
        [8, 10], [10, 12], // Pierna derecha
        // Puntos adicionales para torso
        [1, 7], [4, 8], [7,8] 
    ];

    // Puntos clave para etiquetar partes del cuerpo
    const bodyParts = {
        'CABEZA': 0,
        'HOMBRO (L)': 1,
        'HOMBRO (R)': 4,
        'TORSO': 7, // Usamos la cadera izquierda como referencia central del torso inferior
        'CADERA (L)': 7,
        'CADERA (R)': 8,
        'RODILLA (L)': 9,
        'RODILLA (R)': 10,
        'PIE (L)': 11,
        'PIE (R)': 12
    };

    function classifyEntity(height) {
        if (height > 0.7) return { cat: "COLOSO [CLASE-A]", name: "ENTIDAD MAYOR", fill: "rgba(255,0,0,0.3)" };
        if (height > 0.4) return { cat: "HUMANOIDE [CLASE-B]", name: "ESPECTRO ESTÁNDAR", fill: "rgba(255,0,0,0.2)" };
        return { cat: "RESIDUO [CLASE-C]", name: "MICRO-MANIFESTACIÓN", fill: "rgba(255,0,0,0.1)" };
    }

    async function init() {
        document.getElementById('start-screen').style.display = 'none';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
        video.srcObject = stream;
        video.play();
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)(); // Solo para sonido, no para EVP
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
        pose.onResults(onResults);

        const frame = async () => {
            if(video.readyState === 4) await pose.send({ image: video });
            requestAnimationFrame(frame);
        };
        frame();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        setInterval(() => updateHUD(activeEntity !== null), 500); // Actualiza EMF incluso sin detección
    }

    function onResults(res) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (res.poseLandmarks) {
            const height = Math.abs(res.poseLandmarks[32].y - res.poseLandmarks[0].y); // Asume punto 32 es el pie derecho, 0 es la cabeza

            if (!activeEntity) {
                const data = classifyEntity(height);
                activeEntity = { 
                    ...data, 
                    id: "OBJ-" + Math.floor(Math.random()*9999),
                    analysisComplete: false 
                };
                document.body.style.setProperty('--ui-color', 'var(--danger)');
                navigator.vibrate([100, 50, 100]);
                analysisProgress = 0; // Reiniciar progreso al detectar nueva entidad
            }
            
            drawMesh(res.poseLandmarks, activeEntity.fill);
            document.getElementById('vol-type').innerText = activeEntity.cat;
            document.getElementById('status-info').innerHTML = `OBJ_ID: ${activeEntity.id}<br>STATUS: ANALYZING`;
            
            // Lógica para la barra de progreso
            if (!activeEntity.analysisComplete) {
                analysisProgress += 2; // Aumentar progreso
                if (analysisProgress >= 100) {
                    analysisProgress = 100;
                    activeEntity.analysisComplete = true;
                    document.getElementById('status-info').innerHTML = `OBJ_ID: ${activeEntity.id}<br>STATUS: ANALYSIS COMPLETE`;
                }
                analysisBar.style.width = analysisProgress + '%';
            }

        } else {
            if (activeEntity) {
                activeEntity = null;
                document.body.style.setProperty('--ui-color', 'var(--main)');
                tag.style.display = 'none';
                document.getElementById('vol-type').innerText = "BUSCANDO...";
                document.getElementById('status-info').innerHTML = `OBJ_ID: NONE<br>STATUS: OFFLINE`;
                analysisProgress = 0;
                analysisBar.style.width = '0%';
            }
        }
    }

    function drawMesh(lm, fillColor) {
        const head = lm[0];
        tag.style.display = 'block';
        tag.style.left = (head.x * canvas.width) + 'px';
        tag.style.top = (head.y * canvas.height - 50) + 'px';
        tag.innerText = `${activeEntity.name} ${activeEntity.id}`;

        ctx.clearRect(0, 0, canvas.width, canvas.height); // Limpiar canvas antes de redibujar

        // DIBUJO DE RELLENO VOLUMÉTRICO
        ctx.beginPath();
        // Conectar los puntos para formar la silueta. Usaremos un subset para una forma más limpia.
        // Ejemplo de puntos a conectar para una forma humana:
        // Hombro izquierdo (1) -> Cabeza (0) -> Hombro derecho (4)
        // -> Cadera derecha (8) -> Pie derecho (12) -> Cadera izquierda (7) -> Pie izquierdo (11) -> (Cerrar)
        const pathPoints = [1, 0, 4, 8, 12, 11, 7];
        pathPoints.forEach((idx, i) => {
            if (lm[idx]) {
                const x = lm[idx].x * canvas.width;
                const y = lm[idx].y * canvas.height;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
        });
        ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill(); 
        
        // DIBUJO DE LÍNEAS DE ESQUELETO
        ctx.strokeStyle = "var(--outline-color)";
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "white"; // Simular glow

        connections.forEach(pair => {
            const p1 = lm[pair[0]];
            const p2 = lm[pair[1]];
            if (p1 && p2) {
                ctx.beginPath();
                ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
                ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
                ctx.stroke();
            }
        });

        // DIBUJAR PUNTOS Y ETIQUETAS DE PARTES DEL CUERPO
        for (const partName in bodyParts) {
            const index = bodyParts[partName];
            const p = lm[index];
            if (p) {
                const x = p.x * canvas.width;
                const y = p.y * canvas.height;
                
                // Dibujar el punto
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, 2 * Math.PI);
                ctx.fill();

                // Dibujar la etiqueta
                ctx.font = "8px 'Courier New', monospace";
                ctx.fillStyle = "white";
                ctx.fillText(partName, x + 5, y - 5);
            }
        }
        ctx.shadowBlur = 0; // Resetear sombra
    }

    function updateHUD(isDetecting) {
        // Actualiza el EMF basado en si hay detección o no
        const emf = isDetecting ? (50 + Math.random()*20).toFixed(2) : (Math.random()*1.0).toFixed(2);
        document.getElementById('emf').innerText = emf + " μT";
    }

    function takePhoto() {
        alert("ANÁLISIS ESPECTRAL CAPTURADO.");
    }
</script>
</body>
</html>
