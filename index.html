<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>MobileKinect Pro — Multi-Persona + Género</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1b;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    .ui {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
      padding: 0 20px;
    }
    .status {
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
      font-size: 16px;
    }
    .instructions {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #4cc9f0;
    }
    .person-count {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 18px;
      z-index: 20;
    }
    .controls {
      margin-bottom: 10px;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls button {
      background: rgba(255,255,255,0.06);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      min-width: 80px;
    }
    .controls button.active {
      box-shadow: 0 0 10px rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>

  <div class="container">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div class="instructions">Apunta tu cámara a varias personas. Aleja ~2–3 metros.</div>
    <div class="person-count" id="personCount">👥 0 personas</div>
    
    <div class="ui">
      <div class="controls">
        <button id="switchCamera">Cambiar cámara</button>
        <button class="filter-btn active" data-filter="none">Sin filtro</button>
        <button class="filter-btn" data-filter="red">Rojo</button>
        <button class="filter-btn" data-filter="green">Verde</button>
        <button class="filter-btn" data-filter="blue">Azul</button>
      </div>
      <div class="status" id="status">Iniciando IA...</div>
    </div>
  </div>

  <!-- Librerías corregidas (SIN ESPACIOS) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const personCountEl = document.getElementById('personCount');
    const switchBtn = document.getElementById('switchCamera');
    const filterButtons = Array.from(document.querySelectorAll('.filter-btn'));

    let currentFilter = 'none';
    let currentFacing = 'user';
    let detector = null;
    let isReady = false;

    // Colores para cada persona
    const COLORS = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#A09EFF', '#FF9AA2', '#B5EAD7'];

    async function setupCamera(facing = 'user') {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: false
      });
      if (video.srcObject) {
        const oldStream = video.srcObject;
        oldStream.getTracks().forEach(t => t.stop());
      }
      video.srcObject = stream;
      
      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });
    }

    // Estimar género basado en proporciones esqueléticas
    function estimateGender(landmarks) {
      try {
        const leftShoulder = landmarks[5];   // Índice 5 en MoveNet
        const rightShoulder = landmarks[6];
        const leftHip = landmarks[11];
        const rightHip = landmarks[12];

        if (!leftShoulder || !rightShoulder || !leftHip || !rightHip) return '❓';

        const shoulderWidth = Math.abs(rightShoulder.x - leftShoulder.x);
        const hipWidth = Math.abs(rightHip.x - leftHip.x);

        // En promedio, las mujeres tienen caderas más anchas que hombros
        // Los hombres tienen hombros más anchos que caderas
        if (shoulderWidth > hipWidth * 1.1) {
          return 'Hombre';
        } else if (hipWidth > shoulderWidth * 1.05) {
          return 'Mujer';
        } else {
          return '❓';
        }
      } catch (e) {
        return '❓';
      }
    }

    async function setupDetector() {
      statusEl.textContent = "Cargando modelo de IA...";
      detector = await poseDetection.create(poseDetection.SupportedModels.MoveNet, {
        modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
        maxPoses: 6
      });
      isReady = true;
      statusEl.textContent = "✅ ¡Listo! Buscando personas...";
    }

    async function detectLoop() {
      if (!isReady || video.readyState < 2) {
        requestAnimationFrame(detectLoop);
        return;
      }

      const poses = await detector.estimatePoses(video);

      // Ajustar canvas
      const displayWidth = video.videoWidth;
      const displayHeight = video.videoHeight;
      if (displayWidth > 0 && displayHeight > 0) {
        canvas.width = displayWidth;
        canvas.height = displayHeight;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const validPoses = poses.filter(pose => 
        pose.keypoints.some(kp => kp.score > 0.3)
      );

      // Actualizar conteo
      const numPeople = validPoses.length;
      personCountEl.textContent = `👥 ${numPeople} persona${numPeople !== 1 ? 's' : ''}`;

      // Dibujar cada persona
      validPoses.forEach((pose, index) => {
        const color = COLORS[index % COLORS.length];
        const gender = estimateGender(pose.keypoints);
        const label = `Persona ${index + 1} (${gender})`;

        // Dibujar esqueleto
        drawSkeleton(pose.keypoints, 0.3, ctx, color);
        
        // Dibujar puntos
        drawKeypoints(pose.keypoints, 0.3, ctx, color);
        
        // Etiqueta sobre la cabeza
        const nose = pose.keypoints[0];
        if (nose && nose.score > 0.3) {
          drawPersonLabel(label, nose.x * canvas.width, nose.y * canvas.height - 30, color);
        }
      });

      statusEl.textContent = numPeople > 0 
        ? `🟢 ${numPeople} persona${numPeople !== 1 ? 's' : ''} detectada${numPeople !== 1 ? 's' : ''}` 
        : "🔍 Esperando personas...";

      applyFilter();
      requestAnimationFrame(detectLoop);
    }

    function drawKeypoints(keypoints, minConfidence, ctx, color) {
      keypoints.forEach(kp => {
        if (kp.score > minConfidence) {
          const x = kp.x * canvas.width;
          const y = kp.y * canvas.height;
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = color;
          ctx.fill();
        }
      });
    }

    // Conexiones del cuerpo (MoveNet keypoints)
    const connections = [
      [0, 1], [0, 2], [1, 3], [2, 4], // cara
      [5, 6], [5, 11], [6, 12], [11, 12], // torso
      [5, 7], [7, 9], // brazo izq
      [6, 8], [8, 10], // brazo der
      [11, 13], [13, 15], // pierna izq
      [12, 14], [14, 16]  // pierna der
    ];

    function drawSkeleton(keypoints, minConfidence, ctx, color) {
      connections.forEach(([i, j]) => {
        const a = keypoints[i];
        const b = keypoints[j];
        if (a.score > minConfidence && b.score > minConfidence) {
          ctx.beginPath();
          ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
          ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
          ctx.lineWidth = 2;
          ctx.strokeStyle = color;
          ctx.stroke();
        }
      });
    }

    function drawPersonLabel(text, x, y, color) {
      ctx.font = 'bold 16px Segoe UI, sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      const padding = 6;
      const metrics = ctx.measureText(text);
      const w = metrics.width + padding * 2;
      const h = 24;
      ctx.fillRect(x - w/2, y - h + 4, w, h);
      ctx.fillStyle = color;
      ctx.fillText(text, x - metrics.width/2 + padding, y);
    }

    function applyFilter() {
      if (currentFilter === 'none') return;
      ctx.save();
      ctx.globalCompositeOperation = 'source-atop';
      let color = '#000000';
      if (currentFilter === 'red') color = '#ff0000';
      if (currentFilter === 'green') color = '#00ff00';
      if (currentFilter === 'blue') color = '#007bff';
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.16;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    async function switchCamera() {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      try {
        await setupCamera(currentFacing);
        statusEl.textContent = `✅ Cámara: ${currentFacing === 'user' ? 'Frontal' : 'Trasera'}`;
      } catch (e) {
        statusEl.textContent = '❌ Error cámara: ' + e.message;
        console.error(e);
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      filterButtons.forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
    }

    async function init() {
      try {
        await setupCamera(currentFacing);
        await setupDetector();
        
        switchBtn.addEventListener('click', switchCamera);
        filterButtons.forEach(btn => {
          btn.addEventListener('click', () => setFilter(btn.dataset.filter));
        });
        setFilter('none');
        
        detectLoop();
      } catch (e) {
        statusEl.textContent = "❌ Error: " + e.message;
        console.error(e);
      }
    }

    window.addEventListener('load', init);
  </script>

</body>
</html>
