<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>

<script>
/* ===============================
   ELEMENTOS DEL DOM
================================*/
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count-val');
const msgEl = document.getElementById('posture-msg');

/* ===============================
   VARIABLES DEL SISTEMA
================================*/
let poseDetector;
let isGhost = false;
let currentFacing = 'user';
let skeletonColor = "#00f2ff";
let particles = [];

let stage = "up";
let vFillHeight = 0;

/* ===============================
   NUEVO: SISTEMA DE RUTINAS
================================*/
let rutina = [];
let nivelActual = "principiante";
let indiceEjercicio = 0;
let repeticionesRestantes = 0;
let caloriasQuemadas = 0;

// Rutinas por nivel
const rutinas = {
  principiante: [
    { nombre: "Sentadillas", reps: 10, tipo: "reps", guia: "Baja como si fueras a sentarte, sube lento." },
    { nombre: "Giro de tronco", reps: 20, tipo: "reps", guia: "Gira el torso suavemente izquierda-derecha." }
  ],
  intermedio: [
    { nombre: "Sentadillas", reps: 15, tipo: "reps", guia: "Controla la bajada y mantén la espalda recta." },
    { nombre: "Zancadas", reps: 12, tipo: "reps", guia: "Un paso adelante, baja recto, alterna piernas." },
    { nombre: "Rodillas arriba", reps: 30, tipo: "tiempo", guia: "Eleva rodillas en ritmo constante." }
  ],
  avanzado: [
    { nombre: "Sentadillas", reps: 20, tipo: "reps", guia: "Mayor profundidad sin perder postura." },
    { nombre: "Zancadas", reps: 20, tipo: "reps", guia: "Gran paso, baja lento, alterna." },
    { nombre: "Rodillas arriba", reps: 40, tipo: "tiempo", guia: "Ritmo alto pero seguro." }
  ]
};

// Inicializa rutina
function iniciarRutina(nivel = "principiante") {
  nivelActual = nivel;
  rutina = rutinas[nivelActual];
  indiceEjercicio = 0;
  caloriasQuemadas = 0;
  prepararEjercicio();
}

function prepararEjercicio() {
  const ejercicio = rutina[indiceEjercicio];
  repeticionesRestantes = ejercicio.reps;

  statusEl.innerText = `Ejercicio: ${ejercicio.nombre} — Faltan: ${repeticionesRestantes}`;
  msgEl.innerText = ejercicio.guia;
  countEl.innerText = repeticionesRestantes;
}

function completarRepeticion() {
  repeticionesRestantes--;
  caloriasQuemadas += 0.4;

  countEl.innerText = repeticionesRestantes;

  if (repeticionesRestantes <= 0) {
    siguienteEjercicio();
  }
}

function siguienteEjercicio() {
  indiceEjercicio++;
  if (indiceEjercicio >= rutina.length) {
    finalizarRutina();
  } else {
    prepararEjercicio();
  }
}

function finalizarRutina() {
  statusEl.innerText = `Rutina completada — Calorías estimadas: ${caloriasQuemadas.toFixed(1)}`;
  msgEl.innerText = "¡Buen trabajo! Puedes iniciar otra rutina.";
}

/* ===============================
   CONFIGURACIÓN DE MEDIAPIPE
================================*/
const CONNECTIONS = [
  [0,1], [1,2], [2,3], [0,4], [4,5], [5,6], 
  [11,12], [11,13], [13,15], [12,14], [14,16], 
  [11,23], [12,24], [23,24], 
  [23,25], [25,27], [24,26], [26,28]
];

function calculateAngle(a, b, c) {
  const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
  let angle = Math.abs(radians * 180.0 / Math.PI);
  if (angle > 180.0) angle = 360 - angle;
  return Math.round(angle);
}

async function init() {
  poseDetector = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  poseDetector.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5
  });

  poseDetector.onResults(onResults);
  await setupCamera();

  const frameLoop = async () => {
    if (video.readyState >= 2) await poseDetector.send({ image: video });
    requestAnimationFrame(frameLoop);
  };
  frameLoop();

  iniciarRutina("principiante"); // Nivel por defecto
}

/* ===============================
   CÁMARA
================================*/
async function setupCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacing, width: 640, height: 480 }
  });

  video.srcObject = stream;
  video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';

  return new Promise(res => {
    video.onloadedmetadata = () => {
      video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      res();
    };
  });
}

/* ===============================
   SISTEMA DE PARTÍCULAS
================================*/
function handleParticles() {
  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    ctx.fillStyle = `rgba(${p.rgb}, ${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.y -= 1.5; 
    p.alpha -= 0.03;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

/* ===============================
   DETECCIÓN DE MOVIMIENTOS
================================*/
function onResults(results) {
  ctx.save();

  if (isGhost) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  if (currentFacing === 'user') {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }

  if (!results.poseLandmarks) {
    msgEl.innerText = "Mantente dentro de la cámara";
    return ctx.restore();
  }

  const landmarks = results.poseLandmarks;

  /* ===============================
     DETECCIÓN DE SENTADILLAS
  =================================*/
  const ejercicioActual = rutina[indiceEjercicio];

  if (ejercicioActual.nombre === "Sentadillas") {
    const hip = landmarks[24];
    const knee = landmarks[26];

    if (hip.visibility > 0.5 && knee.visibility > 0.5) {
      if (hip.y > knee.y - 0.05) stage = "down";

      if (hip.y < knee.y - 0.15 && stage === "down") {
        stage = "up";
        completarRepeticion();
      }
    }
  }

  /* ===============================
     PARTÍCULAS DE MANOS
  =================================*/
  [landmarks[15], landmarks[16]].forEach(hand => {
    if (hand.visibility > 0.7) {
      particles.push({
        x: hand.x * canvas.width,
        y: hand.y * canvas.height,
        size: Math.random() * 4 + 1,
        alpha: 1,
        rgb: skeletonColor === "#00f2ff" ? "0, 242, 255" : "255, 255, 255"
      });
    }
  });

  drawSkeleton(landmarks);
  handleParticles();
  ctx.restore();
}

/* ===============================
   DIBUJO DEL ESQUELETO
================================*/
function drawSkeleton(landmarks) {
  ctx.strokeStyle = skeletonColor;
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.shadowBlur = 12;
  ctx.shadowColor = skeletonColor;

  CONNECTIONS.forEach(([a, b]) => {
    const p1 = landmarks[a];
    const p2 = landmarks[b];
    if (p1.visibility > 0.5 && p2.visibility > 0.5) {
      ctx.beginPath();
      ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
      ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
      ctx.stroke();
    }
  });
}

/* ===============================
   BOTONES
================================*/
document.getElementById('btn-camera').onclick = async () => {
  currentFacing = (currentFacing === 'user') ? 'environment' : 'user';
  await setupCamera();
};

document.getElementById('btn-ghost').onclick = () => isGhost = !isGhost;

document.getElementById('btn-color').onclick = () => {
  const colors = ["#00f2ff", "#ff00ff", "#00ff00", "#ffff00", "#ffffff"];
  skeletonColor = colors[Math.floor(Math.random() * colors.length)];
};

document.getElementById('btn-snap').onclick = () => {
  const link = document.createElement('a');
  link.download = 'kinect-bio.png';
  link.href = canvas.toDataURL();
  link.click();
};

/* ===============================
   INICIO PRINCIPAL
================================*/
init();
</script>
