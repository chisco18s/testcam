<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Spectral AI - Registry Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <style>
    :root { --main: #00ff41; --danger: #ff3c3c; --ghost: #00f2ff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
    body { background: #000; color: var(--main); overflow: hidden; }

    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) contrast(1.5) grayscale(1); opacity: 0.35; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; }

    /* HUD Superior */
    #hud-top { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-around; z-index: 20; padding: 15px; background: rgba(0,20,0,0.6); border-bottom: 1px solid var(--main); }
    .data-box { text-align: center; }
    .value { font-size: 1.2rem; font-weight: bold; color: white; text-shadow: 0 0 5px var(--main); }

    /* Registro de Actividad (Historial de Nombres) */
    #registry-console { 
        position: absolute; bottom: 120px; left: 20px; width: 280px; height: 120px; 
        background: rgba(0, 30, 0, 0.4); border-left: 2px solid var(--ghost);
        padding: 10px; overflow-y: hidden; font-size: 12px; z-index: 25;
        display: flex; flex-direction: column-reverse;
    }
    .log-entry { margin-bottom: 4px; color: var(--ghost); animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

    /* Otros Elementos */
    #proximity-bar { position: absolute; right: 15px; top: 25%; width: 12px; height: 50%; border: 1px solid #333; z-index: 20; border-radius: 5px; overflow: hidden;}
    #proximity-fill { width: 100%; height: 0%; background: linear-gradient(to top, var(--main), var(--danger)); transition: height 0.2s; }
    
    .entity-tag { position: absolute; color: white; font-weight: bold; padding: 4px 10px; border: 2px solid var(--danger); background: rgba(255,0,0,0.2); z-index: 40; pointer-events: none; backdrop-filter: blur(2px); }
    
    .bottom-bar { position: fixed; bottom: 0; width: 100%; padding: 20px; background: rgba(0,0,0,0.8); display: flex; justify-content: space-between; align-items: center; z-index: 30; }
    #radar { width: 60px; height: 60px; border: 1px solid var(--main); border-radius: 50%; position: relative; }
    #sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, rgba(0,255,65,0.4) 0deg, transparent 90deg); animation: rotate 2s linear infinite; border-radius: 50%; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="hud-top">
    <div class="data-box"><div>EMF</div><div class="value" id="val-emf">0.00</div></div>
    <div class="data-box"><div>ENTIDADES</div><div class="value" id="val-entities">0</div></div>
    <div class="data-box"><div>REC</div><div class="value" style="color:red">● LIVE</div></div>
  </div>

  <div id="proximity-bar"><div id="proximity-fill"></div></div>
  
  <div id="registry-console"></div>
  
  <div id="entity-label" class="entity-tag" style="display:none">ANALIZANDO...</div>

  <div class="bottom-bar">
    <div id="radar"><div id="sweep"></div></div>
    <div style="text-align: right; color: var(--main); font-size: 12px;">
        SISTEMA DE REGISTRO ESPECTRAL<br>
        <span id="timer" style="font-size: 18px; color: white;">00:00:00</span>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const registry = document.getElementById('registry-console');
    const entityLabel = document.getElementById('entity-label');
    const proxFill = document.getElementById('proximity-fill');

    const ENTITY_NAMES = ["Sombra tipo IV", "Remanente Psíquico", "Poltergeist", "Ente Clase A", "Vigía Espectral", "Infante de Bruma", "Aparición"];
    let lastEntityTime = 0;
    let currentEntityName = "";

    function addLog(name) {
        const time = new Date().toLocaleTimeString().split(' ')[0];
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span style="color:var(--main)">[${time}]</span> ${name.toUpperCase()} DETECTADO`;
        registry.prepend(entry);
        if (registry.children.length > 6) registry.lastChild.remove();
    }

    async function init() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.play();
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.6 });
        pose.onResults(onResults);

        const frame = async () => {
            await pose.send({ image: video });
            document.getElementById('timer').innerText = new Date().toLocaleTimeString();
            requestAnimationFrame(frame);
        };
        frame();
    }

    function onResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (results.poseLandmarks) {
            processDetection(results.poseLandmarks);
        } else {
            document.getElementById('val-entities').innerText = "0";
            document.getElementById('val-emf').innerText = (Math.random()*0.2).toFixed(2);
            entityLabel.style.display = 'none';
            proxFill.style.height = "5%";
            currentEntityName = "";
        }
    }

    function processDetection(lm) {
        document.getElementById('val-entities').innerText = "1";
        const emf = (2 + Math.random() * 8).toFixed(2);
        document.getElementById('val-emf').innerText = emf;
        proxFill.style.height = (emf * 10) + "%";

        // Elegir nombre nuevo si es una detección nueva
        if (!currentEntityName) {
            currentEntityName = ENTITY_NAMES[Math.floor(Math.random() * ENTITY_NAMES.length)];
            addLog(currentEntityName);
            speak(`Alerta. ${currentEntityName} identificado.`);
        }

        // Dibujar figura
        drawGhostEffect(lm);

        // Posicionar etiqueta
        const head = lm[0];
        entityLabel.style.display = 'block';
        entityLabel.style.left = (head.x * canvas.width - 50) + 'px';
        entityLabel.style.top = (head.y * canvas.height - 60) + 'px';
        entityLabel.innerText = currentEntityName;
    }

    function drawGhostEffect(lm) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(0, 255, 65, 0.4)";
        
        // Dibujar cuerpo inestable
        ctx.beginPath();
        lm.forEach((p, i) => {
            const x = p.x * canvas.width + (Math.random() * 6 - 3);
            const y = p.y * canvas.height + (Math.random() * 6 - 3);
            
            if (i === 0) ctx.moveTo(x, y);
            
            // Puntos de energía
            ctx.fillStyle = i < 11 ? "rgba(255, 0, 0, 0.5)" : "rgba(0, 242, 255, 0.5)";
            ctx.fillRect(x-2, y-2, 4, 4);
            
            if (i % 3 === 0) ctx.lineTo(x, y);
        });
        ctx.stroke();
    }

    function speak(txt) {
        const s = new SpeechSynthesisUtterance(txt);
        s.lang = 'es-ES';
        s.pitch = 0.4;
        s.rate = 0.85;
        window.speechSynthesis.speak(s);
    }

    init();
  </script>
</body>
</html>
