<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector OCR Pro</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        :root { --primary: #6200ee; --highlight: #ffff00; }
        body { font-family: sans-serif; margin: 0; background: #f5f5f5; padding-bottom: 120px; }
        
        /* Contenedor de video y resultados */
        #camera-container { width: 100%; height: 300px; background: #000; position: relative; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #text-container { padding: 20px; line-height: 1.6; font-size: 1.1em; background: white; min-height: 200px; }
        
        .word { display: inline-block; margin-right: 4px; border-radius: 3px; }
        .active { background-color: var(--highlight); }

        /* Menú y Controles */
        .bottom-menu { position: fixed; bottom: 0; left: 0; right: 0; background: #222; display: flex; justify-content: space-around; padding: 15px; z-index: 100; }
        button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        #loading { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; }
        
        canvas { display: none; }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <div id="loading">Analizando texto...</div>
    </div>

    <div id="text-container">
        Apunta con la cámara y presiona "📸 Capturar" para extraer el texto.
    </div>

    <canvas id="canvas"></canvas>

    <div class="bottom-menu">
        <button onclick="captureImage()">📸 Capturar</button>
        <button onclick="speak()">▶️ Leer</button>
        <button onclick="translateText()">🌍 Traducir</button>
        <button onclick="stop()">⏹️</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading');
        const container = document.getElementById('text-container');
        let synth = window.speechSynthesis;

        // Iniciar Cámara
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } // Usa la cámara trasera
                });
                video.srcObject = stream;
            } catch (err) {
                alert("No se pudo acceder a la cámara: " + err);
            }
        }

        // Capturar foto y extraer texto (OCR)
        async function captureImage() {
            loading.style.display = 'block';
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Tesseract procesa la imagen
            Tesseract.recognize(
                canvas.toDataURL('image/png'),
                'eng', // Idioma a buscar en la imagen
                { logger: m => console.log(m) }
            ).then(({ data: { text } }) => {
                loading.style.display = 'none';
                renderText(text);
            });
        }

        function renderText(text) {
            container.innerHTML = text.split(/\s+/).map(word => `<span class="word">${word}</span>`).join(' ');
        }

        function speak() {
            if (synth.speaking) return;
            const utterance = new SpeechSynthesisUtterance(container.innerText);
            // Si el texto es inglés, usa 'en-US', si es español tras traducir, usa 'es-ES'
            utterance.lang = container.innerText.includes(" ") ? 'en-US' : 'es-ES'; 

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const words = container.innerText.substring(0, event.charIndex).trim().split(/\s+/);
                    highlightWord(words.length - 1);
                }
            };
            synth.speak(utterance);
        }

        function highlightWord(index) {
            const spans = document.querySelectorAll('.word');
            spans.forEach(s => s.classList.remove('active'));
            if (spans[index]) spans[index].classList.add('active');
        }

        async function translateText() {
            const text = container.innerText;
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=es&dt=t&q=${encodeURI(text)}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const translated = data[0].map(item => item[0]).join('');
                renderText(translated);
            } catch (e) { alert("Error al traducir"); }
        }

        function stop() { synth.cancel(); }

        startCamera();
    </script>
</body>
</html>
