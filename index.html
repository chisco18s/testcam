<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Kinect 3D Avatar Core</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #video { position: absolute; top: 0; left: 0; width: 160px; height: 120px; z-index: 10; opacity: 0.5; border: 2px solid #00f2ff; }
    #3d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #00f2ff; font-family: sans-serif; font-size: 20px; }
  </style>
</head>
<body>

  <div id="loading">CARGANDO MOTOR 3D E IA...</div>
  <video id="video" playsinline muted autoplay></video>
  <div id="3d-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const videoElement = document.getElementById('video');
    const loadingEl = document.getElementById('loading');
    
    // --- VARIABLES THREE.JS (MOTOR 3D) ---
    let renderer, scene, camera;
    let avatarJoints = []; // Array para guardar nuestras esferas 3D
    // Índices de los puntos clave que queremos visualizar en 3D
    const LANDMARK_INDICES = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]; 

    // 1. INICIALIZAR THREE.JS (El mundo 3D)
    function initThreeJS() {
        const container = document.getElementById('3d-container');
        
        // Escena y Fondo
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510); // Azul oscuro casi negro
        // Niebla para dar sensación de profundidad
        scene.fog = new THREE.Fog(0x050510, 2, 10);

        // Cámara (Perspectiva)
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3); // Mover la cámara un poco atrás y arriba

        // Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00f2ff, 1);
        dirLight.position.set(2, 5, 5);
        scene.add(dirLight);

        // Renderizador
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Suelo (Grid) para referencia visual
        const gridHelper = new THREE.GridHelper(10, 20, 0x00f2ff, 0x303030);
        scene.add(gridHelper);

        // CREAR EL AVATAR (Conjunto de esferas)
        const jointGeometry = new THREE.SphereGeometry(0.05, 32, 32); // Esferas de 5cm
        const jointMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x00f2ff, 
            emissive: 0x00f2ff, // Que brillen con luz propia
            emissiveIntensity: 0.5,
            roughness: 0.3,
            metalness: 0.8
        });

        // Creamos una esfera por cada punto clave y la guardamos
        for (let i = 0; i < 33; i++) { // MediaPipe tiene 33 puntos
            if (LANDMARK_INDICES.includes(i)) {
                const joint = new THREE.Mesh(jointGeometry, jointMaterial);
                joint.castShadow = true;
                scene.add(joint);
                avatarJoints[i] = joint; // Guardar referencia
            } else {
                avatarJoints[i] = null; // Puntos que no usamos
            }
        }

        animateThreeJS();
    }

    // Bucle de renderizado 3D
    function animateThreeJS() {
        requestAnimationFrame(animateThreeJS);
        renderer.render(scene, camera);
    }

    // 2. INICIALIZAR MEDIAPIPE (La IA)
    async function initMediaPipe() {
        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        pose.onResults(onPoseResults);

        // Configurar cámara
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        videoElement.srcObject = stream;
        await new Promise(resolve => videoElement.onloadedmetadata = resolve);
        videoElement.play();
        loadingEl.style.display = 'none';

        // Bucle de detección
        const poseLoop = async () => {
            await pose.send({image: videoElement});
            requestAnimationFrame(poseLoop);
        };
        poseLoop();
    }

    // 3. CONECTAR IA CON 3D (El puente)
    function onPoseResults(results) {
        // IMPORTANTE: Usamos poseWorldLandmarks para 3D real, no poseLandmarks (2D)
        if (!results.poseWorldLandmarks) return;

        const landmarks = results.poseWorldLandmarks;

        // Recorremos nuestros puntos 3D y movemos las esferas correspondientes
        avatarJoints.forEach((jointMesh, index) => {
            if (jointMesh && landmarks[index]) {
                // MediaPipe World Coordinates:
                // X: Izquierda/Derecha (negativo/positivo)
                // Y: Arriba/Abajo (negativo es arriba, positivo es abajo) -> Invertimos
                // Z: Profundidad (negativo es lejos, positivo es cerca)
                const lm = landmarks[index];
                
                // Factor de escala para que coincida con nuestra escena 3D
                // Invertimos Y y X para que coincida con el movimiento espejo natural
                jointMesh.position.set(-lm.x, -lm.y + 1, -lm.z - 2); 
            }
        });
    }

    // Manejar redimensionado de ventana
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Iniciar todo
    initThreeJS();
    initMediaPipe();

  </script>
</body>
</html>
