<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Kinect Pro: Robo-Suit Avatar</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    /* Monitor pequeño ocultable */
    #video-monitor { 
        position: absolute; bottom: 20px; left: 20px; width: 120px; height: 90px; 
        z-index: 10; opacity: 0.5; border: 1px solid #00f2ff; border-radius: 5px; transform: scaleX(-1);
        transition: opacity 0.3s;
    }
    #video-monitor:hover { opacity: 1; }
    #3d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: radial-gradient(circle at center, #0a0a14 0%, #000000 100%); }
    #loading-overlay {
        position: absolute; inset: 0; background: #000; z-index: 100; display: flex;
        align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.5s;
    }
    .spinner { width: 60px; height: 60px; border: 4px solid rgba(0,242,255,0.2); border-top-color: #00f2ff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p style="color:#00f2ff; font-family:sans-serif; margin-top:15px;">CALIBRANDO TRAJE VIRTUAL...</p>
  </div>

  <video id="video-monitor" playsinline muted autoplay></video>
  <div id="3d-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- CONFIGURACIÓN DEL ESQUELETO ---
    // Definimos las conexiones y el TIPO de hueso para darle grosor variable
    // Formato: [inicio, fin, tipo, grosorScale]
    const SKELETON_CONFIG = [
        // Torso (Ancho y plano)
        [11, 12, 'torso', 1], [12, 24, 'torso', 0.8], [11, 23, 'torso', 0.8], [23, 24, 'hip', 1],
        // Brazos (Cónicos)
        [12, 14, 'limbU', 1], [14, 16, 'limbL', 0.8], // Derecho
        [11, 13, 'limbU', 1], [13, 15, 'limbL', 0.8], // Izquierdo
        // Piernas (Cónicas y más gruesas)
        [24, 26, 'limbU', 1.3], [26, 28, 'limbL', 1.1], // Derecha
        [23, 25, 'limbU', 1.3], [25, 27, 'limbL', 1.1]  // Izquierda
    ];
    
    // Puntos clave especiales para geometrías únicas
    const HEAD_ID = 0;
    const HANDS_IDS = [15, 16];
    const FEET_IDS = [27, 28];
    const JOINTS_IDS = [11, 12, 13, 14, 23, 24, 25, 26];

    // --- VARIABLES GLOBALES ---
    let renderer, scene, camera, clock;
    let landmarksMap = {}; // Mapa para acceso rápido a las mallas
    let boneMeshes = [];
    let poseDetector;
    const videoMonitor = document.getElementById('video-monitor');
    const loadingOverlay = document.getElementById('loading-overlay');

    // =========================================
    // MOTOR GRÁFICO PRO (THREE.JS)
    // =========================================
    function initThreeJS() {
        clock = new THREE.Clock();
        const container = document.getElementById('3d-container');
        
        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 3, 12);

        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 4); // Cámara a la altura de los ojos

        // ILUMINACIÓN DRAMÁTICA
        const ambient = new THREE.AmbientLight(0x111122, 1);
        scene.add(ambient);

        // Luz principal (Key Light)
        const keyLight = new THREE.DirectionalLight(0xffffff, 1);
        keyLight.position.set(1.5, 3, 2);
        keyLight.castShadow = true;
        scene.add(keyLight);

        // Luz de contorno (Rim Light) - Dá el look "profesional"
        const rimLight = new THREE.SpotLight(0x00f2ff, 4, 10, Math.PI/3, 0.5);
        rimLight.position.set(0, 3, -3); // Desde atrás
        rimLight.lookAt(0, 1, 0);
        scene.add(rimLight);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Mejor rango dinámico de color
        container.appendChild(renderer.domElement);

        // Suelo Espejo
        const grid = new THREE.GridHelper(20, 20, 0x0044ff, 0x111111);
        grid.position.y = -0.01;
        scene.add(grid);
        const planeGeo = new THREE.PlaneGeometry(100, 100);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.05, metalness: 0.9 });
        const floor = new THREE.Mesh(planeGeo, planeMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        createRoboSuit();
        animate();
    }

    function createRoboSuit() {
        // --- MATERIALES AVANZADOS ---
        // Armadura oscura (Carbon fiber look)
        const armorMat = new THREE.MeshStandardMaterial({
            color: 0x222222, roughness: 0.3, metalness: 0.8,
        });
        // Núcleo de energía (Joints glowing)
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x00f2ff, emissive: 0x00f2ff, emissiveIntensity: 1.5,
            roughness: 0.1, metalness: 0.0
        });

        // --- GEOMETRÍAS BASE ---
        // Pivote en la base (Y=0) para que crezcan correctamente
        const baseCylinder = new THREE.CylinderGeometry(1, 1, 1, 16);
        baseCylinder.translate(0, 0.5, 0);
        // Torso aplanado (Caja)
        const baseBox = new THREE.BoxGeometry(1, 1, 1);
        baseBox.translate(0, 0.5, 0);

        // 1. Crear Articulaciones Específicas
        // Cabeza (Cubo Tech)
        const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.18), armorMat.clone());
        // Visor brillante
        const visor = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.08), coreMat);
        visor.position.set(0, 0.02, 0.091);
        headMesh.add(visor);
        addToLandmarkMap(HEAD_ID, headMesh);

        // Manos/Pies (Esferas achatadas)
        const extremityGeo = new THREE.SphereGeometry(0.06, 16, 16);
        extremityGeo.scale(1, 0.6, 1.2); // Achatadas como guantes/botas
        [...HANDS_IDS, ...FEET_IDS].forEach(id => {
            const mesh = new THREE.Mesh(extremityGeo, armorMat);
            addToLandmarkMap(id, mesh);
        });

        // Articulaciones Intermedias (Codos, rodillas... Esferas de energía)
        const jointGeo = new THREE.SphereGeometry(0.05, 24, 24);
        JOINTS_IDS.forEach(id => {
            const mesh = new THREE.Mesh(jointGeo, coreMat);
            addToLandmarkMap(id, mesh);
        });

        // 2. Crear Huesos Estructurales
        SKELETON_CONFIG.forEach(([start, end, type, thickness]) => {
            let geo, mat, scaleX, scaleZ;

            // Definir forma según el tipo de hueso
            if (type === 'torso' || type === 'hip') {
                geo = baseBox; mat = armorMat;
                scaleX = 0.15 * thickness; // Ancho
                scaleZ = 0.06; // Plano
            } else {
                // Extremidades (cilindros cónicos)
                const radiusTop = type === 'limbU' ? 0.06 : 0.05;
                const radiusBottom = type === 'limbU' ? 0.05 : 0.04;
                geo = new THREE.CylinderGeometry(radiusTop, radiusBottom, 1, 16);
                geo.translate(0, 0.5, 0);
                mat = armorMat;
                scaleX = scaleZ = thickness;
            }

            const bone = new THREE.Mesh(geo, mat);
            bone.castShadow = true;
            scene.add(bone);
            // Guardamos datos para la actualización
            boneMeshes.push({ mesh: bone, s: start, e: end, sx: scaleX, sz: scaleZ, type: type });
        });
    }

    function addToLandmarkMap(id, mesh) {
        mesh.castShadow = true;
        scene.add(mesh);
        landmarksMap[id] = mesh;
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    // =========================================
    // INTELIGENCIA ARTIFICIAL Y MATEMÁTICAS
    // =========================================
    async function initAI() {
        poseDetector = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        // Modelo más complejo (2) para máxima precisión en gestos
        poseDetector.setOptions({ modelComplexity: 2, smoothLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        poseDetector.onResults(updateAvatar);

        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
        videoMonitor.srcObject = stream;
        await new Promise(r => videoMonitor.onloadedmetadata = r);
        videoMonitor.play();

        loadingOverlay.style.opacity = 0;
        setTimeout(() => loadingOverlay.style.display = 'none', 600);
        startLoop();
    }

    const startLoop = async () => {
        if(videoMonitor.readyState >= 2) await poseDetector.send({image: videoMonitor});
        requestAnimationFrame(startLoop);
    };

    // Vectores reutilizables (Optimización de memoria)
    const vStart = new THREE.Vector3(), vEnd = new THREE.Vector3(), vDir = new THREE.Vector3(), upAxis = new THREE.Vector3(0, 1, 0);
    const lookTarget = new THREE.Vector3();

    function updateAvatar(results) {
        if (!results.poseWorldLandmarks) return;
        const lm = results.poseWorldLandmarks;

        // 1. Actualizar Articulaciones (Puntos clave)
        Object.keys(landmarksMap).forEach(id => {
            if(lm[id] && lm[id].visibility > 0.5) {
                landmarksMap[id].visible = true;
                // Mapeo: Invertir X (espejo), Invertir Y (MP abajo+), Z (profundidad)
                landmarksMap[id].position.set(-lm[id].x, -lm[id].y + 1.0, -lm[id].z);
            } else {
                landmarksMap[id].visible = false;
            }
        });

        // Rotar cabeza para mirar al frente
        if(landmarksMap[HEAD_ID] && lm[11] && lm[12]) {
            // Calcular punto medio de hombros para orientar la cabeza
            lookTarget.set((-lm[11].x - lm[12].x)/2, (-lm[11].y - lm[12].y)/2 + 1.0, -1);
            landmarksMap[HEAD_ID].lookAt(lookTarget);
        }

        // 2. Actualizar Estructura (Huesos)
        boneMeshes.forEach(b => {
            const pStart = lm[b.s], pEnd = lm[b.e];
            if(pStart && pEnd && pStart.visibility > 0.5 && pEnd.visibility > 0.5) {
                b.mesh.visible = true;
                // Posiciones 3D ajustadas
                vStart.set(-pStart.x, -pStart.y + 1.0, -pStart.z);
                vEnd.set(-pEnd.x, -pEnd.y + 1.0, -pEnd.z);

                // A. Posicionar base
                b.mesh.position.copy(vStart);
                // B. Escalar longitud (Y) y grosor (X, Z)
                const len = vStart.distanceTo(vEnd);
                // Si es el torso, no escalamos la longitud completa para dejar hueco a cadera/hombros
                const lenScale = (b.type === 'torso' || b.type === 'hip') ? len * 0.9 : len;
                b.mesh.scale.set(b.sx, lenScale, b.sz);
                // C. Rotar con Cuaterniones (La clave de la precisión)
                vDir.subVectors(vEnd, vStart).normalize();
                b.mesh.quaternion.setFromUnitVectors(upAxis, vDir);
            } else {
                b.mesh.visible = false;
            }
        });
    }

    // Manejo de resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    initThreeJS();
    initAI();
  </script>
</body>
</html>
