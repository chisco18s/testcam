<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>AI Coach Ultra - Stability Pro</title>
  <style>
    :root { --neon: #00f2ff; --accent: #7000ff; --danger: #ff4444; --zen: #00ff88; --warning: #ffcc00; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
    
    /* ESPEJO PERFECTO */
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); filter: brightness(0.5); z-index: 1; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

    /* HUD SUPERIOR */
    #hud-top {
      position: absolute; top: 20px; width: 100%; padding: 0 20px;
      display: none; justify-content: space-between; align-items: center; z-index: 100;
    }
    .timer-box { background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 50px; border: 2px solid var(--neon); font-size: 24px; font-weight: bold; }
    .progress-bar { position: absolute; top: 0; left: 0; height: 5px; background: var(--neon); width: 0%; transition: 1s linear; }

    /* COACH FEEDBACK */
    #coach-overlay {
      position: absolute; bottom: 120px; width: 100%; text-align: center; z-index: 100;
      pointer-events: none; transition: 0.3s;
    }
    .msg-tag { background: var(--accent); color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; display: inline-block; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

    /* MENU Y SUMARIO */
    #overlay-screen {
      position: absolute; inset: 0; background: rgba(0,0,0,0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
    }
    .card { background: #111; border: 1px solid #333; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 400px; cursor: pointer; transition: 0.3s; }
    .card:hover { border-color: var(--neon); transform: translateY(-5px); }
    
    .hidden { display: none !important; }
    #stats-summary { text-align: center; line-height: 2; }
  </style>
</head>
<body>

  <div id="video-container">
    <div class="progress-bar" id="session-bar"></div>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="hud-top">
    <div class="timer-box" id="clock">00:30</div>
    <div style="text-align: right;">
        <small style="display:block; color:var(--neon)">REPS</small>
        <span id="rep-count" style="font-size:32px; font-weight:900;">0</span>
    </div>
  </div>

  <div id="coach-overlay" class="hidden">
    <div class="msg-tag" id="coach-msg">¡PREPÁRATE!</div>
  </div>

  <div id="overlay-screen">
    <div id="menu-content">
        <h1 style="margin-bottom:20px; color:var(--neon)">AI TRAINER PRO</h1>
        <div class="card" onclick="launchApp('fitness')">
            <h2>🔥 ENTRENAMIENTO HIIT</h2>
            <p>Sentadillas (30 seg)</p>
        </div>
    </div>
    <div id="summary-content" class="hidden">
        <h1 style="color:var(--zen)">¡SESIÓN COMPLETADA!</h1>
        <div id="stats-summary"></div>
        <button class="card" style="margin-top:20px" onclick="location.reload()">REPETIR</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>

  <script>
    const state = {
        isRunning: false,
        reps: 0,
        timer: 30,
        stage: 'up',
        lastSpeakTime: 0,
        qualityLog: [],
        smoothKnee: 0
    };

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // --- MOTOR DE VOZ (ANTI-SPAM) ---
    function speak(text) {
        const now = Date.now();
        if (now - state.lastSpeakTime < 3500) return; // Esperar 3.5s entre frases
        
        state.lastSpeakTime = now;
        document.getElementById('coach-msg').innerText = text.toUpperCase();
        document.getElementById('coach-overlay').classList.remove('hidden');

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.rate = 1.1;
        window.speechSynthesis.speak(utterance);
        
        setTimeout(() => { document.getElementById('coach-overlay').classList.add('hidden'); }, 3000);
    }

    // --- INICIALIZACIÓN ---
    async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        return new Promise(r => video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            r();
        });
    }

    async function launchApp(mode) {
        document.getElementById('overlay-screen').classList.add('hidden');
        document.getElementById('hud-top').style.display = 'flex';
        speak("Prepárate. Empezamos en breve. Aléjate un poco.");
        
        // Timer de 30 segundos
        const countdown = setInterval(() => {
            state.timer--;
            document.getElementById('clock').innerText = `00:${state.timer < 10 ? '0'+state.timer : state.timer}`;
            document.getElementById('session-bar').style.width = `${((30 - state.timer)/30)*100}%`;
            
            if (state.timer <= 0) {
                clearInterval(countdown);
                finishSession();
            }
        }, 1000);

        state.isRunning = true;
    }

    function finishSession() {
        state.isRunning = false;
        window.speechSynthesis.cancel();
        speak("Entrenamiento terminado. Excelente trabajo.");
        
        document.getElementById('hud-top').style.display = 'none';
        document.getElementById('overlay-screen').classList.remove('hidden');
        document.getElementById('menu-content').classList.add('hidden');
        document.getElementById('summary-content').classList.remove('hidden');
        
        const avgQual = state.qualityLog.length > 0 ? (state.qualityLog.reduce((a,b)=>a+b)/state.qualityLog.length).toFixed(0) : 0;
        document.getElementById('stats-summary').innerHTML = `
            <p style="font-size:2rem">${state.reps} Repeticiones</p>
            <p>Calidad Promedio: ${avgQual}%</p>
            <p>Precisión de técnica: ${avgQual > 70 ? 'ALTA' : 'MEJORABLE'}</p>
        `;
    }

    // --- PROCESAMIENTO IA ---
    function onResults(results) {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);

        if (results.poseLandmarks) {
            const lm = results.poseLandmarks;
            drawSkeleton(lm);

            if (state.isRunning) {
                analyzeSquat(lm);
            }
        }
        ctx.restore();
    }

    function analyzeSquat(lm) {
        const hip = lm[24].y;
        const knee = lm[26].y;
        const shoulder = lm[12].y;

        // Suavizado de datos para evitar saltos (EMA)
        state.smoothKnee = (knee * 0.2) + (state.smoothKnee * 0.8);

        const currentROM = Math.min(Math.max((hip - shoulder) / (knee - shoulder) * 100, 0), 100);
        
        // Lógica de repetición
        if (state.stage === 'up' && hip > knee - 0.05) {
            state.stage = 'down';
        }

        if (state.stage === 'down' && hip < knee - 0.15) {
            state.reps++;
            state.stage = 'up';
            state.qualityLog.push(currentROM);
            document.getElementById('rep-count').innerText = state.reps;
            
            if(currentROM > 85) {
                speak("¡Perfecta!");
            } else {
                speak("Buena, pero intenta bajar un poco más");
            }
        }
    }

    function drawSkeleton(lm) {
        ctx.strokeStyle = state.stage === 'down' ? "var(--zen)" : "white";
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';
        
        const connections = [[11,12], [11,23], [12,24], [23,24], [11,13], [13,15], [12,14], [14,16], [23,25], [25,27], [24,26], [26,28]];
        connections.forEach(([a,b]) => {
            if(lm[a].visibility > 0.6 && lm[b].visibility > 0.6) {
                ctx.beginPath();
                ctx.moveTo(lm[a].x * canvas.width, lm[a].y * canvas.height);
                ctx.lineTo(lm[b].x * canvas.width, lm[b].y * canvas.height);
                ctx.stroke();
            }
        });
    }

    async function main() {
        await setupCamera();
        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
        pose.onResults(onResults);
        
        const detect = async () => {
            await pose.send({ image: video });
            requestAnimationFrame(detect);
        };
        detect();
    }

    main();
  </script>
</body>
</html>
