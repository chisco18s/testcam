<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPECTRAL AI - PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <style>
        :root { --main: #00ff41; --danger: #ff3e3e; --glass: rgba(0, 15, 0, 0.85); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: #000; color: var(--main); overflow: hidden; width: 100vw; height: 100vh; }

        /* Efecto Glitch y Video */
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; transition: filter 0.3s; }
        .glitch-active { animation: glitch-anim 0.2s infinite; filter: hue-rotate(90deg) contrast(2) !important; }
        
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }

        #canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* HUD Profesional */
        #hud-top { 
            position: absolute; top: 0; width: 100%; display: grid; grid-template-columns: 1fr 1fr;
            z-index: 20; padding: 50px 20px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
        }
        .stat { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-size: 16px; font-weight: bold; color: #fff; }

        /* Controles */
        #ui-layer { position: absolute; bottom: 100px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 30; }
        .btn { 
            background: var(--glass); border: 1px solid var(--main); color: var(--main); 
            padding: 12px; font-size: 10px; border-radius: 4px; backdrop-filter: blur(5px);
        }
        .btn.active { background: var(--main); color: #000; box-shadow: 0 0 15px var(--main); }

        /* Registro de Alertas */
        #registry { 
            position: absolute; bottom: 100px; left: 20px; width: 60%;
            height: 90px; background: rgba(0,0,0,0.4); border-left: 3px solid var(--danger); 
            padding: 10px; z-index: 25; overflow: hidden; font-size: 10px;
            display: flex; flex-direction: column-reverse;
        }

        /* Etiqueta de Entidad (Fija por sesión) */
        .entity-tag { 
            position: absolute; color: #fff; padding: 6px 15px; 
            border: 1px solid var(--danger); background: rgba(255, 0, 0, 0.3); 
            z-index: 40; font-size: 12px; font-weight: bold; pointer-events: none;
        }

        .bottom-ui { 
            position: fixed; bottom: 0; width: 100%; height: 80px; 
            background: #000; z-index: 50; display: flex; justify-content: space-between; 
            align-items: center; padding: 0 30px; border-top: 1px solid var(--main);
        }
        .capture-btn { width: 55px; height: 55px; background: var(--danger); border: 4px solid #fff; border-radius: 50%; }

        #start-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="start-screen">
    <button onclick="init()" class="btn" style="font-size: 1.2rem; padding: 20px 40px;">INICIALIZAR ESCÁNER</button>
</div>

<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud-top">
    <div><div class="stat">Frecuencia Espectral</div><div id="emf" class="val">0.00 μT</div></div>
    <div style="text-align: right;"><div class="stat">Estado Sistema</div><div id="threat" class="val" style="color:var(--main)">PASSIVE</div></div>
</div>

<div id="ui-layer">
    <button class="btn active" onclick="setFilter('normal', this)">NORMAL</button>
    <button class="btn" onclick="setFilter('night', this)">NIGHT</button>
    <button class="btn" onclick="setFilter('thermal', this)">THERM</button>
</div>

<div id="registry"></div>
<div id="entity-tag" class="entity-tag" style="display:none"></div>

<div class="bottom-ui">
    <div style="font-size: 9px;">SIGNAL: STABLE<br>GPS: ENCRYPTED</div>
    <button class="capture-btn" onclick="takePhoto()"></button>
    <div style="text-align:right"><div class="stat">TIME</div><div id="clock" style="font-size: 14px; color:#fff">00:00:00</div></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const registry = document.getElementById('registry');
    const tag = document.getElementById('entity-tag');
    let audioCtx = null;
    
    // VARIABLES DE CONTROL DE ENTIDAD
    let currentEntityName = ""; 
    let isDetecting = false;

    const PREFIX = ["ANOMALÍA", "PRESENCIA", "ENTIDAD", "MANIFESTACIÓN", "ECO"];
    const TYPE = ["ECTOPLÁSMICA", "RESIDUAL", "CLASE-V", "DIMENSIONAL", "KINETICA"];
    const CODES = ["AX-9", "Ω-01", "B-742", "VOID", "S-TYPE"];

    function generateStaticName() {
        return `${PREFIX[Math.floor(Math.random()*PREFIX.length)]} ${TYPE[Math.floor(Math.random()*TYPE.length)]} [${CODES[Math.floor(Math.random()*CODES.length)]}]`;
    }

    function setFilter(type, btn) {
        video.style.filter = type === 'night' ? 'brightness(2) sepia(1) hue-rotate(70deg)' : 
                             type === 'thermal' ? 'contrast(3) hue-rotate(240deg)' : 'none';
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function sound(f, d) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = f;
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    async function init() {
        document.getElementById('start-screen').style.display = 'none';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.play();
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
        pose.onResults(onResults);

        const frame = async () => {
            if(video.readyState === 4) await pose.send({ image: video });
            requestAnimationFrame(frame);
        };
        frame();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    }

    function onResults(res) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (res.poseLandmarks) {
            // Si es una nueva detección, genera el nombre UNA SOLA VEZ
            if (!isDetecting) {
                currentEntityName = generateStaticName();
                isDetecting = true;
                addLog(currentEntityName);
                sound(150, 0.5); // Sonido bajo de detección
                video.classList.add('glitch-active');
                setTimeout(() => video.classList.remove('glitch-active'), 1000);
            }
            drawGhost(res.poseLandmarks);
            updateHUD(true);
        } else {
            // Cuando se pierde el rastro, reiniciamos el estado
            isDetecting = false;
            currentEntityName = "";
            tag.style.display = 'none';
            updateHUD(false);
        }
    }

    function drawGhost(lm) {
        const head = lm[0];
        tag.style.display = 'block';
        tag.style.left = (head.x * canvas.width) + 'px';
        tag.style.top = (head.y * canvas.height - 40) + 'px';
        tag.innerText = currentEntityName;

        ctx.strokeStyle = "rgba(0, 255, 65, 0.6)";
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        lm.forEach((p, i) => {
            const x = p.x * canvas.width;
            const y = p.y * canvas.height;
            ctx.lineTo(x, y);
            if(Math.random() > 0.95) { // Pequeños saltos de "error" en el dibujo
                ctx.moveTo(x + 10, y - 10);
            }
        });
        ctx.stroke();
    }

    function addLog(msg) {
        const item = document.createElement('div');
        item.style.color = "var(--danger)";
        item.innerHTML = `> [ALERTA] ${msg}`;
        registry.prepend(item);
        if (registry.children.length > 4) registry.lastChild.remove();
    }

    function updateHUD(det) {
        const emf = det ? (20 + Math.random()*50).toFixed(2) : (Math.random()*1.5).toFixed(2);
        document.getElementById('emf').innerText = emf + " μT";
        const th = document.getElementById('threat');
        th.innerText = det ? "ACTIVE" : "PASSIVE";
        th.style.color = det ? "var(--danger)" : "var(--main)";
    }

    function takePhoto() {
        sound(1000, 0.1);
        alert("Evidencia Guardada en Memoria Local");
    }
</script>
</body>
</html>
