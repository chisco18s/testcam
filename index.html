<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>AI Boxing Corner</title>
  <style>
    :root { --neon: #00f2ff; --boxing-red: #ff3c3c; --zen: #00ff88; --warning: #ffcc00; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Oswald', sans-serif; }
    body { background: #000; color: white; overflow: hidden; }

    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.4; }
    #canvas { position: absolute; width: 100%; height: 100%; z-index: 5; }

    /* HUD BOXEO */
    #hud { position: absolute; top: 20px; width: 100%; padding: 0 30px; z-index: 10; display: none; }
    .stat-card { background: rgba(20,20,20,0.85); padding: 15px; border-radius: 10px; border-top: 4px solid var(--boxing-red); min-width: 120px; text-align: center; }
    .val { font-size: 35px; font-weight: 900; display: block; }
    .lab { font-size: 12px; color: var(--boxing-red); text-transform: uppercase; }

    /* INSTRUCCIONES CENTRALES */
    #instruction-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; z-index: 50; pointer-events: none;
    }
    #big-msg { font-size: 4rem; font-weight: 900; text-shadow: 0 0 20px var(--boxing-red); color: white; }

    .btn-start { background: var(--boxing-red); color: white; padding: 20px 60px; border-radius: 5px; font-size: 2rem; border: none; cursor: pointer; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="menu" class="overlay">
    <h1 style="font-size: 3rem; margin-bottom: 20px;">AI BOXING SENSEI</h1>
    <p style="margin-bottom: 40px; color: #888;">Circuito: Boxeo → Sentadillas → Abdominales</p>
    <button class="btn-start" onclick="startCircuit()">EMPEZAR ROUND</button>
  </div>

  <div id="hud">
    <div style="display: flex; justify-content: space-between;">
      <div class="stat-card"><span class="lab">Fase Actual</span><span id="ui-phase" class="val" style="font-size: 20px;">BOXEO</span></div>
      <div class="stat-card" style="border-color: var(--neon);"><span class="lab">Conteo</span><span id="ui-reps" class="val">0</span></div>
      <div class="stat-card" style="border-color: var(--warning);"><span class="lab">Tiempo</span><span id="ui-timer" class="val">45</span></div>
    </div>
  </div>

  <div id="instruction-overlay">
    <div id="big-msg"></div>
  </div>

  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>

  <script>
    const state = {
        phase: 'boxing', // boxing, squats, abs
        active: false,
        reps: 0,
        timer: 45,
        lastSpeak: 0,
        stage: 'guard'
    };

    const dom = {
        video: document.getElementById('video'),
        canvas: document.getElementById('canvas'),
        ctx: document.getElementById('canvas').getContext('2d'),
        msg: document.getElementById('big-msg')
    };

    function speak(txt) {
        if (Date.now() - state.lastSpeak < 2500) return;
        state.lastSpeak = Date.now();
        const s = new SpeechSynthesisUtterance(txt);
        s.lang = 'es-ES';
        window.speechSynthesis.speak(s);
        dom.msg.innerText = txt.toUpperCase();
        setTimeout(() => dom.msg.innerText = "", 2000);
    }

    async function startCircuit() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('hud').style.display = 'block';
        
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        dom.video.srcObject = stream;
        await dom.video.play();
        dom.canvas.width = dom.video.videoWidth;
        dom.canvas.height = dom.video.videoHeight;

        initAI();
        runTimer();
    }

    function runTimer() {
        state.active = true;
        speak("¡Ronda uno! Boxeo de sombra. ¡Mantén la guardia arriba!");
        
        const clock = setInterval(() => {
            state.timer--;
            document.getElementById('ui-timer').innerText = state.timer;

            if (state.timer === 0) {
                if (state.phase === 'boxing') {
                    state.phase = 'squats';
                    state.timer = 30;
                    state.reps = 0;
                    speak("¡Tiempo! Ahora 30 segundos de sentadillas. ¡Baja esa cadera!");
                } else if (state.phase === 'squats') {
                    state.phase = 'abs';
                    state.timer = 30;
                    speak("¡Al suelo! Abdominales libres. ¡Sigue mi voz!");
                } else {
                    clearInterval(clock);
                    finish();
                }
            }
            document.getElementById('ui-phase').innerText = state.phase.toUpperCase();
        }, 1000);
    }

    function finish() {
        state.active = false;
        speak("Entrenamiento completado. Eres un campeón.");
        location.reload();
    }

    function analyzePose(lm) {
        const ctx = dom.ctx;
        
        // --- LÓGICA DE BOXEO ---
        if (state.phase === 'boxing') {
            const leftElbow = getAngle(lm[11], lm[13], lm[15]);
            const rightElbow = getAngle(lm[12], lm[14], lm[16]);
            const guardUp = (lm[15].y < lm[0].y) && (lm[16].y < lm[0].y);

            if (!guardUp && Math.random() < 0.01) speak("¡Sube las manos! Protege tu cara.");

            // Detección de golpe (Extensión explosiva)
            if (state.stage === 'guard' && (leftElbow > 160 || rightElbow > 160)) {
                state.reps++;
                state.stage = 'punch';
                document.getElementById('ui-reps').innerText = state.reps;
            } else if (leftElbow < 90 && rightElbow < 90) {
                state.stage = 'guard';
            }
        }

        // --- LÓGICA DE SENTADILLAS ---
        if (state.phase === 'squats') {
            const knee = getAngle(lm[24], lm[26], lm[28]);
            if (state.stage === 'up' && knee < 100) state.stage = 'down';
            if (state.stage === 'down' && knee > 150) {
                state.reps++; state.stage = 'up';
                document.getElementById('ui-reps').innerText = state.reps;
            }
        }
    }

    function drawBoxingVisuals(lm) {
        const ctx = dom.ctx;
        // Dibujar "Guantes"
        [[15, 'red'], [16, 'blue']].forEach(([idx, color]) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(lm[idx].x * dom.canvas.width, lm[idx].y * dom.canvas.height, 35, 0, Math.PI * 2);
            ctx.fill();
            // Brillo
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.stroke();
        });
    }

    function getAngle(p1, p2, p3) {
        const rad = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
        let ang = Math.abs(rad * 180 / Math.PI);
        if (ang > 180) ang = 360 - ang;
        return ang;
    }

    function initAI() {
        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6 });
        
        pose.onResults(results => {
            if (!results.poseLandmarks) return;
            const lm = results.poseLandmarks;
            dom.ctx.save();
            dom.ctx.clearRect(0, 0, dom.canvas.width, dom.canvas.height);
            dom.ctx.translate(dom.canvas.width, 0); dom.ctx.scale(-1, 1);
            
            analyzePose(lm);
            if (state.phase === 'boxing') drawBoxingVisuals(lm);
            
            dom.ctx.restore();
        });

        const frame = async () => {
            if (state.active) await pose.send({ image: dom.video });
            requestAnimationFrame(frame);
        };
        frame();
    }
  </script>
</body>
</html>
