<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  let poseDetector = null;
  let count = 0;
  let stage = "up";

  document.body.addEventListener(
    "click",
    () => {
      video.play();
    },
    { once: true }
  );

  async function init() {
    poseDetector = new Pose({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.4/${file}`,
    });

    poseDetector.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });

    poseDetector.onResults(onResults);

    await setupCamera();
    requestAnimationFrame(loop);
  }

  async function setupCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 },
      },
    });

    video.srcObject = stream;
    video.setAttribute("playsinline", true);

    return new Promise((res) => {
      video.onloadedmetadata = () => {
        video.play();
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        res();
      };
    });
  }

  function loop() {
    if (video.readyState >= 2) {
      poseDetector.send({ image: video });
    }
    requestAnimationFrame(loop);
  }

  function onResults(results) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!results.poseLandmarks || results.poseLandmarks.length < 33) return;

    const lm = results.poseLandmarks;

    const hip = lm[24];
    const knee = lm[26];

    if (hip.y > knee.y) {
      stage = "down";
    }

    if (hip.y < knee.y - 0.15 && stage === "down") {
      stage = "up";
      count++;
      document.getElementById("count-val").innerText = count;
    }

    drawSkeleton(lm);
  }

  function drawSkeleton(lm) {
    ctx.strokeStyle = "#00f2ff";
    ctx.lineWidth = 4;

    const connections = [
      [11, 12],
      [23, 24],
      [23, 25],
      [25, 27],
      [24, 26],
      [26, 28],
    ];

    connections.forEach(([a, b]) => {
      ctx.beginPath();
      ctx.moveTo(lm[a].x * canvas.width, lm[a].y * canvas.height);
      ctx.lineTo(lm[b].x * canvas.width, lm[b].y * canvas.height);
      ctx.stroke();
    });
  }

  init();
</script>
